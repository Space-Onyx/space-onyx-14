- type: Interaction
  id: Slap
  parent: [BaseGlobal, BaseHands]
  priority: 1
  cooldown: 2
  range: {max: 1}
  effectSuccess:
    popup: Dangerous
    sound: {path: /Audio/Effects/Footsteps/meatslap.ogg}
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement
    inverted: true
  action:
    !type:ComplexAction
    actions:
    - !type:ModifyHealthAction
      damage:
        types: {Blunt: 1}
    - !type:JitterAction
      time: 0.3

