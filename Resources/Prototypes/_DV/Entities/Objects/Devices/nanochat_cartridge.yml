- type: entity
  parent: BasePDACartridge
  id: NanoChatCartridge
  name: NanoChat cartridge
  description: Lets you message other people!
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    ui: !type:NanoChatUi
  - type: NanoChatCartridge
  - type: Cartridge
    programName: nano-chat-program-name
    icon:
      sprite: _DV/Misc/program_icons.rsi
      state: nanochat
  - type: ActiveRadio
    channels:
    - Common
