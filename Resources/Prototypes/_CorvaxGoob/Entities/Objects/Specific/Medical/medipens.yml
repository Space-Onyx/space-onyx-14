- type: entity
  parent: BaseHypoInjector
  id: FillableMedipen
  name: fillable chemical medipen
  description: A reusable medipen filled with a medipen refiller.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.MedipenVisualLayer.Fill"]
    - state: medipen_visual
      map: ["enum.MedipenColorLayer.Fill"]
    - state: medipen_solution-1
      map: ["enum.SolutionContainerLayers.Fill"]
    - state: medipen_empty
      map: ["enum.MedipenVisualLayer.Empty"]
      visible: false
    - state: medipen_empty_visual
      map: ["enum.MedipenColorLayer.Empty"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.MedipenVisualLayer.Fill:
        enum.MedipenVisualLayer.Fill:
          False: { visible: false }
          True: { visible: true }
        enum.MedipenColorLayer.Fill:
          False: { visible: false }
          True: { visible: true }
        enum.MedipenVisualLayer.Empty:
          False: { visible: true }
          True: { visible: false }
        enum.MedipenColorLayer.Empty:
          False: { visible: true }
          True: { visible: false }
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    solutionName: hypospray
    fillBaseName: medipen_solution-
    changeColor: true
  - type: Medipen
  - type: Item
    sprite: _CorvaxGoob/Objects/Specific/Medical/medipen.rsi
    size: Tiny
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 15
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Solution
    solution:
      maxVol: 15
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 150
