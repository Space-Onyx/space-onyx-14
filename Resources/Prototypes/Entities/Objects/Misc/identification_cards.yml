- type: entity
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Misc/id_cards.rsi # <Onyx-IdCards-edited>
  - type: Clothing
    slots:
    - idcard
    sprite: _Onyx/Objects/Misc/id_cards.rsi # <Onyx-IdCards-edited>
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  # <Onyx-SalvageMiningPoints>
  - type: MiningPoints
  # </Onyx-SalvageMiningPoints>
  - type: BitrunningPoints # <Onyx-Bitrunning>
  # <Onyx-NanoChat-edited>
  - type: NanoChatCard
  # </Onyx-NanoChat-edited>
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StealTarget
    stealGroup: IDCard

