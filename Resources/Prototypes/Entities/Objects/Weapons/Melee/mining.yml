- type: entity
  name: pickaxe
  parent: BaseItem
  id: Pickaxe
  description: Notched to perfection, for jamming it into rocks.
  components:
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    attackRate: 0.7
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    damage:
      types:
        Piercing: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
        Structural: 30
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    - 1,1,1,2
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    storedRotation: -45
  - type: UseDelay
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Wood: 100

- type: entity
  name: mining drill
  parent: BaseItem
  id: MiningDrill
  description: Powerful tool used to quickly drill through rocks.
  components:
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: Objects/Tools/handdrill.rsi
    state: handdrill
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 4
    damage:
      types:
        Piercing: 3
        Structural: 15

- type: entity
  name: diamond tipped mining drill
  parent: MiningDrill
  id: MiningDrillDiamond
  description: A significantly more efficient mining drill tipped with diamond.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrilldiamond.rsi
    state: handdrill
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 4
    damage:
      types:
        Piercing: 6
        Structural: 30


# _Onyx-CrusherUpgrades-start
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWeaponCrusher # Crusher? But I...
  name: crusher
  description: An early design of the proto-kinetic accelerator.
  components:
  - type: Appearance
  - type: Tool
    qualities:
    - Slicing
  - type: Execution
    doAfterDuration: 4.0
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false
    radius: 4
  - type: Item
    size: Ginormous
  - type: Sharp
  - type: DisarmMalus
  - type: Prying
  - type: MeleeWeapon
    range: 2
    attackRate: 1
    animationRotation: -135
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 1
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: UseDelayBlockMelee
  - type: UseDelay
    delay: 1
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: ItemUpgradeable
  - type: CrusherUpgradeOwnership
  - type: ContainerContainer
    containers:
      upgrade_slot_main: !type:ContainerSlot
      upgrade_slot_blade: !type:ContainerSlot
      upgrade_slot_handle: !type:ContainerSlot
  - type: ItemSlots
    slots:
      upgrade_slot_main:
        name: crusher-upgrade-slot-main
        swap: false
        priority: 3
        insertDelay: 3
        ejectDelay: 1.8
        whitelist: { tags: [ CrusherUpgradeMain ] }
      upgrade_slot_blade:
        name: crusher-upgrade-slot-blade
        swap: false
        priority: 2
        insertDelay: 2.4
        ejectDelay: 1.2
        whitelist: { tags: [ CrusherUpgradeBlade ] }
      upgrade_slot_handle:
        name: crusher-upgrade-slot-handle
        swap: false
        priority: 1
        insertDelay: 2.4
        ejectDelay: 1.2
        whitelist: { tags: [ CrusherUpgradeHandle ] }
  - type: ItemMapper
    mapLayers:
      upgrade-marker: { whitelist: { tags: [ CrusherUpgradeMainMarker ] } }
      upgrade-rude-buster: { whitelist: { tags: [ CrusherUpgradeMainRudeBuster ] } }
      upgrade-lava-aspect: { whitelist: { tags: [ CrusherUpgradeBladeLavaAspect ] } }
      upgrade-ice-frost: { whitelist: { tags: [ CrusherUpgradeBladeIceFrost ] } }
      upgrade-sharpness: { whitelist: { tags: [ CrusherUpgradeBladeSharpness ] } }
      upgrade-handle-weights: { whitelist: { tags: [ CrusherUpgradeHandleWeights ] } }
      upgrade-handle-lightweight: { whitelist: { tags: [ CrusherUpgradeHandleLightweight ] } }
      upgrade-handle-range: { whitelist: { tags: [ CrusherUpgradeHandleRange ] } }
# _Onyx-CrusherUpgrades-end

# Very high burst damage if you land a mark, while also providing a small amount of healing.
- type: entity
  parent: [BaseWeaponCrusher, BaseSecurityCargoContraband]
  id: WeaponCrusher
  components:
  - type: Tag
    tags:
      - Pickaxe
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Crushers/crusher.rsi # _Onyx-CrusherUpgrades
    state: icon
  - type: Item
    size: Ginormous
    sprite: _Onyx/Objects/Weapons/Crushers/crusher-inhands.rsi # _Onyx-CrusherUpgrades
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Crushers/crusher.rsi # _Onyx-CrusherUpgrades
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
  - type: MeleeWeapon
    attackRate: 1
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 6
        Slash: 4
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6
        Slash: 2
        Structural: 30

# No mark ability in exchange for wideswing, autoattack, and being one-handed
- type: entity
  parent: [ BaseKnife, BaseSecurityCargoContraband] # _Onyx-CrusherUpgrades: dagger remains a secondary, not a modular crusher.
  id: WeaponCrusherDagger
  name: crusher dagger
  description: A scaled down version of a proto-kinetic crusher. Uses kinetic energy to vibrate the blade at high speeds.
  components:
  - type: Tool
    qualities: [ Slicing ]
  - type: Execution
    doAfterDuration: 4
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false
    radius: 4
  - type: Sprite
    sprite: Objects/Weapons/Melee/crusher_dagger.rsi
    state: icon
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -135
    attackRate: 2
    damage:
      types:
        Slash: 12
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

# Less mark damage in exchange for more healing. Also has a better ratio of blunt to slash damage, but less structural.
- type: entity
  parent: WeaponCrusher
  id: WeaponCrusherGlaive
  name: crusher glaive
  description: An early design of the proto-kinetic accelerator, in glaive form. Provides better healing in exchange for less charged damage.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Crushers/crusher_glaive.rsi # _Onyx-CrusherUpgrades
    state: icon
  - type: Item
    size: Ginormous
    sprite: _Onyx/Objects/Weapons/Crushers/crusher_glaive-inhands.rsi # _Onyx-CrusherUpgrades
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Crushers/crusher_glaive.rsi # _Onyx-CrusherUpgrades
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: UseDelay
    delay: 1.9
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
  - type: Tag
    tags:
      - Pickaxe
  - type: MeleeWeapon
    attackRate: 1
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 3
        Slash: 7
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2
        Slash: 6
        Structural: 20
