- type: entity
  parent: BaseItem
  id: TravelCamera
  name: travel camera
  description: A picture says more than a thousand words. Uses paper for printing.
  components:
  # <Onyx-PhotoCamera-edited>
  - type: Eye
  - type: PhotoCamera
  - type: ActivatableUI
    key: enum.PhotoCameraUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.PhotoCameraUiKey.Key:
        type: PhotoCameraBoundUserInterface
  - type: MaterialStorage
    whitelist:
      tags:
      - Paper
    blacklist:
      tags:
      - InfinityPaper
    storage:
      Paper: 400
  - type: Sprite
    sprite: Objects/Devices/travel_camera.rsi
    state: icon
  - type: MeleeWeapon # allows using the camera in melee
    damage:
      types:
        Blunt: 0
  - type: UseDelay
  # </Onyx-PhotoCamera-edited>
  - type: StaticPrice
    price: 100
  - type: Clothing
    slots:
    - NECK
    sprite: Objects/Devices/travel_camera.rsi

# we have a base prototype so that if we need to add components later on its easier
- type: entity
  abstract: true
  parent: BasePaper
  id: BasePhotograph
  name: photograph
  components:
  # <Onyx-PhotoCamera>
  - type: Item
    inhandVisuals:
      left:
      - state: paper-inhand-left
        sprite: Objects/Misc/bureaucracy.rsi
      right:
      - state: paper-inhand-right
        sprite: Objects/Misc/bureaucracy.rsi
  # </Onyx-PhotoCamera>

- type: entity
  parent: BasePhotograph
  id: PhotographBlack
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: black

- type: entity
  parent: BasePhotograph
  id: PhotographRed
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: red

- type: entity
  parent: BasePhotograph
  id: PhotographBlue
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: blue

- type: entity
  parent: BasePhotograph
  id: PhotographGreen
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: green

- type: entity
  parent: BasePhotograph
  id: PhotographYellow
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: yellow

- type: entity
  parent: BasePhotograph
  id: PhotographPurple
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: purple

- type: entity
  parent: BasePhotograph
  id: PhotographRainbow
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: rainbow

- type: entityTable
  id: TravelCameraPhotographs
  table: !type:GroupSelector
    children:
    - id: PhotographBlack
    - id: PhotographRed
    - id: PhotographBlue
    - id: PhotographGreen
    - id: PhotographYellow
    - id: PhotographPurple
    - id: PhotographRainbow
