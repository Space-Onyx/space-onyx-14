    transferDamageModifier:
      coefficients:
        Blunt: 0.1
        Slash: 0.1
        Piercing: 0.1
        Cold: 0.1
        Heat: 0.1
        Shock: 0.1
    operatorWhitelist:
      tags:
      - VimPilot
  - type: MeleeWeapon
    hidden: true
    attackRate: 0.8
    damage:
      types:
        Blunt: 10 #thwack
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8 # <MechSpeed-edited>
    baseSprintSpeed: 2.8 # <MechSpeed-edited>
  - type: Access
    tags:
    - Maintenance
  # TOOD: buzz / chime actions
  # TODO: builtin flashlight

- type: entity
