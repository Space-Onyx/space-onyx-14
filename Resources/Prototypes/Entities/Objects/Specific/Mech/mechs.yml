- type: entity
  abstract: true
  parent: StructureHealthMachineMassive
  id: BaseMech
  save: false
  components:
  - type: MobMover
  - type: Mech
    # <MechPilotBlacklist>
    pilotBlacklist:
      components:
      - Zombie
    # </MechPilotBlacklist>
  - type: MechAir
  # <Onyx-MechFeedback>
  - type: Speech
  - type: SpeechBarks
    data:
      proto: OneshotRobot
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalThud
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
      Burn:
        collection: MetalLaserImpact
  # </Onyx-MechFeedback>
  - type: Vehicle
    canAttack: true
  - type: ContainerVehicle
    containerId: "mech-pilot-slot"
  - type: ContainerVehicleEntry
  - type: AirFilter
    # everything except oxygen and nitrogen
    gases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    # <MechBalance>
    - BZ
    - Nitrium
    # </MechBalance>
    #- Helium3 TODO: fusion
    # remove everything except oxygen to maintain oxygen ratio
    overflowGases:
    - Nitrogen
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    # <MechBalance>
    - BZ
    - Healium
    - Nitrium
    - Pluoxium
    # </MechBalance>
    #- Helium3 TODO: fusion
  - type: AirIntake
  # for intake and filter to work
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: DoAfter
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 10
  - type: UserInterface
    interfaces:
      enum.MechUiKey.Key:
        type: MechBoundUserInterface
      enum.MechUiKey.EquipmentSelector: # <MechEquipmentSelector>
        type: MechEquipmentSelectorBoundUserInterface
  - type: MeleeWeapon
    hidden: true
    animation: WeaponArcPunch # <Onyx-MechUnarmed-edited>
    wideAnimation: WeaponArcPunch # <Onyx-MechUnarmed-edited>
    attackRate: 0.75
    damage:
      types:
        Blunt: 25 #thwack
        Structural: 8
    soundHit:
      collection: MetalThud
  - type: Puller
    needsHands: false
  - type: InputMover
  - type: InteractionOutline
  # <MechLights>
  - type: UnpoweredFlashlight
    addToggleVerb: false
  - type: PointLight
    enabled: false
    softness: 5
    autoRot: true
    lightMask: ConeSingle
    radius: 7
    energy: 3
  # </MechLights>
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.25 # <MechSpeed-edited>
    baseSprintSpeed: 1.25 # <MechSpeed-edited>
  # <MechSprint>
  - type: Sprinter
    sprintSpeedMultiplier: 1
  - type: Stamina
  # </MechSprint>
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Pullable
  - type: Physics
    bodyType: KinematicController
  - type: GravityAffected
  - type: Clickable
  - type: WiresPanel
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: ContainerContainer
    containers:
      mech-pilot-slot: !type:ContainerSlot
      mech-equipment-container: !type:Container
      mech-battery-slot: !type:ContainerSlot
      paper_label: !type:ContainerSlot # <MechBalance>
  - type: Damageable
    damageModifierSet: SteelMod
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/mechmove03.ogg
  - type: GuideHelp
    guides:
    - Robotics
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000 # <MechBalance-edited>
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
- type: entity
  id: MechRipley
  parent: [ BaseMech, IndustrialMech, BaseCargoContraband ] # <MechBalance-edited>
  name: Ripley APLU
  description: Versatile and lightly armored, the Ripley is useful for almost any heavy work scenario. The "APLU" stands for Autonomous Power Loading Unit.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: ripley
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    baseState: ripley
    openState: ripley-open
    brokenState: ripley-broken
  # <Onyx-MechHandBlockerInheritance-edited>
  - type: Vehicle
    transferDamageModifier:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.75
        Cold: 0.75
        Heat: 0.75
        Shock: 0.75
    operatorWhitelist:
      components:
        - HumanoidProfile
  # </Onyx-MechHandBlockerInheritance-edited>
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 25 # <MechBalance-edited>
        Structural: 30 # <MechBalance>
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8 # <MechSpeed-edited>
    baseSprintSpeed: 2.8 # <MechSpeed-edited>

- type: entity
  id: MechRipleyBattery
  parent: MechRipley
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCellHigh

