- type: entity
  id: Vaccinator
  # <Onyx-VirologyMachineConstruction-edited>
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  # </Onyx-VirologyMachineConstruction-edited>
  name: vaccinator
  description: A machine that creates vaccines.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/vaccinator.rsi
    layers:
    - state: icon
    # <Onyx-VirologyMachineAnimations-edited>
    - state: running
      visible: false
      map: ["running"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    # </Onyx-VirologyMachineAnimations-edited>
  - type: Appearance
  # <Onyx-VirologyMachineAnimations>
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.DiseaseMachineVisuals.IsRunning:
        running:
          True: { visible: true }
          False: { visible: false }
  # </Onyx-VirologyMachineAnimations>
  - type: VirologyMachine
    vaccinator: true
  # <Onyx-VirologyMachineItemSlots>
  - type: ItemSlots
  # </Onyx-VirologyMachineItemSlots>
  - type: Machine
    board: VaccinatorMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: RequireProjectileTarget
