- type: entity
  id: Vaccinator
  # <Onyx-VirologyMachineConstruction-edited>
  parent: [ BaseMachinePowered, BaseMachineDestructible, SmallConstructibleMachine ]
  # </Onyx-VirologyMachineConstruction-edited>
  name: vaccinator
  description: A machine that creates vaccines.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/vaccinator.rsi
    layers:
    - state: icon
    # <Onyx-VirologyMachineAnimations-edited>
    - state: running
      visible: false
      map: ["running"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    # </Onyx-VirologyMachineAnimations-edited>
  - type: Appearance
  # <Onyx-VirologyMachineAnimations>
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.DiseaseMachineVisuals.IsRunning:
        running:
          True: { visible: true }
          False: { visible: false }
  # </Onyx-VirologyMachineAnimations>
  # <Onyx-VirologyMachines>
  - type: VirologyMachine
    vaccinator: true
    analysisDuration: 20
    swabSlot:
      occludesLight: true
      insertSound: !type:SoundPathSpecifier
        path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
      ejectSound: !type:SoundPathSpecifier
        path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
      insertOnInteract: true
      swap: true
      whitelist:
        components:
        - DiseaseSwab
  - type: ItemSlots
    slots:
      disease_swab_slot:
        name: Swab
        whitelist:
          components:
          - DiseaseSwab
  # </Onyx-VirologyMachines>
  - type: Machine
    board: VaccinatorMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      disease_swab_slot: !type:ContainerSlot
  - type: RequireProjectileTarget
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
