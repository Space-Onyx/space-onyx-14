- type: entity
  parent: BaseComputerAiAccess
  id: DnaModifierConsole
  name: DNA-modifier console
  description: This interface is used to change the structure of DNA.
  components:
  - type: DnaClient
  - type: DnaModifierConsole
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: dna
    - map: ["computerLayerKeys"]
      state: rd_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: ActivatableUI
    singleUser: true
    key: enum.DnaModifierUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DnaModifierUiKey.Key:
        type: DnaModifierBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DnaModifierComputerCircuitboard
  - type: DeviceLinkSource
    range: 4
    ports:
    - MedicalScannerSender
  - type: AccessReader
    access: [["Research"]]
  - type: ContainerContainer
    containers:
      diskSlot: !type:ContainerSlot
      board: !type:Container
  - type: ItemSlots
    slots:
      diskSlot:
        whitelist:
          components:
          - DnaModifierDisk
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b53ca1"
  - type: GuideHelp
    guides:
    - Genetic

- type: entity
  id: DnaModifierConsoleTabletop
  parent: [BaseStructureComputerTabletop, DnaModifierConsole]
  suffix: Tabletop
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Onyx/Structures/Machines/computer_tabletop.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: Structures/Machines/computers.rsi
      state: dna
    - map: ["computerLayerKeys"]
      sprite: Structures/Machines/computers.rsi
      state: rd_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      sprite: Structures/Machines/computers.rsi
      state: generic_panel_open
