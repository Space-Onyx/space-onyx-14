- type: entity
  parent:
  - AppearanceVulpkanin
  - BaseSpeciesMobOrganic
  id: MobVulpkanin
  name: Urist McArfArf
  components:
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        # <Onyx-GroinDamageVisuals-edited>
        sprite: _Onyx/Wounds/brute_damage.rsi
        # </Onyx-GroinDamageVisuals-edited>
        color: "#ccac1f"
      Burn:
        # <Onyx-GroinDamageVisuals-edited>
        sprite: _Onyx/Wounds/burn_damage.rsi
        # </Onyx-GroinDamageVisuals-edited>
  - type: MessyDrinker
    spillChance: 0.33
  - type: Speech
    speechSounds: Vulpkanin
    speechVerb: Vulpkanin
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl', 'Awoo' ] # <Onyx-RacialEmoteSounds-edited>
  - type: TypingIndicator
    proto: vulpkanin
  - type: Vocal
    emoteSounds: MaleVulpkanin
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, Canilunzt]
    understands: [TauCetiBasic, Canilunzt]
  # </Onyx-Languages>
  - type: Damageable
    damageModifierSet: Vulpkanin
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 2
        Slash: 3
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05 # Per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 2.5 # Per second, scales with temperature & other constants
  - type: JumpAbility
    action: ActionVulpkaninGravityJump
    canCollide: true
    jumpDistance: 3
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: SulfurBlood
        Quantity: 600
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_vulpkanin
  # Corvax-Vulp_Port start
  - type: GrowlingAccent
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2.0
    damageRecovery:
      types:
        Asphyxiation: -2.0
  # Corvax-Vulp_Port end

