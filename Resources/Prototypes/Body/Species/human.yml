- type: markingsGroup
  parent: Undergarments
  id: Human
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    # <Onyx-VisualEars>
    enum.HumanoidVisualLayers.Ears:
      limit: 1
      required: false
    # </Onyx-VisualEars>
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      weight: 1
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1 # Corvax-Sponsors
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHuman
  categories: [ HideSpawnMenu ]
  name: human appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganHumanChest
      Groin: OrganHumanGroin
      # </Onyx-ChestGroin-edited>
      Tail: OrganHumanTail # <Onyx-VisualTail>
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars # <Onyx-VisualEars-edited>
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Human

- type: entity
  parent:
  - AppearanceHuman
  - BaseSpeciesMobOrganic
  id: MobHuman
  name: Urist McHands
  components:
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, SolCommon]
    understands: [TauCetiBasic, SolCommon]
  # </Onyx-Languages>
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganHuman
  abstract: true
  suffix: human

- type: entity
  id: OrganHumanMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Human ]

- type: entity
  parent: OrganHuman
  id: OrganHumanInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganHuman
  id: OrganHumanExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHumanExternal ]
  id: OrganHumanTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHumanExternal ]
  id: OrganHumanHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

