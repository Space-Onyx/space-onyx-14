- type: markingsGroup
  parent: Undergarments
  id: Diona
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Head:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 1
      required: true
      default: [ DionaVineOverlay ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDiona
  categories: [ HideSpawnMenu ]
  name: diona appearance
  components:
  - type: Inventory
    templateId: diona
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganDionaChest
      Groin: OrganDionaGroin
      # </Onyx-ChestGroin-edited>
      Head: OrganDionaHead
      ArmLeft: OrganDionaArmLeft
      ArmRight: OrganDionaArmRight
      HandRight: OrganDionaHandRight
      HandLeft: OrganDionaHandLeft
      LegLeft: OrganDionaLegLeft
      LegRight: OrganDionaLegRight
      FootLeft: OrganDionaFootLeft
      FootRight: OrganDionaFootRight
      Brain: OrganDionaBrainNymphing
      Eyes: OrganDionaEyes
      Lungs: OrganDionaLungsNymphing
      Stomach: OrganDionaStomachNymphing
  - type: HumanoidProfile
    species: Diona

- type: entity
  parent:
  - AppearanceDiona
  - BaseSpeciesMobOrganic
  id: MobDiona
  name: Urist McPlants
  components:
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Hunger
    baseDecayRate: 0.0083
  - type: Thirst
    baseDecayRate: 0.0083
  - type: Damageable
    damageModifierSet: Diona
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        # <Onyx-GroinDamageVisuals-edited>
        sprite: _Onyx/Wounds/brute_damage.rsi
        # </Onyx-GroinDamageVisuals-edited>
        color: "#cd7314"
      Burn:
        # <Onyx-GroinDamageVisuals-edited>
        sprite: _Onyx/Wounds/burn_damage.rsi
        # </Onyx-GroinDamageVisuals-edited>
  - type: Butcherable
    spawned:
      - id: FoodMeatPlant
        amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sap
        Quantity: 600
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
    - reagents: [ PlantBGone ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: 0.05
            Slash: 0.05
            Piercing: 0.075
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "diona-hurt-by-herbicide-popup" ]
        probability: 0.66
    - reagents: [ WeedKiller ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.125
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "diona-hurt-by-herbicide-popup" ]
        probability: 0.66
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300 #weighs more than humans because wood
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Speech
    speechVerb: Plant
    allowedEmotes: ['Chirp']
  - type: Vocal
    emoteSounds: UnisexDiona
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, RootSpeak]
    understands: [TauCetiBasic, RootSpeak]
  # </Onyx-Languages>
  - type: TypingIndicator
    proto: diona
  - type: BodyEmotes
    soundsId: DionaBodyEmotes
  - type: Pacified # Corvax-DionaPacifist
  - type: IgnoreKudzu
  - type: IgniteOnHeatDamage
    fireStacks: 1
    threshold: 12
  - type: GibAction
    actionPrototype: DionaGibAction
    allowedStates:
    - Dead
  - type: Rootable

