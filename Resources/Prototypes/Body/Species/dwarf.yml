- type: entity
  parent: AppearanceHuman
  id: AppearanceDwarf
  categories: [ HideSpawnMenu ]
  name: dwarf appearance
  components:
  # <Onyx-NoDwarfDisplacement>
  # Dwarfism displacement maps removed: dwarfs render at standard size via the growth/weight system.
  # </Onyx-NoDwarfDisplacement>
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganDwarfChest
      Groin: OrganDwarfGroin
      # </Onyx-ChestGroin-edited>
      Head: OrganDwarfHead
      ArmLeft: OrganDwarfArmLeft
      ArmRight: OrganDwarfArmRight
      HandRight: OrganDwarfHandRight
      HandLeft: OrganDwarfHandLeft
      LegLeft: OrganDwarfLegLeft
      LegRight: OrganDwarfLegRight
      FootLeft: OrganDwarfFootLeft
      FootRight: OrganDwarfFootRight
      Brain: OrganHumanBrain
      Eyes: OrganDwarfEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars # <Onyx-VisualEars-edited>
      Lungs: OrganHumanLungs
      Heart: OrganDwarfHeart
      Stomach: OrganDwarfStomach
      Liver: OrganDwarfLiver
      Kidneys: OrganHumanKidneys
  # <Onyx-NoDwarfDisplacement>
  # Dwarf hand displacement removed.
  # </Onyx-NoDwarfDisplacement>
  - type: HumanoidProfile
    species: Dwarf

# <Onyx-NoDwarfDisplacement>
# Dwarfism displacementData removed.
# </Onyx-NoDwarfDisplacement>

- type: entity
  parent:
  - AppearanceDwarf
  - MobHuman
  id: MobDwarf
  name: Urist McHands the Dwarf
  components:
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, SolCommon]
    understands: [TauCetiBasic, SolCommon]
  # </Onyx-Languages>
  # <Onyx-NoDwarfDisplacement>
  # Dwarf fixture size override removed: standard collision size.
  # </Onyx-NoDwarfDisplacement>
  - type: Vocal
    emoteSounds: UnisexDwarf
  - type: ReplacementAccent
    accent: scottish
  - type: Speech
    speechSounds: Bass
  # <Onyx-NoDwarfDisplacement>
  # Dwarfism overlays displacement removed.
  # </Onyx-NoDwarfDisplacement>
  - type: CreamPied
  - type: Damageable
  - type: Flammable
  - type: InnerBodyAnomalyVisuals

- type: entity
  parent: OrganBaseOrganic
  id: OrganDwarf
  abstract: true
  suffix: Dwarf

