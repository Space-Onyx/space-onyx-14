- type: reagent
  id: BZ
  name: reagent-name-bz
  desc: reagent-desc-bz
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#9370db"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Asphyxiation: 1
            Poison: 0.25
      - !type:ModifyStatusEffect
        minScale: 0.3
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 15
    Respiration:
      effects:
      - !type:HealthChange
        minScale: 0.5
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Asphyxiation: 1
            Poison: 0.25
      - !type:ModifyStatusEffect
        minScale: 0.3
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 15

