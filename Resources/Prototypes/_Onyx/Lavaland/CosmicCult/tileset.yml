- type: entity
  id: FloorCosmicDecay
  name: entropic decay
  description: Just one look at this sends a chill running down your spine.
  placement: { mode: SnapgridCenter }
  components:
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.5,-0.5,0.5,0.5" }
        layer: [SlipLayer]
        mask: [ItemMask]
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicdecay.rsi
    drawdepth: BelowFloor
    layers:
    - state: decay
      shader: unshaded
  - type: Icon
    sprite: _Onyx/Structures/CosmicCult/cosmicdecay.rsi
    state: full
  - type: IconSmooth
    key: decay
    base: decay
  - type: PointLight
    radius: 4.25
    energy: 1.75
    castShadows: false
    color: "#42a4ae"

- type: entity
  name: malign settee
  id: CosmicChair
  parent: SeatBase
  placement: { mode: SnapgridCenter }
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicchair.rsi
    state: chair
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 600 }
      behaviors:
      - !type:DoActsBehavior { acts: [Destruction] }

- type: entity
  parent: BaseStructure
  id: CosmicObelisk
  name: malign obelisk
  description: A mysterious yet inert structure. Unsettling.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicpillar.rsi
    offset: 0, 0.5
    state: icon
    drawdepth: Mobs
    noRot: true
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.2,-0.1,0.2,0.375" }
        mask: [LargeMobMask]
        layer: [WallLayer]

- type: entity
  id: CosmicLamp
  name: malign light
  description: A mote of un-light shimmers within.
  suffix: Always Powered
  components:
  - type: Transform
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmiclight.rsi
    drawdepth: Mobs
    layers:
    - state: base
    - state: glow
      shader: unshaded
  - type: PointLight
    color: "#42a4ae"
    energy: 2
    radius: 8
    softness: 1
    offset: "0, -0.5"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

- type: entity
  id: CosmicTable
  parent: CounterBase
  name: malign table
  description: Unfathomably, cosmically square.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmictable.rsi
  - type: Icon
    sprite: _Onyx/Structures/CosmicCult/cosmictable.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: IconSmooth
    key: cosmictable
    base: state_

- type: entity
  id: DoorCosmicCult
  parent: BaseMaterialDoorNavMap
  name: malign passageway
  description: A strange, disquieting structure.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicdoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: true
    clickOpen: true
    canCrush: true
    openSound: { path: /Audio/_Onyx/Effects/CosmicCult/door_open.ogg }
    closeSound: { path: /Audio/_Onyx/Effects/CosmicCult/door_close.ogg }
  - type: RCDDeconstructable
    deconstructable: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong

- type: entity
  parent: BaseWall
  id: WallCosmicCult
  name: malign wall
  description: A strange-looking wall that instills discomfort.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicwall.rsi
  - type: Icon
    sprite: _Onyx/Structures/CosmicCult/cosmicwall.rsi
  - type: IconSmooth
    key: cultwalls
    base: cult

- type: entity
  id: WindowCosmicCult
  name: malign pane
  description: An odd-looking window. Something about it unnerves you.
  parent: WindowRCDResistant
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Onyx/Structures/CosmicCult/cosmicwindow.rsi
  - type: Icon
    sprite: _Onyx/Structures/CosmicCult/cosmicwindow.rsi
    state: full
  - type: IconSmooth
    base: coswindow

- type: entity
  id: WindowCosmicCultDark
  name: malign pane
  suffix: Tinted
  parent: WindowCosmicCult
  components:
  - type: Sprite
    sprite: _Onyx/Structures/CosmicCult/cosmicwindow_dark.rsi
  - type: Icon
    sprite: _Onyx/Structures/CosmicCult/cosmicwindow_dark.rsi
    state: full
  - type: IconSmooth
    base: cosDwindow
