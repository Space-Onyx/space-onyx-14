- type: tile
  id: FloorCosmicGlyph
  name: tiles-cosmiccult-floor-glyph
  sprite: /Textures/_Onyx/Tiles/CosmicCult/cosmicfloor/tile_glyph.png
  baseTurf: Plating
  deconstructTools: [Prying]
  footstepSounds: { collection: FootstepTile }
  heatCapacity: 10000

