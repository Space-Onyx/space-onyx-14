- type: damageModifierSet
  id: Resin
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Heat: 2

- type: entity
  parent: BaseWall
  id: WallResin
  name: resin wall
  description: Thick resin solidified into a wall.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xeno_resin_wall.rsi
  - type: Icon
    sprite: _Onyx/Structures/Resin/xeno_resin_wall.rsi
    state: resin
  - type: IconSmooth
    key: walls
    base: resin
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger { damageType: Blunt, damage: 200 }
      behaviors:
      - !type:DoActsBehavior { acts: [Destruction] }
    - trigger: !type:DamageTypeTrigger { damageType: Heat, damage: 100 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn: { Ash: { min: 0, max: 1 } }
      - !type:DoActsBehavior { acts: [Destruction] }

- type: entity
  parent: BaseStructure
  id: ResinWeed
  name: resin floor
  description: A thick resin surface covers the floor.
  components:
  - type: Sprite
    noRot: true
    drawdepth: FloorTiles
    sprite: _Onyx/Structures/Resin/xeno_weeds.rsi
    state: weed0
  - type: Icon
    sprite: _Onyx/Structures/Resin/xeno_weeds.rsi
    state: weed0
  - type: IconSmooth
    key: cm_xeno_weeds
    base: weed_dir
    mode: CardinalFlags
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: Biological
  - type: Physics
    canCollide: false
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 18 }
      behaviors:
      - !type:DoActsBehavior { acts: [Destruction] }
  - type: FootstepModifier
    footstepSoundCollection: { collection: FootstepSlime }

- type: entity
  parent: ResinWeed
  id: ResinWeedNode
  name: glowing resin
  description: Blue bioluminescence shines from beneath the surface.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xeno_weeds.rsi
    drawdepth: FloorTiles
    layers:
    - state: weed0
    - state: constructionnode
  - type: AreaSpawner
    spawnPrototype: ResinWeed
  - type: PointLight
    radius: 2.5
    energy: 2
    color: "#00CED1"

- type: entity
  parent: BaseStructure
  id: ResinNest
  name: resin nest
  description: A slimy, sticky mass shaped like a bed.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/resin_nest.rsi
    state: full
    noRot: true
  - type: Icon
    sprite: _Onyx/Structures/Resin/resin_nest.rsi
    state: full
  - type: IconSmooth
    key: full
    base: resin_nest
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.45,-0.45,0.45,0.05" }
        density: 190
        layer: [BulletImpassable]
  - type: RequireProjectileTarget
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: Biological
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.05
        Blunt: -0.05
        Slash: -0.05
        Piercing: -0.05
        Caustic: -0.05
        Asphyxiation: -0.8
        Bloodloss: -1.8
  - type: Strap
    position: Down
    rotation: -90
    selfUnBuckleDelay: 120
  - type: Transform
    anchored: true
    noRot: true

- type: entity
  parent: BaseMaterialDoorNavMap
  id: ResinDoor
  name: resin door
  description: Thick resin solidified into a door.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xeno_resin_door.rsi
    layers:
    - state: resin
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: true
    clickOpen: true
    canPry: true
    openSpriteState: resinopen
    closedSpriteState: resin
    openingSpriteState: resinopening
    closingSpriteState: resinclosing
    openSound: { path: /Audio/_Onyx/Effects/Resin/alien_resin_move1.ogg }
    closeSound: { path: /Audio/_Onyx/Effects/Resin/alien_resin_move2.ogg }
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: Biological

- type: entity
  parent: BaseStructure
  id: XenomorphEggBurst
  name: xenomorph egg
  suffix: Burst
  description: A large, already burst mottled egg.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    noRot: true
    state: egg_burst
  - type: Icon
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    state: egg_burst
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: Biological
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.45,-0.45,0.45,0.05" }
        density: 190
        layer: [BulletImpassable]
