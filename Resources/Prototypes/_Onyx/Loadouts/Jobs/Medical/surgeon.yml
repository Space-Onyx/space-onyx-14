- type: loadoutEffectGroup
  id: SeniorSurgeon
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobSurgeon
      time: 52h

- type: loadout
  id: SurgeonScalpelLaser
  effects:
  - !type:GroupLoadoutEffect
    proto: SeniorSurgeon
  storage:
    back:
    - ScalpelLaser

- type: loadoutGroup
  id: SurgeonHead
  name: loadout-group-surgeon-head
  loadouts:
  - BlueSurgeryCap
  - GreenSurgeryCap
  - PurpleSurgeryCap

- type: loadoutGroup
  id: SurgeonJumpsuit
  name: loadout-group-surgeon-jumpsuit
  loadouts:
  - MedicalBlueScrubs
  - MedicalGreenScrubs
  - MedicalPurpleScrubs

- type: loadoutGroup
  id: SurgeonScalpel
  name: loadout-group-surgeon-scalpel
  minLimit: 0
  loadouts:
  - SurgeonScalpelLaser
