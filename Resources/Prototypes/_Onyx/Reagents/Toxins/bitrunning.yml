- type: reagent
  id: Microplastics
  name: reagent-name-microplastics
  group: Toxins
  desc: reagent-desc-microplastics
  physicalDesc: reagent-physical-desc-powdery
  color: "#ffffff"
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 2
  - !type:PlantAdjustHealth
    amount: -1
  metabolisms:
    Bloodstream:
      metabolismRate: 0.01
      effects:
      - !type:HealthChange
        probability: 0.5
        damage:
          types: { Poison: 0.25 }
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
          inverted: true
      - !type:Vomit
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: Microplastics
          min: 10
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
          inverted: true
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.9
        sprintSpeedModifier: 0.9
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
          inverted: true
        - !type:ReagentCondition
          reagent: Microplastics
          min: 20
      - !type:HealthChange
        probability: 0.5
        damage:
          types: { Poison: -0.25 }
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
