- type: reagent
  id: Cyanide
  name: reagent-name-cyanide
  group: Toxins
  desc: reagent-desc-cyanide
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#1abcff"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      - !type:HealthChange
        damage:
          types: { Poison: 0.75, Asphyxiation: 0.25 }
      - !type:ModifyParalysis
        probability: 0.05
        time: 2
      - !type:Emote
        emote: Gasp
        probability: 0.1

- type: reagent
  id: Anacea
  name: reagent-name-anacea
  group: Toxins
  desc: reagent-desc-anacea
  physicalDesc: reagent-physical-desc-creamy
  flavor: bitter
  color: "#819cb5"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      - !type:CleanBloodstream
        cleanseRate: 0.5
        excluded: Anacea
      - !type:HealthChange
        damage:
          types: { Poison: 0.2 }
      - !type:ImmunityModifier
        gainRateModifier: -0.00111111111111
        strengthModifier: -0.0088888888888
        statusLifetime: 1.5

- type: reagent
  id: Tirizene
  name: reagent-name-tirizene
  group: Toxins
  desc: reagent-desc-tirizene
