- type: reagent
  id: Triclor
  name: reagent-name-triclor
  group: Toxins
  desc: reagent-desc-triclor
  physicalDesc: reagent-physical-desc-pungent
  flavor: terrible
  color: "#174f17"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types: { Blunt: 4, Poison: 4 }
      - !type:AdjustReagent
        reagent: Triclor
        amount: 0.5
        conditions:
        - !type:ReagentCondition { reagent: Triclor, max: 15 }
      - !type:Vomit
      - !type:ModifyBloodLevel { amount: -5 }
      - !type:ModifyBleed { amount: 0.5 }
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.8
        sprintSpeedModifier: 0.8
        time: 6
      - !type:ModifyStatusEffect { effectProto: StatusEffectStutter, time: 2 }
      - !type:Jitter

