  flavor: salty
  color: "#ff8239"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:HealthChange
        damage:
          types: { Poison: 2 }
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.7
