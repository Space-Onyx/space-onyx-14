- type: reagent
  id: Fentanyl
  name: reagent-name-fentanyl
  group: Narcotics
  desc: reagent-desc-fentanyl
  flavor: fentanyl
  physicalDesc: reagent-physical-desc-murky
  color: "#6e697d"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        damage:
          types:
            Poison: 0.25
            Asphyxiation: 0.75
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        probability: 0.05
        damage:
          types:
            Slash: 1
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: ["fentanyl-effect-lostsomething", "fentanyl-effect-skincrawl", "fentanyl-effect-fakepresence", "fentanyl-effect-rushing", "fentanyl-effect-giddy"]
        probability: 0.05
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        type: Local
        visualType: Medium
        messages: ["fentanyl-effect-skinworms", "fentanyl-effect-breathingrazors", "fentanyl-effect-lungstight", "fentanyl-effect-observed"]
        probability: 0.05
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.8
        sprintSpeedModifier: 0.8
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStutter
        time: 2
      - !type:Jitter
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 2
        probability: 0.05
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          min: 5
        effectProto: StatusEffectStunned
        time: 4
        probability: 0.05
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 20
      - !type:Drunk
        boozePower: 10
      - !type:Emote
        emote: Scream
        probability: 0.05
      - !type:SuppressPain
        amount: 2
        decayDuration: 60
        identifier: Fentanyl
        recoveryMultiplier: 2.25

- type: reagent
  id: Heroin
  name: reagent-name-heroin
  group: Medicine
  desc: reagent-desc-heroin
  physicalDesc: reagent-physical-desc-thick
  flavor: medicine
  color: "#a8a8af"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.5
      effects:
      - !type:SuppressPain
        amount: 0.75
        decayDuration: 30
        identifier: Heroin
        recoveryMultiplier: 1.5
      - !type:GenericStatusEffect
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 1.5
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Heroin
          min: 10.5
        damage:
          types:
            Poison: 2
            Cold: 0.25
            Asphyxiation: 0.75
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Heroin
          min: 10.5
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 20
      - !type:Drunk
        conditions:
        - !type:ReagentCondition
          reagent: Heroin
          min: 10.5
        boozePower: 10

- type: reagent
  id: Amnestizine
  name: reagent-name-amnestizine
  group: Narcotics
  desc: reagent-desc-amnestizine
  physicalDesc: reagent-physical-desc-milky
  color: "#FFF1DE"
  boilingPoint: 255
  meltingPoint: 36
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDementia
        time: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStutter
        time: 2
      - !type:TakeStaminaDamage
        amount: 7
        immediate: false
      - !type:PopupMessage
        visualType: MediumCaution
        type: Local
        messages:
        - amnestizine-effect-forget
        - amnestizine-effect-hole
        - amnestizine-effect-blank
        - amnestizine-effect-distracted
        - amnestizine-effect-widen
        - amnestizine-effect-soul
        - amnestizine-effect-peaceful
        - amnestizine-effect-leave
        - amnestizine-effect-listen
        probability: 0.35
      - !type:GenericStatusEffect
        key: Pacified
        component: Pacified
        type: Add
        time: 4
      - !type:MovementSpeedModifier
        conditions:
        - !type:ReagentCondition
          reagent: Amnestizine
          min: 4
        walkSpeedModifier: 0.4
        sprintSpeedModifier: 0.4
        time: 1.5
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Amnestizine
          min: 10
        effectProto: StatusEffectBlindness
        type: Add
        time: 2
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Amnestizine
          min: 15
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Amnestizine
          min: 15
        damage:
          types:
            Poison: 0.25
            Asphyxiation: 0.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Amnestizine
          min: 30
        damage:
          types:
            Cellular: 1
            Asphyxiation: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 2
        probability: 0.05
      - !type:Flammable
        multiplier: 0.3
  reactiveEffects:
    Flammable:
      methods: [Touch]
      effects:
      - !type:Flammable
        multiplier: 0.4
