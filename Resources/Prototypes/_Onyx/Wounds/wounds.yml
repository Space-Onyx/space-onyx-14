- type: fractureProfile
  id: OrganicFractureProfile
  damageType: Blunt
  wound: BoneFractureWound
  severityMultiplier: 1
  resetTreatmentOnDamage: true
  worsenMinimumDamage: 5
  minimumHitDamage: 3
  accumulationMultiplier: 0.4
  reductionMinimumGrade: Simple
  removeWoundWhenMended: true
  alert: BrokenBones
  alertMinimumGrade: Simple
  alertHiddenTreatments: [Mended]
  treatmentEffectScales:
    None: 1
    Reduced: 0.25
    Mended: 0
  grades:
    Hairline:
      threshold: 20
      creationChance: 0.05
      movementModifier: 0.625
      manipulationModifier: 0.92
    Simple:
      threshold: 35
      creationChance: 0.25
      movementModifier: 0.5
      manipulationModifier: 0.84
    Displaced:
      threshold: 50
      creationChance: 0.65
      movementModifier: 0
      manipulationModifier: 0.75
    Comminuted:
      threshold: 60
      creationChance: 1
      movementModifier: 0
      manipulationModifier: 0.75

