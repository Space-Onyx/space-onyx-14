- type: wound
  id: BluntWound
  name: wound-name-blunt
  damageTypes:
    Blunt:
      reopenMinimumDamage: 18
      severityMultiplier: 1
  maximumSeverity: 200
  behaviors:
  - !type:WoundPainBehavior
    painPerSeverity: 0.87
    minSeverity: 10
  - !type:WoundScarBehavior
    threshold: 20
    chance: 1
  stages:
    Minor:
      name: wound-stage-minor
      severity: 0
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.05
        chance: 0.25
        minimumSeverity: 8
    Moderate:
      name: wound-stage-moderate
      severity: 25
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.08
        chance: 0.35
        minimumSeverity: 8
    Severe:
      name: wound-stage-severe
      severity: 50
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.12
        chance: 0.5
        minimumSeverity: 8
    Critical:
      name: wound-stage-critical
      severity: 80
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundBleedingBehavior
        rate: 0.18
        chance: 0.7
        minimumSeverity: 8

