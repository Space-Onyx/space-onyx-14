- type: wound
  id: BluntWound
  name: wound-name-blunt
  damageTypes:
    Blunt:
      minimumDamage: 12
      reopenMinimumDamage: 18
      chance: 0.35
      guaranteedDamage: 30
      severityMultiplier: 0.9
  maximumSeverity: 200
  behaviors:
  - !type:WoundPainBehavior
    painPerSeverity: 0.7
    minSeverity: 10
  - !type:WoundScarBehavior
    threshold: 20
    chance: 1
  stages:
    Minor:
      name: wound-stage-minor
      severity: 0
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.05
        chance: 0.25
    Moderate:
      name: wound-stage-moderate
      severity: 50
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.08
        chance: 0.35
    Severe:
      name: wound-stage-severe
      severity: 100
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.12
        chance: 0.5
    Critical:
      name: wound-stage-critical
      severity: 150
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundBleedingBehavior
        rate: 0.18
        chance: 0.7

