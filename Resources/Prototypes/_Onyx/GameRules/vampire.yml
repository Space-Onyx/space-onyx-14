- type: entity
  parent: BaseGameRule
  id: Vampire
  components:
  - type: GameRule
    minPlayers: 5
  - type: VampireRule
  - type: AntagObjectives
    objectives:
    - EscapeVampirefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: VampireObjectiveGroups
    maxDifficulty: 5
  - type: AntagSelection
    agentName: vampire-round-end-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Vampire
      range:
        min: 1
        max: 8

- type: entity
  parent: Vampire
  id: SubVampire
  components:
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    agentName: vampire-round-end-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Vampire
      playerRatio: 20
      range:
        min: 1
        max: 4
