- type: entity
  id: OrganDemonMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Demon ]

- type: entity
  parent: [ OrganAnimalHeart, OrganDemonMetabolizer ]
  id: OrganDemonHeart
  name: arcan heart
  components:
  - type: Metabolizer
    maxReagents: 2

- type: entity
  parent: [ OrganAnimalStomach, OrganDemonMetabolizer ]
  id: OrganDemonStomach
  name: arcan stomach
  components:
  - type: SolutionManager
    solutions:
    - SolutionDemonStomach

- type: entity
  parent: Solution
  id: SolutionDemonStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 50

