- type: markingsGroup
  parent: Undergarments
  id: Rodentia
  limits:
    enum.HumanoidVisualLayers.Hair: { limit: 1, required: false }
    enum.HumanoidVisualLayers.FacialHair: { limit: 1, required: false }
    enum.HumanoidVisualLayers.Head: { limit: 3, required: false }
    enum.HumanoidVisualLayers.Snout: { limit: 1, required: false }
    enum.HumanoidVisualLayers.HeadTop: { limit: 8, required: false }
    enum.HumanoidVisualLayers.HeadSide: { limit: 8, required: false }
    enum.HumanoidVisualLayers.Ears: { limit: 1, required: true, default: [ RodentiaHeadTopEarDefault ] }
    enum.HumanoidVisualLayers.Tail: { limit: 2, required: true, default: [ RodentiaTailDefault ] }
    enum.HumanoidVisualLayers.Chest: { limit: 10, required: false }
    enum.HumanoidVisualLayers.LArm: { limit: 2, required: false }
    enum.HumanoidVisualLayers.RArm: { limit: 2, required: false }
    enum.HumanoidVisualLayers.LHand: { limit: 3, required: false }
    enum.HumanoidVisualLayers.RHand: { limit: 3, required: false }
    enum.HumanoidVisualLayers.LLeg: { limit: 2, required: false }
    enum.HumanoidVisualLayers.RLeg: { limit: 2, required: false }
    enum.HumanoidVisualLayers.LFoot: { limit: 2, required: false }
    enum.HumanoidVisualLayers.RFoot: { limit: 2, required: false }

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceRodentia
  categories: [ HideSpawnMenu ]
  name: rodentia appearance
  components:
  - type: InitialBody
    organs:
      Chest: OrganRodentiaChest
      Groin: OrganRodentiaGroin
      Head: OrganRodentiaHead
      ArmLeft: OrganRodentiaArmLeft
      ArmRight: OrganRodentiaArmRight
      HandLeft: OrganRodentiaHandLeft
      HandRight: OrganRodentiaHandRight
      LegLeft: OrganRodentiaLegLeft
      LegRight: OrganRodentiaLegRight
      FootLeft: OrganRodentiaFootLeft
      FootRight: OrganRodentiaFootRight
      Brain: OrganRodentiaBrain
      Eyes: OrganRodentiaEyes
      Tongue: OrganRodentiaTongue
      Appendix: OrganRodentiaAppendix
      Ears: OrganRodentiaEars
      Lungs: OrganRodentiaLungs
      Heart: OrganRodentiaHeart
      Stomach: OrganRodentiaStomach
      Liver: OrganRodentiaLiver
      Kidneys: OrganRodentiaKidneys
  - type: ProfileOrgans
    organs:
      Tail: { prototype: OrganRodentiaTail, parent: Groin, presenceLayers: [ Tail, TailOverlay ] }
  - type: HumanoidProfile
    species: Rodentia
  - type: Inventory
    templateId: humanNoSocks
    speciesId: rodentia

- type: entity
  parent: [ AppearanceRodentia, BaseSpeciesMobOrganic ]
  id: MobRodentia
  name: Urist McRat
  components:
  - type: Satiation
    satiations:
      Hunger:
        prototype: RodentiaHunger
  - type: Carriable
  - type: Damageable
    damageModifierSet: Rodentia
  - type: Speech
    speechVerb: Rodentia
    speechSounds: Squeak
    allowedEmotes: [ Squeak ]
  - type: Vocal
    emoteSounds: MaleRodentia
  - type: TypingIndicator
    proto: rodentia
  - type: CheeseAccent
  - type: LanguageKnowledge
    speaks: [ TauCetiBasic, Mouse ]
    understands: [ TauCetiBasic, Mouse ]
  - type: MeleeWeapon
    soundHit: { path: /Audio/Weapons/pierce.ogg }
    angle: 30
    animation: WeaponArcClaw
    damage:
      types: { Blunt: 2, Slash: 3 }
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 5
  - type: CreamPied
    sprite: { sprite: _Onyx/Effects/creampie_rodentia.rsi, state: creampie_rodentia }
  - type: ActionGrant
    actions: [ ActionMouseCall ]
  - type: MobCallSource
    range: 25
    whitelist: { tags: [ Mouse ] }
  - type: MouthStorage
    mouthProto: CheekStorage
    openStorageAction: ActionOpenMouthStorage
    spitDamageThreshold: 3
  - type: CrawlUnderObjects
    actionProto: ActionToggleSneakMode
  - type: Rummager
  - type: AlwaysTriggerMousetrap
  - type: PseudoItem
    storedOffset: -10,0
    shape:
    - 0,0,3,2
    - 0,2,5,4

- type: entity
  parent: OrganBaseOrganic
  id: OrganRodentia
  abstract: true
  suffix: Rodentia

- type: entity
  id: OrganRodentiaMetabolizer
