- type: organCategory
  id: Tail

- type: organCategory
  id: Wings

- type: entity
  parent: OrganBaseOrganic
  id: OrganMothWings
  name: moth wings
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Wings
  - type: SurgeryTool
    customUses:
    - surgery-tool-use-implant-wings
  - type: Sprite
    noRot: true
    enableOverrideDir: true
    overrideDir: North
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Tail
    data: {}
  - type: VisualOrganMarkings
    showOnDetached: true
    markingData:
      layers: [ Tail, TailOverlay ]
      group: Moth
  - type: OrganAction
    action: ActionWingDash

- type: entity
  parent: OrganBaseOrganic
  id: OrganBaseVisualTail
  name: tail
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Tail
  - type: SurgeryTool
    customUses:
    - surgery-tool-use-implant-tail
  - type: Sprite
    noRot: true
    enableOverrideDir: true
    overrideDir: East
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Tail
    data: {}
  - type: VisualOrganMarkings
    showOnDetached: true
    markingData:
      layers: [ Tail, TailOverlay ]
  - type: VisualOrganActivity
    action: ActionToggleWagging

- type: entity
  parent: OrganBaseVisualTail
  id: OrganHumanTail
  components:
  - type: VisualOrganMarkings
    markingData: { layers: [ Tail, TailOverlay ], group: Human }

- type: entity
