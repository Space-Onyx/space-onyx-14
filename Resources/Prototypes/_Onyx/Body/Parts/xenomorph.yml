- type: entity
  parent: OrganBaseOrganic
  id: PartXenomorph
  abstract: true
  components:
  - type: TransplantCompatibility
    profile: Xenomorph
  # <Goobstation>
  - type: Sprite
    sprite: _Onyx/Mobs/Species/Xenomorph/parts.rsi
  # </Goobstation>
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 3
      - ReagentId: FluorosulfuricAcid
        Quantity: 10
  - type: Woundable
    profile: OrganicBodyPartProfile

- type: entity
  id: ChestXenomorph
  name: xenomorph chest
  parent: PartXenomorph
  components:
  - type: BodyPart
    partType: Chest
    category: Chest
  - type: Sprite
    state: chest_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 10
      - ReagentId: FluorosulfuricAcid
        Quantity: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: GroinXenomorph
  name: xenomorph groin
  parent: PartXenomorph
  components:
  - type: BodyPart
    partType: Groin
    category: Groin
  - type: Sprite
    state: groin_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 10
      - ReagentId: FluorosulfuricAcid
        Quantity: 20

- type: entity
  id: HeadXenomorph
  name: xenomorph head
  parent: PartXenomorph
  components:
  - type: BodyPart
    partType: Head
    vital: true
    category: Head
  - type: Sprite
    state: head_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 5
      - ReagentId: FluorosulfuricAcid
        Quantity: 10

- type: entity
