- type: entity
  parent: BaseAction
  id: ActionClothingSeal
  name: Seal clothing
  description: Seals your current clothing.
  categories: [ HideSpawnMenu ]
  components:
  - type: ConfirmableAction
    popup: sealable-clothing-confirm
    confirmDelay: 0
    primeTime: 2
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Onyx/Actions/modsuit.rsi
    layers:
    - state: activate
      map: ["enum.ActionVisuals.Icon"]
    - state: activate-ready
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:SealClothingEvent {}
