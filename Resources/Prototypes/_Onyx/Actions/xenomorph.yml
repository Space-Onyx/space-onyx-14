# Combat action
- type: entity
  id: ActionCombatModeToggleXenomorph
  parent: ActionCombatModeToggle
  components:
  - type: Action
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: help
      map: ["enum.ActionVisuals.Icon"]
    - state: harm
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

# Thermal action
- type: entity
  id: ToggleThermalVisionXenomorph
  parent: ActionToggleThermalVision
  components:
  - type: Action
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: vision_off
      map: ["enum.ActionVisuals.Icon"]
    - state: vision_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

# Evolution actions
- type: entity
  id: ActionEvolution
  parent: BaseAction
  name: Evolve
  description: Evolve into a higher xenomorph caste.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 0
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: evolve
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:EvolutionsActionEvent

- type: entity
  id: ActionEvolutionPraetorian
  parent: ActionEvolution
  name: Evolve to praetorian (500)
  description: Evolve into the main defender of the hive.
  components:
  - type: Action
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: evolve_praetorian
      map: ["enum.ActionVisuals.Icon"]
  - type: PlasmaCostAction
    plasmaCost: 500

- type: entity
  id: ActionEvolutionQueen
  parent: ActionEvolutionPraetorian
  name: Evolve to queen (500)
  description: Produce an internal egg sac capable of spawning children. Only one queen can exist at a time.
  components:
  - type: Action
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: evolve_queen
      map: ["enum.ActionVisuals.Icon"]

# Structures actions
- type: entity
  id: ActionSpawnResinWeedNode
  parent: BaseAction
  name: Plant weeds (50)
  description: Plants some xenomorph weeds.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 2
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xeno_weeds.rsi
    layers:
    - state: constructionnode
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: ResinWeedNode
      blockedCollisionMask:
      - SlipLayer
      blockedCollisionLayer:
      - Impassable
      - MidImpassable
      - LowImpassable
  - type: PlasmaCostAction
    plasmaCost: 50 # Goobstation

- type: entity
  id: ActionSpawnXenomorphEgg
  parent: BaseAction
  name: Lay egg (75)
  description: Lay an egg to produce facehuggers to impregnate prey with.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 2
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: egg
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: XenomorphEgg
      blockedCollisionMask:
      - TableMask
      blockedCollisionLayer:
      - TableLayer
      - BulletImpassable
  - type: PlasmaCostAction
    plasmaCost: 75

# TODO: delete it
- type: entity
  id: ActionSpawnWallResin
  parent: BaseAction
  name: Build a resin wall (50)
  description: Secrete tough malleable resin.
  components:
  - type: Action
    useDelay: 2 # Goobstation
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xeno_resin_wall.rsi
    layers:
    - state: resin
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 2
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: WallResin
      length: 2 # Goobstation
      blockedCollisionMask:
      - FullTileMask
      blockedCollisionLayer:
      - WallLayer
  - type: PlasmaCostAction
    plasmaCost: 50 # Goobstation

