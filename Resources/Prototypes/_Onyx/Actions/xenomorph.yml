# Jump action
- type: entity
  id: ActionJumpXenomorph
  parent: ActionGravityJump
  name: Jump
  description: Stun your enemies with a quick jump.
  components:
  - type: Action
    priority: 0
    useDelay: 3
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: leap_off
      map: ["enum.ActionVisuals.Icon"]
    - state: leap_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

# Transfer plasma action
- type: entity
  id: ActionTransferPlasma
  parent: BaseAction
  name: Transfer plasma (50)
  description: Passes plasma to your friend.
  components:
  - type: Action
    priority: 0
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: plasma_transfer_off
      map: ["enum.ActionVisuals.Icon"]
    - state: plasma_transfer_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    event: !type:TransferPlasmaActionEvent

# Promotion action
- type: entity
  id: ActionXenomorphPromotion
  parent: BaseAction
  name: Promote to Praetorian (500) # Goobstation
  description: Directly promote a xenomorph to Praetorian status. # Goobstation
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 5 # Goobstation
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: promote
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction # Goobstation start
    checkCanAccess: true
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      requireAll: true
      components:
        - Xenomorph
    event: !type:PromotionActionEvent
  - type: PlasmaCostAction
    plasmaCost: 500
