# Tail lash action
- type: entity
  id: ActionTailLash
  parent: BaseAction
  name: Tail lash
  description: Hit your opponent with your tail.
  components:
  - type: Action
    useDelay: 11
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _Onyx/Interface/Actions/xenomorph.rsi
    layers:
    - state: tail_attack
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:TailLashActionEvent

