- type: entity
  parent: BaseAction
  id: ActionToggleThermalVision
  name: Toggle thermal vision
  description: Activates thermal vision temporarily.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 4
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Goggles/thermal.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: icon
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent
