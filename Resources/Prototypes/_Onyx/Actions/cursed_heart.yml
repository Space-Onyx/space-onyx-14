- type: entity
  parent: BaseAction
  id: ActionPumpCursedHeart
  name: Heartbeat
  description: Pump your own blood to live!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: BigAction
    useDelay: 1
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Salvage/loot.rsi
    layers:
    - state: cursed_heart
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:PumpHeartActionEvent
