- type: entity
  parent: BaseAction
  id: ActionBitrunningDisconnectAvatar
  name: Disconnect avatar
  description: Return to your body and end the current avatar session.
  components:
  - type: Action
  - type: Sprite
    sprite: _Onyx/Structures/Machines/netpod.rsi
    layers:
    - state: netpod_closed_active
  - type: InstantAction
    event: !type:BitrunningDisconnectAvatarActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningProgramBasicCheese
  name: Summon cheese
  description: Spawns cheese wheels in a 3x3 area around you.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Consumable/Food/ingredients.rsi
    layers:
    - state: cheesewheel
  - type: InstantAction
    event: !type:BitrunningSpawnCheeseActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningProgramBasicLesserHeal
  name: Lesser heal
  description: Heals minor brute and burn damage.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: treatment-module
  - type: InstantAction
    event: !type:BitrunningLesserHealActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningProgramComplexLightning
  name: Lightning bolt
  description: Fire a lightning bolt at your target.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Effects/lightning.rsi
    layers:
    - state: blue_lightning
  - type: TargetAction
    interactOnMiss: false
    range: 15
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    event: !type:BitrunningLightningActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningProgramEliteDragon
  name: Dragon morph
  description: Temporarily transforms you into a dragon avatar.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Mobs/Aliens/Carps/space.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BitrunningAvatarDragonPolymorph

- type: entity
  parent: BaseAction
  id: ActionBitrunningProgramEliteBear
  name: Bear morph
  description: Temporarily transforms you into a bear avatar.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Mobs/Animals/bear.rsi
    layers:
    - state: bear
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BitrunningAvatarBearPolymorph
