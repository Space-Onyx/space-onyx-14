- type: emote
  id: Flip
  name: chat-emote-name-flip
  icon: _Onyx/Interface/Emotes/flip.png
  chatMessages: ["chat-emote-msg-flip"]
  chatTriggers: [flip, flips, "does a flip"]
  targetEvents:
  - !type:PlayAnimationTargetEvent
    animationID: EmoteFlip

