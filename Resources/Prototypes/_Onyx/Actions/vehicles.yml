- type: entity
  parent: BaseAction
  id: ActionForklift
  name: Activate lift
  description: Lift a crate in front of you.
  components:
  - type: Action
    useDelay: 3
    icon:
      sprite: _Onyx/Objects/Vehicles/forklift.rsi
      state: forklift
    itemIconStyle: BigAction
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:ForkliftActionEvent
    canTargetSelf: false
    whitelist:
      tags: [Crate]

- type: entity
  parent: BaseAction
  id: ActionUnforklift
  name: Drop lift
  description: Put down the front crate.
  components:
  - type: Action
    useDelay: 1.5
    icon: Interface/NavMap/beveled_arrow_south.png
  - type: InstantAction
    event: !type:UnforkliftActionEvent

- type: entity
  parent: BaseAction
  id: ActionThankDriver
  name: Thank driver
  description: Show the driver you enjoy being a passenger.
  components:
  - type: Action
    icon:
      sprite: _Onyx/Objects/Vehicles/clowncar.rsi
      state: clowncar
    useDelay: 60
  - type: InstantAction
    event: !type:ThankRiderActionEvent

- type: entity
  parent: BaseAction
  id: ActionQuietBackThere
  name: Quiet back there
  description: Reset the passengers' gratitude.
  components:
  - type: Action
    icon:
      sprite: _Onyx/Objects/Vehicles/clowncar.rsi
      state: clowncar
    useDelay: 30
  - type: InstantAction
    event: !type:QuietBackThereActionEvent
