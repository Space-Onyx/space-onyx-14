- type: entity
  parent: BaseAction
  id: ActionForklift
  name: Activate lift
  description: Lift a crate in front of you.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _Onyx/Objects/Vehicles/forklift.rsi
    layers:
    - state: forklift
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:ForkliftActionEvent
    canTargetSelf: false
    whitelist:
      tags: [Crate]

- type: entity
  parent: BaseAction
  id: ActionVehicleHorn
  name: Honk!
  description: Sound vehicle horn.
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: Objects/Fun/bikehorn.rsi, state: icon }
  - type: InstantAction
    event: !type:VehicleHornActionEvent

- type: entity
  parent: BaseAction
  id: ActionUnforklift
  name: Drop lift
  description: Put down the front crate.
  components:
  - type: Action
    useDelay: 1.5
  - type: Sprite
    layers:
    - texture: Interface/NavMap/beveled_arrow_south.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:UnforkliftActionEvent

- type: entity
  parent: BaseAction
  id: ActionThankDriver
  name: Thank driver
  description: Show the driver you enjoy being a passenger.
  components:
  - type: Action
    useDelay: 60
  - type: Sprite
    sprite: _Onyx/Objects/Vehicles/clowncar.rsi
    layers:
    - state: clowncar
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ThankRiderActionEvent

- type: entity
  parent: BaseAction
  id: ActionQuietBackThere
  name: Quiet back there
  description: Reset the passengers' gratitude.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: _Onyx/Objects/Vehicles/clowncar.rsi
    layers:
    - state: clowncar
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:QuietBackThereActionEvent
