- type: entity
  parent: BaseAction
  id: ActionXenobioSlimeLatch
  name: xenobio-slime-action-latch-name
  description: xenobio-slime-action-latch-description
  components:
  - type: Action
    icon:
      sprite: _Onyx/Xenobiology/Actions/actions_slime.rsi
      state: slimeeat
    useDelay: 3
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Body
    blacklist:
      components:
      - XenobioSlime
    canTargetSelf: false
    event: !type:SlimeLatchActionEvent
