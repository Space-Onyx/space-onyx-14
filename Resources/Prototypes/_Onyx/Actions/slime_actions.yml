- type: entity
  parent: BaseAction
  id: ActionXenobioSlimeLatch
  name: xenobio-slime-action-latch-name
  description: xenobio-slime-action-latch-description
  components:
  - type: Action
    useDelay: 3
  - type: Sprite
    sprite: _Onyx/Xenobiology/Actions/actions_slime.rsi
    layers:
    - state: slimeeat
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Body
    blacklist:
      components:
      - XenobioSlime
    canTargetSelf: false
    event: !type:SlimeLatchActionEvent
