- type: entity
  parent: BaseAction
  id: ActionToggleSuitModuleLight
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: _Onyx/Interface/Actions/actions_modules.rsi
    layers:
    - state: light-off
      map: ["enum.ActionVisuals.Icon"]
    - state: light-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ModModuleToggleLightEvent

