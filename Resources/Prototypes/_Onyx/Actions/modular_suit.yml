- type: entity
  parent: BaseAction
  id: BaseSuitModuleAction
  abstract: true
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: GenericVisualizer
    visuals:
      enum.ActionState.Toggled:
        enum.ActionVisuals.Icon:
          True: { visible: true }
          False: { visible: true }
        enum.ActionVisuals.IconToggled:
          True: { visible: false }
          False: { visible: false }

- type: entity
  parent: BaseSuitModuleAction
  id: ActionToggleSuitModuleJetpack
  components:
  - type: Action
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleJetpackEvent

- type: entity
  parent: BaseSuitModuleAction
