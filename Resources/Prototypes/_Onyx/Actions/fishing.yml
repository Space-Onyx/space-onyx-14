- type: entity
  parent: BaseAction
  id: ActionStartFishing
  name: Throw fishing lure
  description: Throw lure from the fishing rod to catch something!
  components:
  - type: Action
    sound:
      path: /Audio/_Onyx/Items/Fishing/fishing_rod_cast.ogg
    itemIconStyle: BigAction
    useDelay: 2.5
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/fishing_lure.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ThrowFishingLureActionEvent

- type: entity
  parent: BaseAction
  id: ActionStopFishing
  name: Reel fishing rod
  description: Reel your fishing rod to pull an attached object or stop fishing.
  components:
  - type: Action
    sound:
      path: /Audio/_Onyx/Items/Fishing/fishing_rod_reel.ogg
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/goon_rod.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:PullFishingLureActionEvent
