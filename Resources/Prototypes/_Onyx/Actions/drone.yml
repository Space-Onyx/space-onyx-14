- type: entity
  parent: BaseAction
  id: ActionDronePlayMidi
  name: Play MIDI
  description: Contribute to the ambiance.
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    icon: Interface/Actions/pai-midi.png
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.InstrumentUiKey.Key

- type: entity
  parent: BaseMentalAction
  id: ActionShowStationMap
  name: Station Map Interface
  description: View a station map interface.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_ai.rsi, state: mass_scanner }
    iconOn: { sprite: Interface/Actions/actions_ai.rsi, state: mass_scanner }
    keywords: [AI, console, interface]
    priority: -8
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent
      key: enum.StationMapUiKey.Key
