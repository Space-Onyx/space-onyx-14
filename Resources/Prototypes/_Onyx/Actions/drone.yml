- type: entity
  parent: BaseAction
  id: ActionDronePlayMidi
  name: Play MIDI
  description: Contribute to the ambiance.
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/pai-midi.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.InstrumentUiKey.Key

- type: entity
  parent: BaseMentalAction
  id: ActionShowStationMap
  name: Station Map Interface
  description: View a station map interface.
  components:
  - type: Action
    keywords: [AI, console, interface]
    priority: -8
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: mass_scanner
      map: ["enum.ActionVisuals.Icon"]
    - state: mass_scanner
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent
      key: enum.StationMapUiKey.Key
