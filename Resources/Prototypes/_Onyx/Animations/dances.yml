- type: animation
  id: EmoteFlip
  length: 0.5
  tracks:
  - !type:AnimationTrackComponentPropertyData
    componentType: Sprite
    property: Rotation
    interpolationMode: Linear
    keyFrames:
    - !type:KeyFrameComponentPropertyData { value: 0, type: angle, keyframe: 0 }
    - !type:KeyFrameComponentPropertyData { value: 180, type: angle, keyframe: 0.25 }
    - !type:KeyFrameComponentPropertyData { value: 360, type: angle, keyframe: 0.25 }

- type: animation
  id: EmoteJump
  length: 0.25
