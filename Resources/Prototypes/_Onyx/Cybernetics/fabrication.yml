- type: entity
  parent: BaseLathe
  id: MedicalBiofabricator
  name: medical biofabricator
  description: Produces organs and bio-synthetic body parts from biomass.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Machines/medical_biofabricator.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MedicalBiofabMachineBoard
  - type: MaterialStorage
    whitelist:
      tags: [ Sheet, RawMaterial ]
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks: [ BiofabricatorParts ]

- type: entity
  parent: BaseMachineCircuitboard
  id: MedicalBiofabMachineBoard
  name: medical biofabricator machine board
  description: A machine printed circuit board for a medical biofabricator.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: MedicalBiofabricator
    stackRequirements:
      Manipulator: 4

- type: entity
  parent: BaseFlatpack
  id: MedicalBiofabricatorFlatpack
  name: medical biofabricator flatpack
  description: A flatpack used for constructing a medical biofabricator.
  components:
  - type: Flatpack
    entity: MedicalBiofabricator

- type: latheRecipe
  parent: [ BaseGoldCircuitboardRecipe, BaseMedicalMachineRecipeCategory ]
  id: MedicalBiofabMachineBoard
  result: MedicalBiofabMachineBoard

