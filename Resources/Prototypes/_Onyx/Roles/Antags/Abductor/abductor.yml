- type: antag
  id: AbductorVictimAntag
  name: abductor-victim-role-name
  antagonist: true
  objective: roles-antag-abductor-victim

- type: antagSpecifier
  id: LoneAbductor
  spawnerPrototype: LoneAbductorSpawner
  pickPlayer: false
  startingGear: LoneAbductorGear
  briefing:
    text: abductor-role-greeting
    color: Green
    sound: /Audio/_Onyx/Abductor/abductor.ogg
  components:
  - type: Abductor
  - type: ActionGrant
    actions:
    - ActionReturnToShip
  - type: GhostRole
    name: abductor-lone-ghost-role-name
    description: abductor-lone-ghost-role-desc
    rules: abductors-ghost-role-rules
    mindRoles:
    - MindRoleLoneAbductor
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: RandomMetadata
    nameSegments:
    - AbductorScientistPrefix
    - AbductorNames
    nameFormat: name-format-standard
  - type: Tag
    tags:
    - Abductor
    - AbductorScientist
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
  - type: AbductorScientist
  - type: SurgerySpeedModifier
    speedModifier: 1.5
  mindRoles:
  - MindRoleLoneAbductor

