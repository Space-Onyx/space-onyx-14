- type: entity
  id: BaseWeatherAdmeme
  suffix: Admeme, Weather
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: SpriteFade
  - type: Clickable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    noRot: true
    sprite: /Textures/Effects/weather.rsi
    state: rain
    drawdepth: Overdoors

- type: entity
