- type: entityTable
  id: LavalandSurfaceMobs
  table: !type:GroupSelector
    children:
    - id: MobLegion
    - !type:GroupSelector
      children:
      - id: MobLavalandGoliath
        weight: 99
      - id: MobLavalandGoliathAncient
        weight: 1
    - id: MobCarpLavaland
    - !type:GroupSelector
      children:
      - id: MobWatcherLavaland
      - id: MobWatcherMagmawing
      - id: MobWatcherIcewing

- type: entity
  name: lavaland mob spawner
  id: SpawnerRandomMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnEntityTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandSurfaceMobs

- type: entityTable
  id: LavalandLightMobs
  table: !type:GroupSelector
    children:
    - id: MobCarpLavaland
    - id: MobWatcherLavaland
    - id: MobWatcherMagmawing
    - id: MobWatcherIcewing

- type: entity
  name: lavaland light mob spawner
  id: SpawnerRandomLightMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnEntityTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandLightMobs

- type: entityTable
  id: LavalandTendrils
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 50
      children:
      - id: LavalandTendrilLavaWatcher
      - id: LavalandTendrilGoliath
    - !type:GroupSelector
      weight: 20
      children:
      - id: LavalandTendrilSpaceCarp
    - !type:GroupSelector
      weight: 30
      children:
      - id: LavalandTendrilIcewingWatcher
      - id: LavalandTendrilMagmawingWatcher

- type: entity
  name: tendril spawner
  id: SpawnerRandomTendrilLavaland
  parent: MarkerBase
  suffix: Lavaland
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Onyx/Structures/Specific/tendril.rsi
      state: tendril
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: LavalandTendrils
  placement:
    mode: AlignTileAny
