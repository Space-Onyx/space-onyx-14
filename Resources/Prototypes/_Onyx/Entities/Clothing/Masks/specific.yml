- type: entity
  parent: [ ClothingMaskGas, BaseCentcommContraband ]
  id: ClothingBSOMaskGasSwat
  name: Blueshield SWAT gas mask
  description: A standard-issue armored gas mask for Blueshield officers.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Mask/bsoswat.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Mask/bsoswat.rsi
  - type: HideLayerClothing
    slots: [ Hair, Snout, HeadTop, HeadSide ]
    hideOnToggle: true
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.9
        Heat: 0.9
  - type: IngestionBlocker
    blockSmokeIngestion: true

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskMuzzleSecure
  name: secure muzzle
  description: Prevents biting and makes speech unintelligible.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Onyx/Clothing/Mask/securemuzzle.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Mask/securemuzzle.rsi
    equipDelay: 3
    unequipDelay: 10
  - type: IngestionBlocker
  - type: MumbleAccent
    relayAccent: true

- type: entity
  parent: ClothingMaskMuzzleSecure
  id: ClothingMaskMuzzleShock
  name: shock muzzle
  description: A secure muzzle fitted with a behavior correction system.
  components:
  - type: ShockOnTrigger
  - type: TriggerOnSpeak

- type: entity
  parent: [ ClothingMaskBreathMedical, BaseSecurityContraband ]
  id: ClothingMaskSecurityMedicalRespirator
  name: security medical respirator
  description: A respirator that provides protection against viruses, dust and more.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Mask/security_medical_respirator.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Mask/security_medical_respirator.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Caustic: 0.9
