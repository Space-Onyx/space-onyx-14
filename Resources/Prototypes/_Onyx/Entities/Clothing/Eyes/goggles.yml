- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesNightVisionGoggles
  name: night vision goggles
  description: Now you can see in the dark!
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Goggles/nightvision.rsi
  - type: NightVision
    relayOverlay: true
    action: ActionToggleNightVision
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesThermalVisionGoggles
  name: thermal vision goggles
  description: Now you can see everyone!
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Goggles/thermal.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Goggles/thermal.rsi
  - type: ThermalVision
    pulseTime: 2
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: [ClothingEyesBase, BaseSyndicateContraband]
  id: ClothingEyesThermalVisionGogglesSyndie
  name: thermal vision goggles
  description: A high-tech pair of thermal goggles.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Goggles/sthermals.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Goggles/sthermals.rsi
  - type: ThermalVision
    flashDurationMultiplier: 2
    isEquipment: true
    toggleAction: ActionToggleThermalVision
  - type: IdentityBlocker
    coverage: EYES
  - type: ChameleonClothing
    slot: [eyes]
    default: ClothingEyesThermalVisionGogglesSyndie
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: [ClothingEyesBase, ShowMedicalIcons]
  id: ClothingEyesGlassesMedChem
  name: medichem goggles
  description: Goggles that can scan the chemical composition of a solution, with an integrated medical hud.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Glasses/medichem.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Glasses/medichem.rsi
  - type: SolutionScanner
  - type: Construction
    graph: GogglesMedChemHUD
    node: gogglesMedChem
  - type: Tag
    tags:
    - WhitelistChameleon
    - HudMedichem

- type: entity
  parent: [ClothingEyesBase, ShowMedicalIcons, ClothingEyesGlassesSunglasses]
  id: ClothingEyesGlassesMedChemFlash
  name: medichem glasses
  description: Sunglasses with a medical hud and solution analyzer.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Glasses/medichemglasses.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Glasses/medichemglasses.rsi
  - type: SolutionScanner
  - type: Construction
    graph: GlassesMedChemHUD
    node: glassesMedChem
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: [ClothingEyesNightVisionGoggles, ShowMedicalIcons, BaseSyndicateContraband]
  id: ClothingEyesNightVisionGogglesSyndie
  name: syndicate night vision goggles
  description: A high-tech pair of night vision goggles. Has medical analysis technology.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Eyes/Goggles/snightvision.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Eyes/Goggles/snightvision.rsi

- type: entity
  parent: ClothingEyesNightVisionGogglesSyndie
  id: ClothingEyesNightVisionGogglesNukie
  suffix: "NukeOps"
  components:
  - type: ShowSyndicateIcons

- type: entity
  parent: ClothingEyesThermalVisionGogglesSyndie
  id: ClothingEyesThermalVisionGogglesNukie
  suffix: "NukeOps"
  components:
  - type: ShowSyndicateIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
