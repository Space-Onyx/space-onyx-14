- type: entity
  parent: [ ClothingBeltBaseCloneProjector, BaseGrandTheftContraband ]
  id: ClothingBeltGeminiHoloProjector
  name: ax-32 "gemini" holo-projector rig
  description: A highly advanced holo-projector rig that interfaces directly with the user's spinal cord to generate an exact copy of them. Truly a marvel of Nanotrasen technology.
  components:
  - type: StealTarget
    stealGroup: ClothingBeltGeminiHoloProjector
  - type: CloneProjector
    clonedItemBlacklist:
      components:
      - CloneProjector
    clonedItemWhitelist:
      components:
      - Clothing
    removedComponents:
    - type: CanHostGuardian
    userBlacklist:
      components:
      - Zombie
  - type: Tag
    tags:
    - HighRiskItem

- type: entity
  parent: [ ClothingBeltBaseCloneProjector, BaseCentcommContraband ]
  id: ClothingBeltMonozygoticHoloProjector
  name: ax-48 "monozygotic" holo-projector rig
  description: A custom-made experimental variant of the ax-32, retrofitted for use by Central Command.
  components:
  - type: CloneProjector
    nameSuffix: monozygotic-projector-clone-name-suffix
    ghostRoleName: ghost-role-information-monozygotic-clone-name
    ghostRoleDescription: ghost-role-information-monozygotic-clone-description
    doStun: false
    restrictRangedWeapons: false
    addedComponents:
    - type: MobThresholds
      thresholds:
        0: Alive
        420: Dead
    clonedItemBlacklist:
      components:
      - CloneProjector
    clonedItemWhitelist:
      components:
      - Clothing
