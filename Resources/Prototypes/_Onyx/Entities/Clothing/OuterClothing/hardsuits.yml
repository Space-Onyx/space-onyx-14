- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseCentcommContraband ]
  id: ClothingOuterHardsuitBlueshieldLight
  name: "'praetorian' escort hardsuit"
  description: A lightweight hardsuit designed for an elite bodyguard.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/OuterClothing/Hardsuits/bsolight.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/OuterClothing/Hardsuits/bsolight.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.6
  - type: ClothingSpeedModifier
    sprintModifier: 0.9
    walkModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitBlueshield
  - type: StaminaResistance
    damageCoefficient: 0.6

