- type: entity
  abstract: true
  # Used to put pressureProtection, layers blocker and etc components into ComponentToggler
  id: BaseClothingModsuitHelmet
  name: base modsuit helmet
  categories: [ HideSpawnMenu ]
  components:
  # <Onyx>
  - type: SlotBlock
    slots: [ears, eyes, mask]
  # </Onyx>
  - type: Sprite
    state: icon
  - type: Clickable
  - type: InteractionOutline
  - type: GroupExamine
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    quickEquip: false
    equippedPrefix: off
    slots: [ HEAD ]
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD-vox
      head-vulpkanin:
      - state: equipped-HEAD-vulpkanin
    
  - type: Tag
    tags:
    - WhitelistChameleon
    - PlasmamanSafe
  - type: IgniteFromGasImmunity
    parts:
    - Head
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
  - type: HideLayerClothing
    slots:
    - Snout
    - HeadTop
    - HeadSide
  - type: FaceHuggerBlocker
  - type: PointLight
    enabled: false
    lightMask: ConeSingle
    autoRot: true
  - type: ClothingAccessoryHolder
    slots:
      hat:
        requiredSlots: HEAD
        equippedState: equipped-HELMET
        ejectOnUnequip: true
        slot:
          insertSound: null
          ejectSound: null
          whitelist:
            components:
            - Clothing

- type: entity
  abstract: true
  parent: BaseClothingModsuitHelmet
  # Used for helmets that hide your identity even if it's not sealed
  id: BaseClothingModsuitHelmetHideIdentity
  name: base modsuit helmet
  categories: [ HideSpawnMenu ]
  components:
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: HideLayerClothing
    slots:
    - Snout
    - HeadTop
    - HeadSide

- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetStandard
  name: standard modsuit helmet
  description: A special modular suit spaceproof helmet designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Modsuits/standard.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: HideLayerClothing
    slots:
    - Snout
    - HeadTop
    - HeadSide
    hideOnToggle: true
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      head-resomi:
      - state: equipped-HEAD-sealed-resomi
      head-vox:
      - state: equipped-HEAD-sealed-vox
      head-vulpkanin:
      - state: equipped-HEAD-sealed-vulpkanin
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.2
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
      blockSmokeIngestion: True
    - type: HideLayerClothing
      slots:
      - Snout
      - HeadTop
      - HeadSide
  - type: Tag
    tags:
    - PlasmamanSafe
    - Envirohelm
  - type: IgniteFromGasImmunity
    parts:
    - Head

