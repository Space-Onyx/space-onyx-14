- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetHardsuitBlueshield
  name: blueshield hardsuit helmet
  description: The helmet of the Blueshield escort hardsuit.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Hardsuits/bso.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: _Onyx/Clothing/Head/Hardsuits/bso.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.7
        Heat: 0.7
        Radiation: 0.6
        Caustic: 0.6
  - type: FlashImmunity
  - type: ToggleableVisuals
    spriteLayer: light

- type: entity
  parent: ClothingHeadHelmetBase
  id: ClothingHeadHelmetHEV
  name: H.E.V helmet
  description: Not included in a set with crowbar, long jump module and gravity manipulation device.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Helmets/hev.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Head/Helmets/hev.rsi
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.75
        Shock: 0.7
        Radiation: 0.01
        Caustic: 0.5
  - type: HideLayerClothing
    layers:
      HeadTop: HEAD
      HeadSide: HEAD
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    color: "#4d7ae3"
    rotation: 30
    radius: 5
    energy: 10
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: Appearance
  - type: HandheldLight

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadLightBase]
  id: ClothingHeadHelmetVoidsuitSecurity
  name: security hardsuit helmet
  description: A well-built faceplate attached to the security hardsuit.
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Voidsuits/security.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Head/Voidsuits/security.rsi
  - type: PointLight
    color: "#a4fef4"
    rotation: 30
    energy: 6
    radius: 4
  - type: PressureProtection
    highPressureMultiplier: 0.525
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.75
        Heat: 0.8
        Radiation: 0.6
        Caustic: 0.5
  - type: FlashImmunity
  - type: FlashSoundSuppression
