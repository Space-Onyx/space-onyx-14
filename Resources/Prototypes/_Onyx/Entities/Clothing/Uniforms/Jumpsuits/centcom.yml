- type: entity
  parent: [ClothingUniformBase, BaseCentcommContraband]
  id: ClothingUniformJumpsuitNavyGold
  name: navy officer's jumpsuit
  description: A suit worn by high-ranking Central Command members. The rest is classified.
  components:
  - type: Sprite
    sprite: _Onyx/Clothing/Uniforms/Jumpsuit/Centcom/navy_gold.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Uniforms/Jumpsuit/Centcom/navy_gold.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.60
        Heat: 0.65

