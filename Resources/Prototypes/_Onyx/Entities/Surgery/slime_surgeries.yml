- type: entity
  id: SurgerySlimeBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgerySpeciesCondition
    species: [ SlimePerson ]

- type: entity
  parent: SurgerySlimeBase
  id: SurgerySlimeOpenIncision
  name: Open membrane
  components:
  - type: Surgery
    priority: -1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/scalpel.rsi, state: scalpel }
    steps:
      default:
        steps:
        - SurgeryStepOpenIncisionScalpel
        - SurgeryStepCoagulateSlimeFlow
        - SurgeryStepRetractSlimeMembrane
  - type: SurgeryMarkerCondition
    missingAny: [ IncisionOpen, SkinRetracted ]

- type: entity
  parent: SurgerySlimeBase
  id: SurgerySlimeCloseIncision
  name: Seal membrane
  components:
  - type: Surgery
    priority: 1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/stitches.rsi, state: stitches }
    steps:
      default:
        steps:
        - SurgeryStepCloseIncision
  - type: SurgeryMarkerCondition
    all: [ IncisionOpen ]

- type: entity
  parent: SurgerySlimeBase
  id: SurgerySlimeRemovePart
  name: Separate body part
  components:
  - type: Surgery
    useTargetPartIcon: true
    steps:
      default:
        steps:
        - SurgerySlimeOpenIncision
        - SurgeryStepSlimeSeparatePart
  - type: SurgeryDetachablePartCondition

