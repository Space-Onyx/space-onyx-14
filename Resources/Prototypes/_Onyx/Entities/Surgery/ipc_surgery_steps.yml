- type: entity
  id: SurgeryStepIpcBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
  - type: MechanicalSurgeryStep

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcUnfastenPanel
  name: Unfasten the access panel
  components:
  - type: SurgeryStep
    toolQuality: Screwing
    add: [ { type: IncisionOpen } ]
  - type: Sprite
    sprite: Objects/Tools/screwdriver.rsi
    state: screwdriver

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcDisconnectWiring
  name: Disconnect the internal wiring
  components:
  - type: SurgeryStep
    toolQuality: Cutting
    add: [ { type: BleedersClamped } ]
  - type: Sprite
    sprite: Objects/Tools/wirecutters.rsi
    state: cutters

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcOpenPanel
  name: Pry open the access panel
  components:
  - type: SurgeryStep
    toolQuality: Prying
    add: [ { type: SkinRetracted } ]
  - type: Sprite
    sprite: Objects/Tools/crowbar.rsi
    state: icon

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcClosePanel
  name: Close the access panel
  components:
  - type: SurgeryStep
    toolQuality: Prying
    remove: [ { type: SkinRetracted } ]
  - type: Sprite
    sprite: Objects/Tools/crowbar.rsi
    state: icon

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcReconnectWiring
  name: Reconnect the internal wiring
  components:
  - type: SurgeryStep
    consumedStackType: CableHV
    consumedAmount: 1
    remove: [ { type: BleedersClamped } ]
  - type: Sprite
    sprite: Objects/Tools/cable-coils.rsi
    state: coilhv-10

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcFastenPanel
  name: Fasten the access panel
  components:
  - type: SurgeryStep
    toolQuality: Screwing
    remove: [ { type: IncisionOpen } ]
  - type: Sprite
    sprite: Objects/Tools/screwdriver.rsi
    state: screwdriver

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcDetachPart
  name: Unbolt the body part
  components:
  - type: SurgeryStep
    toolQuality: Anchoring
  - type: SurgeryDetachPartEffect
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: icon

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcAttachPart
  name: Fit the body part

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcSecurePart
  name: Secure the body part
  components:
  - type: SurgeryStep
    toolQuality: Anchoring
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: icon

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcConnectPart
  name: Connect the body part wiring
  components:
  - type: SurgeryStep
    consumedStackType: CableHV
    consumedAmount: 1
  - type: Sprite
    sprite: Objects/Tools/cable-coils.rsi
    state: coilhv-10

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcRemoveOrgan
  name: Disconnect the module
  components:
  - type: SurgeryStep
    toolQuality: Pulsing
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    state: icon

- type: entity
  parent: SurgeryStepIpcBase
  id: SurgeryStepIpcInsertOrgan
  name: Install the module

- type: entity
  parent: SurgeryStepIpcAttachPart
