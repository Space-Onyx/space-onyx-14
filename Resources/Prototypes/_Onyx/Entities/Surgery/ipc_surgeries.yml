    requirement: SurgeryIpcOpenPanel
    steps:
      default:
        steps:
        - SurgeryStepIpcAttachHead
        - SurgeryStepIpcSecureHead
        - SurgeryStepIpcConnectHead
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMissingPartCondition
    part: Head

