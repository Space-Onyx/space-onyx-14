    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachRightLeg, SurgeryStepIpcSecureRightLeg, SurgeryStepIpcConnectRightLeg ]
  - type: SurgeryPartCondition
    part: Groin
  - type: SurgeryMissingPartCondition
    part: Leg
    symmetry: Right

- type: entity
  parent: SurgeryIpcBase
