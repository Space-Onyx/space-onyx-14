- type: entity
  id: SurgeryIpcBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgerySpeciesCondition
    species: [ Ipc ]

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcOpenPanel
  name: Open access panel
  components:
  - type: Surgery
    priority: -1
    steps:
    - SurgeryStepIpcUnfastenPanel
    - SurgeryStepIpcOpenPanel
    - SurgeryStepIpcDisconnectWiring

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcClosePanel
  name: Close access panel
  components:
  - type: Surgery
    priority: 1
    steps:
    - SurgeryStepIpcReconnectWiring
    - SurgeryStepIpcClosePanel
    - SurgeryStepIpcFastenPanel
  - type: SurgeryCloseIncisionCondition

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcRemovePart
  name: Detach body part
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcDetachPart ]
  - type: SurgeryDetachablePartCondition

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachHead
  name: Install head
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachHead, SurgeryStepIpcSecureHead, SurgeryStepIpcConnectHead ]
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMissingPartCondition
    part: Head

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachLeftArm
  name: Install left arm
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachLeftArm, SurgeryStepIpcSecureLeftArm, SurgeryStepIpcConnectLeftArm ]
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMissingPartCondition
    part: Arm
    symmetry: Left

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachRightArm
  name: Install right arm
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachRightArm, SurgeryStepIpcSecureRightArm, SurgeryStepIpcConnectRightArm ]
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMissingPartCondition
    part: Arm
    symmetry: Right

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachLeftLeg
  name: Install left leg
  components:
