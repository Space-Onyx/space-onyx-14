    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachLeftLeg, SurgeryStepIpcSecureLeftLeg, SurgeryStepIpcConnectLeftLeg ]
  - type: SurgeryPartCondition
    part: Groin
  - type: SurgeryMissingPartCondition
    part: Leg
    symmetry: Left

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachRightLeg
  name: Install right leg
