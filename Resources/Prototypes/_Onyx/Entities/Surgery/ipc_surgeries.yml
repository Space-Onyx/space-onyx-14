- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcRemoveBrain
  name: Remove positronic brain
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcRemoveBrain ]
  - type: SurgeryOrganCondition
    slot: Brain
    part: Chest

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcInsertBrain
  name: Install positronic brain
  components:
  - type: Surgery
    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcInsertBrain ]
  - type: SurgeryOrganCondition
    slot: Brain
    inverse: true
    part: Chest

