    requirement: SurgeryIpcOpenPanel
    steps: [ SurgeryStepIpcAttachLeftHand, SurgeryStepIpcSecureLeftHand, SurgeryStepIpcConnectLeftHand ]
  - type: SurgeryPartCondition
