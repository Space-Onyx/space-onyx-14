- type: entity
  id: SurgeryIpcBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgerySpeciesCondition
    species: [ Ipc ]

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcOpenPanel
  name: Open access panel
  components:
  - type: Surgery
    priority: -1
    icon: { sprite: Objects/Tools/screwdriver.rsi, state: screwdriver }
    steps:
      default:
        steps:
        - SurgeryStepIpcUnfastenPanel
        - SurgeryStepIpcOpenPanel
        - SurgeryStepIpcDisconnectWiring
  - type: SurgeryMarkerCondition
    missingAny: [ IncisionOpen, SkinRetracted, BleedersClamped ]

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcClosePanel
  name: Close access panel
  components:
  - type: Surgery
    priority: 1
    icon: { sprite: Objects/Tools/screwdriver.rsi, state: screwdriver }
    steps:
      default:
        steps:
        - SurgeryStepIpcReconnectWiring
        - SurgeryStepIpcClosePanel
        - SurgeryStepIpcFastenPanel
  - type: SurgeryMarkerCondition
    all: [ IncisionOpen ]

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcRemovePart
  name: Detach body part
  components:
  - type: Surgery
    useTargetPartIcon: true
    requirement: SurgeryIpcOpenPanel
    steps:
      default:
        steps:
        - SurgeryStepIpcDetachPart
  - type: SurgeryDetachablePartCondition

- type: entity
  parent: SurgeryIpcBase
  id: SurgeryIpcAttachHead
  name: Install head
  components:
