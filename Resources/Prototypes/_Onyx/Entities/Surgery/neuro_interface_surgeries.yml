- type: entity
  parent: BaseSurgeryInsertOrgan
  id: SurgeryInsertNeuroInterface
  name: Neuro-interface implantation
  components:
  - type: Surgery
    icon: { sprite: _Onyx/Objects/Augments/power.rsi, state: apc }
    steps:
      default:
        steps:
        - SurgeryOpenSkull
        - SurgeryStepInsertNeuroInterface
  - type: SurgeryOrganCondition
    slot: NeuroInterface
    inverse: true
    part: Head
  - type: SurgeryComponentCondition
    target: Part
    none: [ { type: Cybernetics } ]

- type: entity
  parent: BaseSurgeryRemoveOrgan
  id: SurgeryRemoveNeuroInterface
  name: Neuro-interface extraction
  components:
  - type: Surgery
    icon: { sprite: _Onyx/Objects/Augments/power.rsi, state: apc }
    steps:
      default:
        steps:
        - SurgeryOpenSkull
        - SurgeryStepRemoveNeuroInterface
  - type: SurgeryOrganCondition
    slot: NeuroInterface
    part: Head
