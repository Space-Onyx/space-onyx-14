    tool:
    - type: BoneSaw
  - type: SurgeryDetachPartEffect
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryStepEmoteEffect

- type: entity
