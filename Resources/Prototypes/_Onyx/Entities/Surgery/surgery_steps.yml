- type: entity
  id: SurgeryStepBase
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepBleedEffect
    damage: 10
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Suture the bleeding vessels
  components:
  - type: SurgeryStep
    tool:
    - type: Stitches
    add:
    - type: BleedersClamped
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches
  - type: SurgeryClampBleedEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Retract the skin
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: SkinRetracted
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Saw through bones
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: RibcageSawed
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryStepEmoteEffect
  - type: SurgeryOperatingTableCondition

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Prise the bones open
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: RibcageOpen
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: SurgeryOperatingTableCondition

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: Close bones
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    remove:
    - type: RibcageOpen
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: SurgeryOperatingTableCondition

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendRibcage
  name: Mend ribcage
  components:
  - type: SurgeryStep
    tool:
    - type: BoneGel
    remove:
    - type: RibcageSawed
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel
  - type: SurgeryOperatingTableCondition

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: Close incision
  components:
  - type: SurgeryStep
    tool:
    - type: Stitches
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: AbdominalCavityOpen
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches
  - type: SurgeryStepEmoteEffect
  - type: SurgeryCloseIncisionEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenAbdomen
  name: Open abdomen
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: AbdominalCavityOpen
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepHideItem
  name: Hide item
  components:
  - type: SurgeryStep
  - type: SurgeryInsertCavityItemEffect
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepTakeItem
  name: Take item
  components:
