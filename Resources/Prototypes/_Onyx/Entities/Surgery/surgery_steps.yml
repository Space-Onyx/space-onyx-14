    tool:
    - type: Tweezers
  - type: SurgeryRemoveCavityItemEffect
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemovePart
  name: Amputate body part
  components:
