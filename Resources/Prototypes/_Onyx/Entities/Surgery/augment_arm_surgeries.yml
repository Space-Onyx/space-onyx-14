- type: entity
  parent: BaseSurgeryInsertOrgan
  id: SurgeryInsertArmAugment
  name: Implant arm augment
  components:
  - type: Surgery
    steps:
      default:
        steps:
        - SurgeryOpenIncision
        - SurgeryStepInsertArmAugment
  - type: SurgeryOrganCondition
    slot: AugmentArm
    inverse: true
    part: Arm
  - type: SurgeryComponentCondition
    target: Part
    none: [ { type: Cybernetics } ]

- type: entity
  parent: BaseSurgeryRemoveOrgan
  id: SurgeryRemoveArmAugment
  name: Remove arm augment
  components:
  - type: Surgery
    steps:
      default:
        steps:
        - SurgeryOpenIncision
        - SurgeryStepRemoveArmAugment
  - type: SurgeryOrganCondition
    slot: AugmentArm
    part: Arm
