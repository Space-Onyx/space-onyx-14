- type: entityCategory
  id: SurgeryPrototypes
  components: [ Surgery, SurgeryStep ]
  hideSpawnMenu: true

- type: entity
  id: SurgeryBase
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgerySpeciesCondition
    species: [ Ipc, SlimePerson ]
    inverse: true

- type: entity
  parent: SurgeryBase
  id: SurgeryOpenIncision
  name: Open Incision
  components:
  - type: Surgery
    priority: -1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/scalpel.rsi, state: scalpel }
    steps:
      default:
        steps:
        - SurgeryStepOpenIncisionScalpel
        - SurgeryStepRetractSkin
      cybernetic:
        required:
        - type: Cybernetics
        steps:
        - SurgeryStepCutCyberneticCasing
        - SurgeryStepSpreadCyberneticCasing
  - type: SurgeryMarkerCondition
    missingAny: [ IncisionOpen, SkinRetracted ]

- type: entity
  parent: SurgeryBase
  id: SurgeryCloseIncision
  name: Close Incision
  components:
  - type: Surgery
    priority: 1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/stitches.rsi, state: stitches }
    steps:
      default:
        steps:
        - SurgeryStepCloseIncision
      cybernetic:
        required:
        - type: Cybernetics
        steps:
        - SurgeryStepWeldCyberneticCasing
  - type: SurgeryMarkerCondition
    all: [ IncisionOpen ]
  - type: SurgeryPartCondition
    part: Chest
    inverse: true

- type: entity
  parent: SurgeryBase
  id: SurgeryCloseRibcage
  name: Close Ribcage
  components:
  - type: Surgery
    priority: 1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/bone-gel.rsi, state: bone-gel }
    steps:
      default:
        steps:
        - SurgeryStepCloseBones
        - SurgeryStepMendRibcage
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMarkerCondition
    any: [ RibcageOpen, RibcageSawed ]

- type: entity
  parent: SurgeryBase
  id: SurgeryCloseChestIncision
  name: Close Chest Incision
  components:
  - type: Surgery
    priority: 1
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/stitches.rsi, state: stitches }
    requirement: SurgeryCloseRibcage
    steps:
      default:
        steps:
        - SurgeryStepCloseIncision
      cybernetic:
        required:
        - type: Cybernetics
        steps:
        - SurgeryStepWeldCyberneticCasing
  - type: SurgeryMarkerCondition
    all: [ IncisionOpen ]
  - type: SurgeryPartCondition
    part: Chest

- type: entity
  parent: SurgeryBase
  id: SurgeryOpenRibcage
  name: Open Ribcage
  components:
  - type: Surgery
    icon: { sprite: _Onyx/Objects/Specific/Medical/Surgery/circular-saw.rsi, state: circular-saw }
    requirement: SurgeryOpenIncision
    steps:
      default:
        steps:
        - SurgeryStepSawBones
        - SurgeryStepPriseOpenBones
  - type: SurgeryPartCondition
    part: Chest
  - type: SurgeryMarkerCondition
    missingAny: [ RibcageSawed, RibcageOpen ]

- type: entity
  parent: SurgeryBase
  id: SurgeryRemovePart
  name: Amputate
  components:
  - type: Surgery
    useTargetPartIcon: true
    requirement: SurgeryOpenIncision
    steps:
      default:
        steps:
        - SurgeryStepRemovePart
  - type: SurgeryDetachablePartCondition

