- type: entity
  parent: BaseSurgeryInsertOrgan
  id: SurgeryInsertAugmentPowerCell
  name: Implant augment power-cell slot
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
      default:
        steps:
        - SurgeryStepInsertAugmentPowerCell
  - type: SurgeryOrganCondition
    slot: AugmentPowerCell
    inverse: true
    part: Chest

- type: entity
  parent: BaseSurgeryRemoveOrgan
  id: SurgeryRemoveAugmentPowerCell
  name: Remove augment power-cell slot
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
      default:
        steps:
        - SurgeryStepRemoveAugmentPowerCell
  - type: SurgeryOrganCondition
    slot: AugmentPowerCell
    part: Chest

- type: entity
  parent: BaseSurgeryInsertOrgan
  id: SurgeryInsertAugmentCharger
  name: Implant augment recharger
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
      default:
        steps:
        - SurgeryStepInsertAugmentCharger
  - type: SurgeryOrganCondition
    slot: AugmentCharger
    inverse: true
    part: Chest

- type: entity
  parent: BaseSurgeryRemoveOrgan
  id: SurgeryRemoveAugmentCharger
  name: Remove augment recharger
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
      default:
        steps:
        - SurgeryStepRemoveAugmentCharger
  - type: SurgeryOrganCondition
    slot: AugmentCharger
    part: Chest
