- type: entity
  parent:
  - AppearanceShadowkin
  - BaseSpeciesMobOrganic
  id: MobShadowkin
  name: Urist McShadow
  components:
  - type: LanguageKnowledge
    speaks: [ TauCetiBasic, Marish ]
    understands: [ TauCetiBasic, Marish ]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 300
      behaviors:
      - !type:GibBehavior {}
      - !type:SpawnEntitiesBehavior
        spawn:
          ShadowkinShadow: { min: 1, max: 1 }
          EffectFlashShadowkinShadeskip: { min: 1, max: 1 }
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash: { min: 1, max: 1 }
      - !type:BurnBodyBehavior {}
      - !type:PlaySoundBehavior
        sound: { collection: MeatLaserImpact }
  - type: PassiveDamage
    allowedStates: [ Alive ]
    damageCap: 20
    damage:
      types: { Heat: -0.07 }
      groups: { Brute: -0.07 }
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Flammable
    damage: { types: { Heat: 1.5 } }
  - type: Damageable
    damageModifierSet: Shadowkin
  - type: Barotrauma
    damage: { types: { Blunt: 0.35 } }
  - type: Bloodstream
    bloodReagent: BlackBlood
  - type: TemperatureDamage
    heatDamageThreshold: 330
    coldDamageThreshold: 195
    coldDamage: { types: { Cold: 0.05 } }
    heatDamage: { types: { Heat: 0.25 } }
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle { radius: 0.35 }
        density: 130
        mask: [ MobMask ]
        layer: [ MobLayer ]
  - type: MeleeWeapon
    soundHit: { collection: AlienClaw }
    angle: 30
    animation: WeaponArcClaw
    damage: { types: { Slash: 5 } }
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 4.5
  - type: Speech
    allowedEmotes: [ Mars, Wurble, Hiss, Meow, Mew, Growl, Purr ]
  - type: Vocal
    sounds:
      Male: MaleShadowkin
      Female: FemaleShadowkin
      Unsexed: MaleShadowkin
  - type: CollectiveMind
    defaultChannel: Empathy
    channels: [ Empathy ]
  - type: TypingIndicator
    proto: alien
  - type: Respirator
    updateInterval: 6
    saturationLoss: 0.2
    maxSaturation: 30
    saturation: 30
  - type: Tag
    tags: [ CanPilot, FootstepSound, DoorBumpOpener, AnomalyHost, ShadowkinEmotes ]

- type: entity
  parent: MobShadowkin
  id: MobShadowkinRandom
  name: Urist McShadowkin
  suffix: Random Appearance
  components:
  - type: RandomHumanoidAppearance
  - type: RandomMetadata
    nameSegments: [ NamesShadowkin ]
