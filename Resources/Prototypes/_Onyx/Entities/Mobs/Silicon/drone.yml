- type: entity
  save: false
  abstract: true
  id: PlayerSiliconBase
  parent: MobBloodstream
  components:
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: Input
    context: human
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: Clickable
  - type: Injurable
    damageContainer: Inorganic
  - type: Bloodstream
    bloodReagent: Oil
    bloodMaxVolume: 50
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -1
  - type: InteractionOutline
  - type: Fixtures
  - type: MovementSpeedModifier
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Physics
    bodyType: KinematicController
  - type: Hands
    showInHands: false
    activeHandId: right hand
    hands:
      right hand: { location: Right }
      right hand 2: { location: Right }
      right hand 3: { location: Right }
      right hand 4: { location: Right }
      left hand: { location: Left }
      left hand 2: { location: Left }
    sortedHands: [right hand, right hand 2, right hand 3, right hand 4, left hand, left hand 2]
  - type: ComplexInteraction
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels: [Common]
  - type: DoAfter
  - type: Pullable
  - type: Examiner
  - type: Puller
  - type: StandingState
  - type: Alerts
  - type: ProtectedFromStepTriggers
  - type: Targeting
  - type: FlashImmunity

- type: entity
  name: drone
  id: Drone
  parent: [PlayerSiliconBase, BaseBorgTransponder]
  components:
  - type: Drone
    whitelist:
      tags: [DroneUsable, Trash, Crayon]
    blacklist:
      tags: [Syringe, HighRiskItem, Sidearm, Taser, Flash]
      components: [Handcuff, Gun, EnergySword]
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: PowerCellDraw
    drawRate: 0.6
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        disableEject: true
  - type: Instrument
    allowPercussion: false
    handheld: false
    bank: 1
    program: 2
  - type: Loadout
    prototypes: [StartingGearDroneTools]
  - type: NameIdentifier
    group: Drone
  - type: Inventory
    templateId: drone
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface
        requireInputValidation: false
  - type: IntrinsicUI
    uis:
      enum.StationMapUiKey.Key:
        toggleAction: ActionShowStationMap
      enum.InstrumentUiKey.Key:
        toggleAction: ActionDronePlayMidi
  - type: StationMap
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-drone-name
    description: ghost-role-information-drone-description
    rules: ghost-role-information-drone-rules
    mindRoles: [MindRoleGhostRoleSilicon]
    job: Borg
  - type: GhostTakeoverAvailable
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
    minimumFrictionSpeed: 0
    weightlessAcceleration: 1.2
    weightlessFriction: 1
    weightlessFrictionNoInput: 2
    offGridFriction: 1.5
    weightlessModifier: 1
  - type: MobState
    allowedStates: [Alive, Dead]
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Dead
  - type: NoSlip
  - type: StatusEffects
    allowed: [Stun, KnockedDown, SlowedDown]
  - type: SlowOnDamage
    speedModifierThresholds:
      30: 0.7
      50: 0.5
  - type: Temperature
    heatDamageThreshold: 5000
    temperature: 310.15
    heatDamage:
      types:
        Heat: 1
  - type: Sprite
    drawdepth: SmallMobs
    layers:
    - state: shell
      sprite: _Onyx/Mobs/Silicon/drone.rsi
      map: [base]
  - type: BorgTransponder
    sprite: { sprite: _Onyx/Mobs/Silicon/drone.rsi, state: shell }
    name: drone
  - type: MovementAlwaysTouching
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 30
        mask: [SmallMobMask]
        layer: [SmallMobLayer]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DroneVisuals.Status:
        base:
          Off: { state: shell }
          On: { state: drone }
  - type: LanguageSpeaker
  - type: LanguageKnowledge
    speaks:
    - DroneTalk
    understands:
    - DroneTalk
    - TauCetiBasic
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 8
  - type: ActionGrant
    actions: [ActionViewLaws]
  - type: Actions
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 4
    energy: 0.8
    softness: 10
    color: "#bfe9ff"
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
  - type: InputMover
  - type: MobMover
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Tag
    tags: [CannotSuicide, EmagImmune, CanPilot, VimPilot, Bot]
  - type: CollectiveMind
    defaultChannel: Dronemind
    channels: [Dronemind]
  - type: Access
    tags: [Engineering, Maintenance, Atmospherics]
  - type: DroneVision
  - type: VentCrawler
  - type: ZombieImmune
