- type: entity
  abstract: true
  parent: OrganHumanInternal
  id: OnyxCyberneticOrganBase
  components:
  - type: Cybernetics
  - type: Organ
    destructionWound: null
    destructionWoundSeverity: 0
  - type: TransplantCompatibility
    profile: Cybernetic
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi

- type: entity
  parent: [ OrganHumanEyes, OnyxCyberneticOrganBase ]
  id: BasicCyberneticEyes
  name: cybernetic eyes
  description: Durable synthetic eyes with integrated flash protection.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Eyes
    colorFromProfile: false
    data:
      state: eyes
      color: "#00FF00"
  - type: Cybernetics
    effects: FlashProtection

- type: entity
  parent: BasicCyberneticEyes
  id: MedicalCyberneticEyes
  name: cybernetic medical HUD eyes
  description: Cybernetic eyes with an integrated medical HUD.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-medhud
  - type: Cybernetics
    effects: MedicalHud, FlashProtection
  - type: VisualOrgan
    data:
      state: eyes
      color: "#00BFFF"

- type: entity
  parent: BasicCyberneticEyes
  id: SecurityCyberneticEyes
  name: cybernetic security HUD eyes
  description: Cybernetic eyes with an integrated security HUD.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-sechud
  - type: Cybernetics
    effects: SecurityHud, FlashProtection
  - type: VisualOrgan
    data:
      state: eyes
      color: "#FF0000"

- type: entity
  parent: BasicCyberneticEyes
  id: DiagnosticCyberneticEyes
  name: cybernetic diagnostic HUD eyes
  description: Cybernetic eyes with an integrated diagnostic HUD.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-diagnostic
  - type: Cybernetics
    effects: DiagnosticHud, FlashProtection
  - type: VisualOrgan
    data:
      state: eyes
      color: "#FF9900"

- type: entity
  parent: BasicCyberneticEyes
  id: CyberEyeNightVision
  name: night vision cybernetic eyes
  description: Cybernetic eyes that provide night vision. EMP pulses temporarily disable them.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/VisionEyes/items.rsi
    layers:
    - state: eyes_night
  - type: Cybernetics
    effects: NightVision, FlashProtection
  - type: VisualOrgan
    data:
      sprite: _Onyx/Cybernetics/VisionEyes/body.rsi
      state: eyes_night
      color: "#04409c"
      shader: unshaded

- type: entity
  parent: BasicCyberneticEyes
  id: CyberEyeThermal
  name: thermal vision cybernetic eyes
  description: Cybernetic eyes that reveal living bodies through obstacles. EMP pulses temporarily disable them.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/VisionEyes/items.rsi
    layers:
    - state: eyes_thermal
  - type: Cybernetics
    effects: ThermalVision, FlashProtection
  - type: VisualOrgan
    data:
      sprite: _Onyx/Cybernetics/VisionEyes/body.rsi
      state: eyes_thermal
      color: "#04409c"
      shader: unshaded

- type: entity
  parent: [ OrganHumanHeart, OnyxCyberneticOrganBase ]
  id: BasicCyberneticHeart
  name: cybernetic heart
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: heart-on
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]

- type: entity
  parent: BasicCyberneticHeart
  id: UpgradedCyberneticHeart
  name: upgraded cybernetic heart
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: heart-u-on

- type: entity
  parent: [ OrganHumanLiver, OnyxCyberneticOrganBase ]
  id: BasicCyberneticLiver
  name: cybernetic liver
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: liver
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]

- type: entity
  parent: [ OrganHumanLungs, OnyxCyberneticOrganBase ]
  id: BasicCyberneticLungs
  name: cybernetic lungs
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: lung-l
    - state: lung-r
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]

- type: entity
  parent: BasicCyberneticLungs
  id: UpgradedCyberneticLungs
  name: upgraded cybernetic lungs
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: lung-u-l
    - state: lung-u-r
