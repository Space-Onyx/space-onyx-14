- type: entity
  abstract: true
  parent: OrganHumanInternal
  id: OnyxCyberneticOrganBase
  components:
  - type: Cybernetics
  - type: Organ
    destructionWound: null
    destructionWoundSeverity: 0
  - type: TransplantCompatibility
    profile: Cybernetic
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi

- type: entity
  parent: [ OrganHumanEyes, OnyxCyberneticOrganBase ]
  id: BasicCyberneticEyes
  name: cybernetic eyes
  description: Durable synthetic eyes.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Eyes
    colorFromProfile: false
    data:
      state: eyes
      color: "#00FF00"
  - type: Cybernetics

- type: entity
  parent: BasicCyberneticEyes
  id: MedicalCyberneticEyes
  name: cybernetic medical HUD eyes
  description: Cybernetic eyes with an integrated medical HUD.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-medhud
  - type: Cybernetics
  - type: FunctionalOrgan
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons
  - type: VisualOrgan
    data:
      state: eyes
      color: "#00BFFF"

- type: entity
  parent: BasicCyberneticEyes
  id: SecurityCyberneticEyes
  name: cybernetic security HUD eyes
  description: Cybernetic eyes with an integrated security HUD and flash protection.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-sechud
  - type: Cybernetics
  - type: FunctionalOrgan
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowSquadIcons
    - type: ShowContrabandDetails
    - type: FlashImmunity
  - type: VisualOrgan
    data:
      state: eyes
      color: "#FF0000"

- type: entity
  parent: BasicCyberneticEyes
  id: DiagnosticCyberneticEyes
  name: cybernetic diagnostic HUD eyes
  description: Cybernetic eyes with an integrated diagnostic HUD.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: eyes-diagnostic
  - type: Cybernetics
  - type: FunctionalOrgan
    components:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
    - type: ShowAccessReaderSettings
  - type: VisualOrgan
    data:
      state: eyes
      color: "#FF9900"

- type: entity
  parent: BasicCyberneticEyes
  id: CyberEyeNightVision
  name: night vision cybernetic eyes
  description: Cybernetic eyes that provide night vision and flash protection. EMP pulses temporarily disable them.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/VisionEyes/items.rsi
    layers:
    - state: eyes_night
  - type: Cybernetics
  - type: FunctionalOrgan
    components:
    - type: NightVision
      enabled: false
      action: ActionToggleNightVision
    - type: FlashImmunity
  - type: VisualOrgan
    data:
      sprite: _Onyx/Cybernetics/VisionEyes/body.rsi
      state: eyes_night
      color: "#04409c"
      shader: unshaded

- type: entity
  parent: BasicCyberneticEyes
  id: CyberEyeThermal
  name: thermal vision cybernetic eyes
  description: Cybernetic eyes that reveal living bodies through obstacles and protect from flashes. EMP pulses temporarily disable them.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/VisionEyes/items.rsi
    layers:
    - state: eyes_thermal
  - type: Cybernetics
  - type: FunctionalOrgan
    components:
    - type: ThermalVision
      enabled: false
    - type: FlashImmunity
  - type: VisualOrgan
    data:
      sprite: _Onyx/Cybernetics/VisionEyes/body.rsi
      state: eyes_thermal
      color: "#FF0000"
      shader: unshaded

- type: entity
  parent: [ OrganHumanHeart, OnyxCyberneticOrganBase ]
  id: BasicCyberneticHeart
  name: cybernetic heart
  description: A cybernetic heart on par with an organic one.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: heart-on
  - type: Metabolizer
    metabolizerTypes: [ Human, Cybernetic ]

- type: entity
  parent: BasicCyberneticHeart
  id: UpgradedCyberneticHeart
  name: upgraded cybernetic heart
  description: An upgraded cybernetic heart that pumps blood more efficiently.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: heart-u-on
  - type: FunctionalOrgan
    components:
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damage:
        groups:
          Airloss: -0.15
          Brute: -0.05

- type: entity
  parent: [ OrganHumanLiver, OnyxCyberneticOrganBase ]
  id: BasicCyberneticLiver
  name: cybernetic liver
  description: A cybernetic liver that filters toxins without poisoning.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    state: liver
  - type: Metabolizer
    metabolizerTypes: [ Human, Cybernetic ]
  - type: FunctionalOrgan
    components:
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damage:
        groups:
          Toxin: -0.2

- type: entity
  parent: [ OrganHumanLungs, OnyxCyberneticOrganBase ]
  id: BasicCyberneticLungs
  name: cybernetic lungs
  description: Cybernetic lungs that allow breathing in vacuum and ignore pressure.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: lung-l
    - state: lung-r
  - type: Metabolizer
    metabolizerTypes: [ Human, Cybernetic ]
  - type: FunctionalOrgan
    components:
    - type: PermanentStatusEffects
      statusEffects:
      - StatusEffectPressureImmunity
    - type: BreathingImmunity

- type: entity
  parent: BasicCyberneticLungs
  id: UpgradedCyberneticLungs
  name: upgraded cybernetic lungs
  description: Upgraded cybernetic lungs with improved filtration and pressure adaptation.
  components:
  - type: Sprite
    sprite: _Onyx/Cybernetics/organs.rsi
    layers:
    - state: lung-u-l
    - state: lung-u-r
  - type: FunctionalOrgan
    components:
    - type: PermanentStatusEffects
      statusEffects:
      - StatusEffectPressureImmunity
    - type: BreathingImmunity
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damage:
        groups:
          Airloss: -0.1
          Toxin: -0.05
