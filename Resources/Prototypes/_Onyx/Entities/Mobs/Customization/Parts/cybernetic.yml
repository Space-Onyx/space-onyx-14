- type: entity
  abstract: true
  id: OnyxCyberneticPartBase
  suffix: ""
  components:
  - type: Cybernetics
  - type: Woundable
    profile: CyberneticBodyPartProfile
  - type: BodyPart
    fractureProfile: CyberneticFractureProfile
  - type: TransplantCompatibility
    profile: Cybernetic
  - type: Damageable
  - type: Injurable
    damageContainer: SiliconIpc
  - type: RepairableBodyPart
    damage:
      types:
        Blunt: -8
        Slash: -6
        Piercing: -5
        Heat: -7
        Cold: -6
        Caustic: -4
    doAfterDelay: 3
  - type: Sprite
    sprite: _Onyx/Cybernetics/bishop_main.rsi
  - type: VisualOrgan
    data:
      sprite: _Onyx/Cybernetics/bishop_main.rsi

- type: entity
