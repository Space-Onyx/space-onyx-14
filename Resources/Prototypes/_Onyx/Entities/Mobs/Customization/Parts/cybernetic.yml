    fractureProfile: CyberneticFractureProfile
    amputationThresholds:
      Slash: 270
      Piercing: 400
      Blunt: 600
  - type: TransplantCompatibility
    profile: Cybernetic
  - type: Sprite
    sprite: _Onyx/Cybernetics/bishop_main.rsi
    state: l_arm-combined
  - type: VisualOrgan
    colorFromProfile: false
    data: { sprite: _Onyx/Cybernetics/bishop_main.rsi, state: l_arm-combined }
  - type: RoundstartCybernetics
