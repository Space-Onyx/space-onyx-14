- type: entity
  parent: [ SimpleSpaceMobBase, MobCombat ]
  id: MobBearGoon
  name: bear
  description: Why are you staring? Never seen a bear before?
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions: [ SimpleHostile ]
  - type: Sprite
    drawdepth: Mobs
    sprite: _Onyx/Mobs/Animals/brullbar.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bear
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bear
      Dead:
        Base: beardead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: Butcherable
    spawned:
    - id: FoodMeatBear
      amount: 1
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Fauna

