- type: entity
  id: LavalandEliteBase
  parent: LavalandMobBase
  name: Elite
  description: An elite monster, found in one of the strange tumors on lavaland.
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle { radius: 0.5 }
        density: 300
        mask: [ MobMask ]
        layer: [ MobLayer ]
  - type: HTN
    rootTask: { task: SimpleHostileCompound }
  - type: Sprite
    sprite: _Onyx/Mobs/Lavaland/Elites/32x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: legionnaire
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit: { path: /Audio/Effects/demon_attack1.ogg }
    animation: WeaponArcBite
    damage:
      types: { Slash: 10, Blunt: 10, Structural: 50 }
  - type: Tag
    tags: [ CannotSuicide ]
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds: { 0: Alive, 1000: Dead }
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive
    forgiveRange: 20

- type: entity
  id: LavalandEliteLegionnaire
  parent: LavalandEliteBase
  name: Legionnaire
  description: A towering skeleton, embodying the terrifying power of Legion.
  components:
  - type: Sprite
    sprite: _Onyx/Mobs/Lavaland/Elites/32x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: legionnaire
  - type: DamageStateVisuals
    states:
      Alive: { Base: legionnaire }
      Dead: { Base: legionnaire_dead }
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit: { path: /Audio/Effects/bite.ogg }
    animation: WeaponArcBite
    damage:
      types: { Slash: 25, Blunt: 10, Structural: 50 }

- type: entity
  id: LavalandElitePandora
  name: Pandora
  description: A large magic box with similar power and design to the Hierophant. Once it opens, it's not easy to close it.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle { radius: 0.5 }
        density: 50
        mask: [ MobMask ]
        layer: [ MobLayer ]
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: human
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: false
  - type: CombatMode
  - type: MobState
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Onyx/Mobs/Lavaland/Elites/32x64.rsi
    state: pandora
  - type: DamageStateVisuals
    states:
      Alive: { Base: pandora }
      Dead: { Base: pandora_dead }
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds: { 0: Alive, 1000: Dead }
  - type: Tag
    tags: [ CannotSuicide ]
  - type: NoSlip
  - type: Aggressive
    forgiveRange: 20
  - type: BossMusic
    soundId: Hierophant
  - type: Fauna
  - type: WeatherImmune

- type: entity
  id: LavalandEliteHerald
  parent: LavalandEliteBase
  name: Herald
  description: A monstrous beast which fires deadly projectiles at threats and prey.
  components:
  - type: HTN
    rootTask: { task: SimpleRangedHostileCompound }
  - type: Sprite
    sprite: _Onyx/Mobs/Lavaland/Elites/64x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: herald
  - type: DamageStateVisuals
    states:
      Alive: { Base: herald }
      Dead: { Base: herald_dying }
  - type: BatteryAmmoProvider
    proto: LavalandBossKineticProjectile
    fireCost: 50
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    projectileSpeed: 20
    fireRate: 0.9
    useKey: false
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    soundGunshot: /Audio/Weapons/plasma_cutter.ogg

- type: entity
  id: LavalandEliteGoliathBroodmother
  parent: LavalandEliteBase
  name: Broodmother
  description: An example of sexual dimorphism, this female goliath looks much different than the males of her species. She is, however, just as dangerous, if not more.
  components:
  - type: HTN
    rootTask: { task: SimpleRangedHostileCompound }
  - type: Sprite
    sprite: _Onyx/Mobs/Lavaland/Elites/64x64.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: broodmother
  - type: DamageStateVisuals
    states:
      Alive: { Base: broodmother }
      Dead: { Base: egg_sac }
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit: { path: /Audio/Effects/bite.ogg }
    animation: WeaponArcBite
    damage:
      types: { Slash: 15, Blunt: 15, Structural: 50 }
