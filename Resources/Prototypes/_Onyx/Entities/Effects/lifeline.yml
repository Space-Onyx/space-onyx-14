- type: entity
  parent: Acidifier
  id: BluespaceLifeline
  name: bluespace lifeline
  description: Teleports your body to save your life!
  components:
  - type: Sprite
    sprite: _Onyx/Effects/bluespace_lifeline.rsi
    noRot: true
    layers:
    - state: bluespace_lifeline
      shader: unshaded
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Onyx/Effects/stasisgun_reload.ogg
  - type: PointLight
    color: SkyBlue
    radius: 3
    energy: 1
    netsync: false

- type: entity
  parent: BluespaceLifeline
  id: BluespaceLifelineSpawnCore
  components:
  - type: SpawnOnDespawn
    prototype: AnomalyCoreBluespace

- type: entity
  parent: BluespaceLifeline
  id: BluespaceTeleportationEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags: [ HideContextMenu ]
  - type: SpawnOnDespawn
    prototype: AdminInstantEffectFlash
  - type: Transform
    anchored: false

- type: entity
  parent: Acidifier
  id: RedspaceLifeline
  name: redspace lifeline
  description: Teleports your body to save your life!
  components:
  - type: Sprite
    sprite: _Onyx/Effects/redspace_lifeline.rsi
    noRot: true
    layers:
    - state: redspace_lifeline
      shader: unshaded
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Onyx/Effects/stasisgun_reload.ogg
  - type: PointLight
    color: Red
    radius: 3
    energy: 1
    netsync: false

- type: entity
  parent: RedspaceLifeline
  id: RedspaceLifelineSpawnCore
  components:
  - type: SpawnOnDespawn
    prototype: Telecrystal1

- type: entity
  parent: RedspaceLifeline
  id: RedspaceTeleportationEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags: [ HideContextMenu ]
  - type: SpawnOnDespawn
    prototype: AdminInstantEffectFlash
  - type: Transform
    anchored: false
