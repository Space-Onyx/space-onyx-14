- type: entity
  parent: [ BaseWall, BaseStructureHealth ]
  id: WallRiveted
  name: riveted wall
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Walls/riveted.rsi
  - type: Icon
    sprite: _Onyx/Structures/Walls/riveted.rsi
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: riveted
  - type: StaticPrice
    price: 150

