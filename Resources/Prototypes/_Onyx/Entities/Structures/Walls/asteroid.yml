#region Bluespace crystal rocks

- type: entity
  abstract: true
  id: BaseRockBSCrystal
  suffix: bluespace crystal
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBSCrystal
  - type: Sprite
    layers:
    - sprite: _Onyx/Structures/Walls/bluespace_crystal.rsi
      state: rock_bluespace_crystal
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]
      visible: false

- type: entity
  id: MeteorRockBSCrystal
  parent: [ BaseRockBSCrystal, AsteroidRock ]
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock_asteroid
    - sprite: _Onyx/Structures/Walls/bluespace_crystal.rsi
      state: rock_bluespace_crystal
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]
      visible: false

