    states:
    - !type:EdgeSpriteSmoothing
      mask: [ walls ]
      base: rock_wall_
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
