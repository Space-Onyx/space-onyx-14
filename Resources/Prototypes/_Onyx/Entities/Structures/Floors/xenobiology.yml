- type: entity
  id: FloorBluespaceEntity
  name: bluespace carpet
  description: State-of-the-art carpet from the Nanotrasen Aperture Laboratory. It makes anyone crossing it faster.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _Onyx/Xenobiology/Floors/floors.rsi
    drawdepth: FloorTiles
    state: bluespace
  - type: SyncSprite
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection: { collection: FootstepHoverBorg }
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 10 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn: { FloorTileItemBluespace: { min: 1, max: 1 } }
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: SpeedModifierContacts
    walkSpeedModifier: 1.55
    sprintSpeedModifier: 1.55
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.5,-0.5,0.5,0.5" }
        layer: [ SlipLayer ]
        mask: [ ItemMask ]
        density: 1000
        hard: false
  - type: Tag
    tags: [ Catwalk ]

- type: entity
  id: FloorSepiaEntity
  name: sepia carpet
  description: The carpet feels so nostalgic that leaving it becomes difficult.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _Onyx/Xenobiology/Floors/floors.rsi
    drawdepth: FloorTiles
    state: sepia
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection: { collection: FootstepFloor }
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 10 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn: { FloorTileItemSepia: { min: 1, max: 1 } }
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.45
    sprintSpeedModifier: 0.45
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.5,-0.5,0.5,0.5" }
        layer: [ SlipLayer ]
        mask: [ ItemMask ]
        density: 1000
        hard: false
  - type: SpawnAfterInteract
    prototype: FloorTileItemSepia
    doAfter: 1
    removeOnInteract: true
  - type: Tag
    tags: [ Catwalk ]
