- type: entity
  parent: DebugAPCRecharging
  id: OmniControlUnit
  name: omni-control unit
  description: A compact all-in-one utility core that provides power and local gravity.
  suffix: Power-Gravity
  components:
  - type: Battery
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50000
  - type: PowerNetworkBattery
    maxSupply: 1.0e9
    maxChargeRate: 1.0e9
    supplyRampTolerance: 1.0e9
    supplyRampRate: 1.0e9
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: PowerCharge
    idlePower: 15
    activePower: 500
  - type: Sprite
    sprite: Structures/Wallmounts/apc.rsi
    layers:
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: channel-on
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - sprite: Structures/Machines/gravity_generator.rsi
      state: off
      map: ["enum.GravityGeneratorVisualLayers.Base"]
    - sprite: Structures/Machines/gravity_generator.rsi
      state: off
      map: ["enum.GravityGeneratorVisualLayers.Core"]
  - type: GravityGenerator
    spriteMap:
      broken: broken
      unpowered: off
      off: off
      on: on

- type: entity
  parent: OmniControlUnit
  id: OmniControlUnitUnlocked
  name: omni-control unit
  description: A compact all-in-one utility core that provides power and local gravity.
  suffix: Power-Gravity, Unlocked
  components:
  - type: AccessReader
    access: [ ]