- type: entity
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: SaunaOven
  name: sauna oven
  description: A modest stone-topped sauna oven. Add fuel and water, then light it to make steam.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Decoration/sauna_oven.rsi
    layers:
    - state: sauna_oven
      map: [ "enum.SaunaOvenLayers.Base" ]
    - state: sauna_oven_on_overlay
      map: [ "enum.SaunaOvenLayers.Fire" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SaunaOvenVisuals.Lit:
        enum.SaunaOvenLayers.Base:
          True: { state: sauna_oven_on }
          False: { state: sauna_oven }
        enum.SaunaOvenLayers.Fire:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: InteractionOutline
  - type: SaunaOven
  - type: Construction
    graph: SaunaOven
    node: oven
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 20
            max: 30

- type: entity
  id: EffectSaunaSteam
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.25
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: Effects/chempuff.rsi
    state: chempuff
    color: "#dcefff99"
  - type: Tag
    tags:
    - HideContextMenu
