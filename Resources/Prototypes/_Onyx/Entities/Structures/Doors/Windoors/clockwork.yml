- type: entity
  abstract: true
  parent: BaseWindoorGeneric
  id: BaseClockworkWindoor
  name: clockwork windoor
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Windoors/clockwork_windoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 200 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassClockwork:
            min: 1
            max: 2
          SheetBrass1:
            min: 0
            max: 2
      - !type:DoActsBehavior { acts: [ "Destruction" ] }
  - type: Construction
    graph: Windoor
    node: windoorClockwork
    containers: [ board ]
  - type: StaticPrice
    price: 240

- type: entity
  id: WindoorClockwork
  parent: BaseClockworkWindoor
  name: clockwork windoor
  description: It's a sturdy window and a sliding door. Wow!

- type: entity
  parent: WindoorAssembly
  id: WindoorAssemblyClockwork
  name: clockwork windoor assembly
  description: It opens, it closes, and you can see through it! This one looks tough.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Windoors/clockwork_windoor.rsi
    layers:
    - state: open
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 100 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1:
            min: 1
            max: 2
  - type: Construction
    graph: Windoor
    node: assemblyClockwork
