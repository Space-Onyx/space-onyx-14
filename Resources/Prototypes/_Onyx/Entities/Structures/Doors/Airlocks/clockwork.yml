- type: entity
  parent: Airlock
  id: PinionAirlock
  suffix: Pinion, Clockwork
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Standard/clockwork_pinion.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: Construction
    graph: PinionAirlock
    node: airlock
    containers: [ board ]
  - type: Paintable
    group: null

- type: entity
  parent: AirlockGlass
  id: PinionAirlockGlass
  suffix: Pinion, Clockwork, Glass
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Glass/clockwork_pinion.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: Construction
    graph: PinionAirlock
    node: glassAirlock
    containers: [ board ]
  - type: StaticPrice
    price: 165
  - type: Paintable
    group: null

- type: entity
  parent: AirlockAssembly
  id: PinionAirlockAssembly
  suffix: Pinion, Clockwork
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Standard/clockwork_pinion.rsi
    state: assembly
  - type: Construction
    graph: PinionAirlock
    node: assembly

- type: entity
  parent: PinionAirlockAssembly
  id: PinionAirlockAssemblyGlass
  suffix: Pinion, Clockwork, Glass
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Glass/clockwork_pinion.rsi
    state: assembly
