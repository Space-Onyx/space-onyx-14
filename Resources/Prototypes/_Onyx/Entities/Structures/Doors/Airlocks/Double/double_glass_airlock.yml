- type: entity
  parent: Airlock
  id: DoubleGlassAirlock
  name: Double Glass Airlock
  description: It opens, it closes, and maybe crushes you, but it's bigger than normal door.
  components:
  - type: MultiTileAirlockAirtight
  - type: Door
    closeTimeOne: 0.4
    closeTimeTwo: 0.2
    openTimeOne: 0.2
    openTimeTwo: 0.4
    occludes: false
  - type: Occluder
    enabled: false
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
    snapCardinals: false
    offset: 0.5,0
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,1.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: RCDDeconstructable
    deconstructable: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: LayerChangeOnWeld
    unWeldedLayer: GlassAirlockLayer
    weldedLayer: GlassLayer
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Transform
    noRot: false
  - type: Construction
    graph: DoubleAirlock
    node: doubleGlassAirlock
  - type: Paintable
    group: null
  - type: RadiationBlocker
    resistance: 2
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Tag
    tags:
      - GlassAirlock

- type: entity
  parent: AirlockAssembly
  id: DoubleGlassAirlockAssembly
  name: double glass airlock assembly
  description: It opens, it closes, and maybe crushes you, but it's bigger than normal door.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Doors/Airlocks/Double/double_glass_airlock.rsi
    state: assembly
    snapCardinals: false
    offset: 0.5,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,1.49,0.49"
        density: 110
        mask:
        - FullTileMask
        layer:
        - HumanoidBlockLayer
  - type: Construction
    graph: DoubleAirlock
    node: assembly
