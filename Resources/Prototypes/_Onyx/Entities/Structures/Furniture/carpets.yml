- type: entity
  id: Carpet
  components:
  - type: Destructible
    thresholds:
    - trigger: &CarpetDamageTrigger
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          FloorCarpetItemRed: &CarpetItemSpawn
            min: 1
            max: 1

