- type: entity
  parent: BaseStructure
  id: XenomorphEgg
  name: xenomorph egg
  description: A large mottled egg.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    noRot: true
    layers:
    - state: egg_growing
      map: ["status"]
  - type: Icon
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    state: egg_growing
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.XenomorphEggKey.Key:
        status:
          Burst: { state: egg_burst }
          Bursting: { state: egg_bursting }
          Grown: { state: egg_grown }
          Growning: { state: egg_growing }
  - type: Injurable
    damageContainer: Biological
  - type: Damageable
    damageModifierSet: Resin
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 50 }
      behaviors:
      - !type:DoActsBehavior { acts: [Destruction] }
      - !type:PlaySoundBehavior
        sound: { collection: blood }
    - trigger: !type:DamageTypeTrigger { damageType: Heat, damage: 45 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn: { Ash: { min: 0, max: 1 } }
      - !type:DoActsBehavior { acts: [Destruction] }
  - type: Flammable
    fireSpread: false
    damage: { types: { Heat: 3 } }
  - type: XenomorphEgg
  - type: StepTrigger
    intersectRatio: 0.2
    requiredTriggeredSpeed: 0
  - type: RequireProjectileTarget
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb { bounds: "-0.45,-0.45,0.45,0.05" }
        density: 190
        layer: [BulletImpassable]

- type: entity
  parent: XenomorphEgg
  id: XenomorphEggGrown
  suffix: Grown
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    noRot: true
    layers:
    - state: egg_grown
      map: ["status"]
  - type: Icon
    sprite: _Onyx/Structures/Resin/xenomorph_egg.rsi
    state: egg_grown
  - type: XenomorphEgg
    status: Grown
