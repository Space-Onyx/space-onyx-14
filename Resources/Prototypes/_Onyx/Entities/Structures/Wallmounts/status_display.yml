- type: entity
  parent: BaseWallmountMachine
  id: StatusDisplay
  name: status display
  description: Displays current station status.
  components:
  - type: Rotatable
  - type: WallMount
    directionalVisibility: false
  - type: StatusDisplayTextVisuals
    rows:
    - text: ""
      layer: enum.StatusDisplayVisualLayers.Line1
      offset: 0.03125,0.15625
    - text: ""
      layer: enum.StatusDisplayVisualLayers.Line2
      offset: 0.03125,-0.0625
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Onyx/Structures/Wallmounts/screen.rsi
    noRot: true
    layers:
    - state: frame
    - shader: StencilClear
      state: mask
    - shader: StencilMask
      state: mask
    - map: ["enum.StatusDisplayVisualLayers.Line1"]
      shader: StencilDraw
      color: "#22ccff"
      visible: false
    - map: ["enum.StatusDisplayVisualLayers.Line2"]
      shader: StencilDraw
      color: "#22ccff"
      visible: false
    - map: ["alert_status"]
      visible: false
      state: status_display_green
    - map: ["alert_border"]
      visible: false
      state: alert_border_green
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StatusDisplayVisuals.ShowAlertBorder:
        alert_border:
          True: { visible: true }
          False: { visible: false }
      enum.StatusDisplayVisuals.AlertLevel:
        alert_border:
          green: { state: alert_border_green }
          blue: { state: alert_border_blue }
          red: { state: alert_border_red }
          white: { state: alert_border_white }
          yellow: { state: alert_border_yellow }
          violet: { state: alert_border_violet }
          deltanuke: { state: alert_border_deltanuke }
          epsilon: { state: alert_border_epsilon }
          gamma: { state: alert_border_gamma }
          octarine: { state: alert_border_octarine }
          zeta: { state: alert_border_zeta }
        alert_status:
          green: { state: status_display_green }
          blue: { state: status_display_blue }
          red: { state: status_display_red }
          white: { state: status_display_white }
          yellow: { state: status_display_yellow }
          violet: { state: status_display_violet }
          deltanuke: { state: status_display_deltanuke }
          epsilon: { state: status_display_epsilon }
          gamma: { state: status_display_gamma }
          octarine: { state: status_display_octarine }
          zeta: { state: status_display_zeta }
      enum.StatusDisplayVisuals.Content:
        enum.StatusDisplayVisualLayers.Line1:
          Text: { visible: true }
          CurrentTime: { visible: true }
          EstimatedTimeOfArrival: { visible: true }
          AlertLevel: { visible: false }
        enum.StatusDisplayVisualLayers.Line2:
          Text: { visible: true }
          CurrentTime: { visible: true }
          EstimatedTimeOfArrival: { visible: true }
          AlertLevel: { visible: false }
        alert_status:
          Text: { visible: false }
          CurrentTime: { visible: false }
          EstimatedTimeOfArrival: { visible: false }
          AlertLevel: { visible: true }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: StatusDisplay
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: ShuttleTimer

- type: entity
  parent: StatusDisplay
  id: StatusDisplayShuttle
  name: arrivals status display
  description: Displays arrivals shuttle status.
  components:
  - type: DeviceNetwork
    deviceNetId: Private
    receiveFrequencyId: ArrivalsShuttleTimer
  - type: StatusDisplay
    content: EstimatedTimeOfArrival
