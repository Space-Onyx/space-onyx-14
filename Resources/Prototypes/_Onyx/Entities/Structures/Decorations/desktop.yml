- type: entity
  parent: BaseStructure
  id: Desktop
  name: desktop computer
  description: The screen says to hold for the OS to update. Though the progress bar never seems to move.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    sprite: _Onyx/Structures/Decoration/desktop.rsi
    state: desktop
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -6
    range: 3
    sound:
      path: /Audio/_Onyx/Machines/computerboot_pc.ogg
  - type: PointLight
    radius: 3
    energy: 2
    color: "#2789CD"
