- type: entity
  id: Garbage
  parent: BaseItem
  name: garbage
  description: It's crawling with maggots!
  components:
  - type: Sprite
    noRot: true
    sprite: _Onyx/Structures/Decoration/garbage.rsi
    state: garbage
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Damageable
    damageModifierSet: Wood
  - type: Pullable
  - type: AmbientSound
    volume: -2
    range: 2
    sound:
      path: /Audio/_Onyx/Ambience/flies_buzzing.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 35
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]