- type: entity
  parent: GlassBox
  id: GlassBoxLamarrFilled
  suffix: Lamarr, Filled
  components:
  - type: Sprite
    sprite: Structures/Storage/glassbox.rsi
    layers:
    - state: base
    - sprite: _Onyx/Mobs/Aliens/Xenomorphs/old_facehugger.rsi
      state: facehugger
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
    - state: locked
      shader: unshaded
      map: ["enum.LockVisualLayers.Lock"]
  - type: AccessReader
    access: [["ResearchDirector"]]
  - type: ItemSlots
    slots:
      ItemCabinet:
        startingItem: MobXenomorphFaceHuggerLamarr
        ejectOnInteract: true
        whitelist:
          components:
          - FaceHugger

- type: entity
  parent: GlassBox
  id: GlassBoxLawbringer
  suffix: Lawbringer
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/glassbox.rsi
    layers:
    - state: base
    - state: lawbringer
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
    - state: locked
      shader: unshaded
      map: ["enum.LockVisualLayers.Lock"]
  - type: AccessReader
    access: [["HeadOfSecurity"]]
  - type: Construction
    graph: GlassBox
    node: glassBox
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          tags:
          - WeaponEnergyGunLawbringer
        ejectSound: /Audio/Machines/machine_switch.ogg

- type: entity
  parent: GlassBoxLawbringer
  id: GlassBoxLawbringerFilled
  suffix: Lawbringer, Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - WeaponEnergyGunLawbringer
