- type: entity
  parent: [ CrateBaseSecure, CrateGenericSteel ]
  id: CrateBitrunSecure
  name: bitrunning crate
  components:
  - type: Icon
    sprite: _Onyx/Structures/Storage/Crates/bitrun_secure.rsi
  - type: Sprite
    sprite: _Onyx/Structures/Storage/Crates/bitrun_secure.rsi
  - type: AccessReader
    access: [["Salvage"], ["Bitrun"]]

- type: entity
  parent: CrateBitrunSecure
  id: CrateBitrunSecureReward
  categories: [ HideSpawnMenu ]
  name: decrypted cache
  components:
  - type: Lock
    locked: false
  - type: Construction
    deconstructionTarget: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: BitrunningRewardCache

- type: entity
  parent: CrateGenericSteel
  id: CrateGolden
  name: golden crate
  components:
  - type: Icon
    sprite: _Onyx/Structures/Storage/Crates/gold.rsi
  - type: Sprite
    sprite: _Onyx/Structures/Storage/Crates/gold.rsi
