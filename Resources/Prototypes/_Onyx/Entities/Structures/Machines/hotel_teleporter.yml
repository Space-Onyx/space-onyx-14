- type: entity
  parent: StationTeleporter
  id: StationTeleporterHotelEntrance
  name: hotel teleporter entrance
  description: A teleporter receiver tuned to the hotel network. It is pre-linked to its hotel exit.
  suffix: Hotel Entrance, Station Side
  components:
  - type: StationTeleporter
    autoLinkKey: Hotel
    autoLinkPair: 1
    autoLinkRole: Entrance
    portalColor: "#d4af37"
  - type: Label
    localizedLabel: teleporter-name-hotel-entrance

