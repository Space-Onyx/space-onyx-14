- type: entity
  id: ComputerScienceXenobiologyBounty
  parent: BaseComputerAiAccess
  name: xenobiology bounty console
  description: Exchanges xenobiology products for research points.
  components:
  - type: Sprite
    layers:
    - map: [ computerLayerBody ]
      state: computer
    - map: [ computerLayerKeyboard ]
      state: generic_keyboard
    - map: [ computerLayerScreen ]
      sprite: _Onyx/Xenobiology/Computers/xenobiology.rsi
      state: xenobiology
    - map: [ computerLayerKeys ]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ResearchClient
  - type: XenobiologyBountyConsole
  - type: ActivatableUI
    key: enum.CargoConsoleUiKey.Bounty
  - type: UserInterface
    interfaces:
      enum.CargoConsoleUiKey.Bounty:
        type: XenobiologyBountyConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: XenobiologyBountyComputerCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 1000
  - type: AccessReader
    access: [[ Research ]]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: GuideHelp
    guides: [ XenobiologyGuide ]
