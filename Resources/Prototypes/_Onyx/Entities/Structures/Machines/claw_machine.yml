- type: entity
  id: ClawMachine
  parent: BaseMachinePowered
  name: claw machine
  description: Sure we got our health insurance benefits cut, and yeah we don't get any overtime on holidays, but hey - free to play claw machines!
  components:
  - type: CollectiveMind
    defaultChannel: Binary
    channels:
    - Binary
  - type: StationAiWhitelist
  - type: Sprite
    sprite: _Onyx/Structures/Machines/SlotMachines/claw_machine.rsi
    layers:
    - state: clawmachine
      map: [ "clawmachine" ]
    - state: clawmachine_playing
      visible: false
      map: [ "clawmachine_playing" ]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    layoutId: SlotMachine
    boardName: "wires-board-name-slot-machine"
  - type: GenericVisualizer # I have NO idea how this works
    visuals:
      enum.ClawMachineVisuals.Spinning:
        clawmachine_playing:
          True: { visible: true }
          False: { visible: false }
      enum.ClawMachineVisuals.NormalSprite:
        clawmachine:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 2
    energy: 1.5
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Repairable
    doAfterDelay: 8
  - type: Anchorable
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Vending
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-mechanical
    weight: 0.125
  - type: StaticPrice
    price: 100
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Vocalizer
    minVocalizeInterval: 8m
    maxVocalizeInterval: 10m
    hideChat: true
  - type: VocalizerRequiresPower
  - type: DatasetVocalizer
    dataset: SlotMachineAds
  - type: LanguageSpeaker
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    understands:
    - TauCetiBasic
    - RobotTalk
  - type: ClawMachine # EVIL LOOT!!!
    rewards:
    - PlushieMoth
    - PlushieHuman
    - PlushiePenguin
    - PlushieAbductor
    - PlushieThrongler
    - FoamWonderprod
  - type: DoAfter