- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: TelecomTransmitter
  name: telecommunication transmitter
  description: When powered, it allows telecommunication servers to expand their signal.
  components:
  - type: Sprite
    sprite: _Onyx/Structures/Machines/telecomms.rsi
    snapCardinals: true
    layers:
    - state: relay_off
    - state: relay
      visible: false
      map: ["powered-state"]
    - state: relay_o_off
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    energy: 1.6
    color: "#39b8ee"
  - type: LitOnPowered
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        powered-state:
          True: { visible: true }
          False: { visible: false }
        enum.WiresVisualLayers.MaintenancePanel:
          True: { state: relay_o }
          False: { state: relay_o_off }
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Transform
    anchored: true
  - type: Pullable
  - type: TelecomTransmitter
    lossExponent: 2
    lossChanceMultiplier: 0.65
    congestionDropThreshold: 1
    congestionDropChanceMultiplier: 0.4
    maxCongestionDropChance: 0.75
  - type: TelecomWear
    wearPerHour: 2
    damageLossMultiplier: 0.12
  - type: TelecomNode
    bandwidth: 20
    basePacketCost: 1
    charactersPerCostUnit: 90
    loadRecoveryPerSecond: 20
    telemetryRecoveryPerSecond: 2
  - type: Machine
    board: TelecomTransmitterCircuitboard
