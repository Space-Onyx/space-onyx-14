- type: entity
  parent: VendingMachine
  id: VendingMachineMailDrobe
  name: MailDrobe
  description: Neither solar flares nor meteors nor plasma fire nor void of space stays these couriers from the swift completion of their appointed rounds.
  components:
  - type: VendingMachine
    pack: MailDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    priceMultiplier: 1
  - type: DatasetVocalizer
    dataset: MailDrobeAds
  - type: Sprite
    sprite: _Onyx/Structures/Machines/VendingMachines/maildrobe.rsi
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: off
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["Cargo"]]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#4b93ad"
