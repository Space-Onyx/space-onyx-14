- type: entity
  name: contraband detector
  description: Walk in with confidence, walk out with security chasing you.
  parent: BaseMachinePowered
  id: ContrabandDetector
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        density: 1500
        mask:
        - DoorPassable
        layer:
        - AirlockLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ContrabandDetectorVisuals.VisualState:
        scanner:
          Off: { state: empty }
          Powered: { state: passive }
          Alarm: { state: alarm }
          Scan: { state: scan }
  - type: Sprite
    noRot: true
    drawdepth: Overdoors
    sprite: _Onyx/Structures/Machines/contraband_detector.rsi
    layers:
    - state: frame
    - map: [ "scanner" ]
      shader: unshaded
      state: empty
    - state: wires
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: ContrabandDetector
    detect:
      path: /Audio/Effects/chime.ogg
  - type: AccessReader
    access: [ [ "Security" ] ]
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSource
    range: 1000
    ports:
    - SignalContrabandDetected
  - type: WiresPanel
  - type: WiresPanelSecurity
  - type: WiresVisuals
  - type: Wires
    layoutId: ContrabandDetector
    boardName: wires-board-name-contraband-detector
  - type: Electrified
    usesApcPower: true
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ContrabandDetector
  id: ContrabandDetectorSecure
  suffix: Secure
  components:
  - type: WiresPanelSecurity
    securityLevel: panelReinforced
    examine: wires-panel-component-on-examine-security-level2
    wiresAccessible: false

- type: entity
  parent: BaseFlatpack
  id: ContrabandDetectorFlatpack
  name: contraband detector flatpack
  description: A flatpack used for constructing a contraband detector.
  components:
  - type: Flatpack
    entity: ContrabandDetectorSecure
  - type: StaticPrice
    price: 500
