- type: entity
  id: VirologyServer
  parent: BaseMachinePowered
  name: virology server
  description: Stores the data of scanned diseases.
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    layers:
    - state: server
    - sprite: _Onyx/Structures/Machines/virology_server.rsi
      state: variant-biohazard
  - type: Construction
    graph: Machine
    node: machine
    containers: [ machine_board, machine_parts ]
  - type: Machine
    board: VirologyServerMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SingletonDeviceNetServer
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: VirologyServer
    receiveFrequencyId: VirologyServer
    autoConnect: false
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerVirology
  name: virology console
  description: Used to view information about analyzed diseases and to name them.
  components:
  - type: Sprite
    layers:
    - map: [ computerLayerBody ]
      state: computer
    - map: [ computerLayerKeyboard ]
      state: generic_keyboard
    - map: [ computerLayerScreen ]
      sprite: _Onyx/Structures/Machines/virology_computer.rsi
      state: viro
    - map: [ computerLayerKeys ]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#00BB00"
  - type: Computer
    board: VirologyComputerCircuitboard
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: VirologyServer
  - type: WirelessNetworkConnection
    range: 1200
