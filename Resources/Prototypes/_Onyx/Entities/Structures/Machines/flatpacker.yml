- type: entity
  id: MachineCivilianFlatpacker
  parent: MachineFlatpacker
  name: Flatpacker 467-C
  description: The civilian predecessor of the Flatpacker 1001, slower and less material-efficient.
  components:
  - type: FlatpackCreator
    packDuration: 12
    baseMachineCost:
      Steel: 1250
    baseComputerCost:
      Steel: 750
      Glass: 500
  - type: Machine
    board: CivilianFlatpackerMachineCircuitboard
  - type: Sprite
    sprite: Structures/Machines/flatpacker.rsi
    layers:
    - state: base
      sprite: _Onyx/Structures/Machines/flatpacker.rsi
    - state: screen
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: packing
      map: ["anim"]
      visible: false
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
      visible: false
