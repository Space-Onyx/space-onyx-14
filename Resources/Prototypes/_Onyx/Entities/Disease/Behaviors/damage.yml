- type: entity
  id: DiseaseBehaviorCancer
  parent: DiseaseBehaviorBase
  name: Cancer
  description: Deals genetic damage over time.
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Cellular: 0.2

- type: entity
  id: DiseaseBehaviorPoison
  parent: DiseaseBehaviorBase
  name: Poison
  description: Deals poison damage over time.
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Poison: 0.3

- type: entity
  id: DiseaseBehaviorBlunt
  parent: DiseaseBehaviorBase
  name: Tissue degradation
  description: Deals blunt damage over time.
  components:
  - type: DiseaseEffect
    complexity: 15
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Blunt: 0.3
