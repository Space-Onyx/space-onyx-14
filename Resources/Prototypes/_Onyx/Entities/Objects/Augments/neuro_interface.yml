- type: entity
  parent: BaseAugmentAction
  id: ActionOpenNeuroInterface
  name: open neural panel
  description: Project the neuro-interface control panel into your field of vision.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi
    layers:
    - state: apc
      map: [ "enum.ActionVisuals.Icon" ]

- type: entity
  parent: BaseAugment
  id: NeuroInterface
  name: NanoTrasen Neuro
  description: A compact neural bus implanted at the base of the neck. Its service lead can terminate beneath either ear.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi
    state: apc
  - type: Organ
    category: NeuroInterface
  - type: SurgeryTool
    customUses: [ surgery-tool-use-implant-neuro-interface ]
  - type: NeuroInterface
    updateInterval: 1
  - type: UserInterface
    interfaces:
      enum.NeuroInterfaceUiKey.Key:
        type: NeuroInterfaceBoundUserInterface
        interactionRange: 0
  - type: AugmentActivatableUI
    key: enum.NeuroInterfaceUiKey.Key
  - type: AugmentAction
    action: ActionOpenNeuroInterface

- type: entity
  parent: NeuroInterface
  id: NeuroInterfaceInterdyneFault
  name: Interdyne Fault
  description: A medical neural bus made by NanoTrasen competitor Interdyne Pharmaceuticals.

- type: entity
  parent: NeuroInterface
  id: NeuroInterfaceNanoTrasenEnforcer
  name: NanoTrasen Enforcer
  description: A restricted reinforced neural bus issued to NanoTrasen security and response forces.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseNeuroInterfacePart
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi

- type: entity
  parent: BaseNeuroInterfacePart
  id: NeuroInterfaceEmpShield
  name: ferrite EMP filter
  description: A layered ferrite filter that dampens electromagnetic interference before it reaches installed augment hardware.
  components:
  - type: Sprite
    state: apc
  - type: AugmentModuleEmpProtection
    strengthMultiplier: 0.75
    durationMultiplier: 0.75
  - type: AugmentModule

- type: entity
  parent: BaseNeuroInterfacePart
  id: NeuroInterfaceEmpShieldHardened
  name: isolated EMP filter
  description: A hardened optical isolator wrapped in a dense Faraday mesh. It strongly suppresses interference reaching installed augment hardware.
  components:
  - type: Sprite
    state: apc
  - type: AugmentModuleEmpProtection
    strengthMultiplier: 0.5
    durationMultiplier: 0.5
  - type: AugmentModule
