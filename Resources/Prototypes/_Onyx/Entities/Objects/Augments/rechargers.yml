- type: entity
  abstract: true
  parent: BaseAugment
  id: BaseAugmentRecharger
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi
    state: cell
  - type: Organ
    category: AugmentCharger
  - type: AugmentPowerSource

- type: entity
  parent: BaseItem
  id: AugmentRechargerCasing
  name: augment recharger casing
  description: An incomplete implant casing for an internal power-cell recharger.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi
    state: incomplete_charger
  - type: Construction
    graph: AugmentRecharger
    node: casing
    defaultTarget: apc
  - type: Tag
    tags: [ AugmentRechargerCasing ]

- type: entity
  parent: BaseItem
  id: AugmentRechargerCables
  name: wired augment recharger casing
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Augments/power.rsi
    state: incomplete_charger_cables
  - type: Construction
    graph: AugmentRecharger
    node: cables
    defaultTarget: apc

- type: entity
  parent: BaseAugmentRecharger
  id: AugmentRechargerAPC
  name: augment APC recharger
  description: Allows an internal augment battery to draw charge from compatible power sources.
  components:
  - type: Sprite
    state: apc
  - type: AugmentApcRecharger
  - type: Construction
    graph: AugmentRecharger
    node: apc

- type: entity
  parent: BaseAugmentRecharger
  id: AugmentRechargerStation
  name: augment station recharger
  description: Allows an internal augment battery to recharge inside cyborg charging stations.
  components:
  - type: Sprite
    state: station
  - type: AugmentStationRecharger
  - type: Construction
    graph: AugmentRecharger
    node: station
