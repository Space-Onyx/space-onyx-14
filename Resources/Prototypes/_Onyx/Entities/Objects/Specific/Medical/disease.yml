- type: entity
  parent: BaseItem
  id: LiveInjector
  name: live injector
  description: Injects people with a disease.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/live_injector.rsi
    layers:
    - state: livepen
      map: ["livepen"]
  - type: Appearance
  - type: DiseasePen
    vaccine: false
  - type: GenericVisualizer
    visuals:
      enum.DiseasePenVisuals.Used:
        livepen:
          True: { state: livepen_empty }
          False: { state: livepen }
