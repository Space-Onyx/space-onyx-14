- type: entity
  parent: Medkit
  id: MedkitBSO
  name: tactical medical kit
  description: Contains everything you need to get a person back up quickly.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    state: bsokit
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: bsokit
    size: Normal
  - type: Storage
    defaultStorageOrientation: Vertical

- type: entity
  parent: Medkit
  id: Surgerykit
  name: Surgery kit
  description: A compact kit stocked with the essential surgical instruments for a full operation.
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,2,3
    - 3,0,3,4
    - 0,4,1,4
    - 0,5,3,6
    whitelist:
      tags:
      - Bottle
      - CigPack
      - PillCanister
      - SurgeryTool
      - MedicalPatch
      - Mask
      - SurgerySterileMask
      components:
      - FingerprintMask
      - SurgeryTool
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    state: surgerykit
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: surgerykit
    shape:
    - 0,0,3,2

- type: entity
  parent: MedkitBSO
  id: MedkitBSOFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        - id: CartridgeBicaridine
        - id: CartridgeDermaline
        - id: CartridgeSaline
        - id: CartridgeEpinephrine

- type: entity
  parent: MedkitBSO
  id: MedkitBSOIPC
  name: tactical repairing kit
  description: Contains supplies for rapidly repairing a silicon.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    state: bsokit-ipc
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: bsokit-ipc

- type: entity
  parent: MedkitBSOIPC
  id: MedkitBSOIPCFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingEyesGlassesMeson
        - id: WelderIndustrial
        - id: CableApcStack
        - id: PowerCellHigh

- type: entity
  parent: Medkit
  id: MedkitCombatBlue
  name: combat medical kit
  description: Contains most medicines you need to recover from injuries and illnesses, all in a convenient pill form.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    state: blackbluekit
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: blackbluekit
    size: Normal

- type: entity
  parent: MedkitCombatBlue
  id: MedkitCombatBlueFilled
  suffix: Filled, Pills
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PillCanisterBicaridine
        - id: PillCanisterDermaline
        - id: PillCanisterTricordrazine
        - id: PillCanisterTramadol
        - id: PillCanisterIron
        - id: PillCanisterDexalin
        - id: PillCanisterDylovene
        - id: PillCanisterHyronalin

- type: entity
  parent: Medkit
  id: MedkitCombatPurple
  name: combat medical kit
  description: For the IPCs among us.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    state: blackpurplekit
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: blackpurplekit
    size: Normal
  - type: Storage
    defaultStorageOrientation: Vertical

- type: entity
  parent: MedkitCombatPurple
  id: MedkitCombatPurpleFilled
  suffix: Filled, IPC
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingEyesGlassesMeson
        - id: WelderIndustrial
        - id: CableApcStack
        - id: PowerCellHigh

- type: entity
  parent: MedkitCombat
  id: MedkitCombatStasiziumFilled
  name: futuristic medkit
  description: Medkit filled with medicines of the future.
  suffix: Stasizium
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: StasiziumAutoInjector
        amount: 8
  - type: Sprite
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    state: purplekit
