- type: entity
  parent: [ SolutionHyposprayTiny, BaseHypoInjector, BaseMedicalContraband ]
  id: ParamedHypo
  name: medical cartridge autoinjector
  description: Used for rapid administration of medicine. Uses cartridges printable at the medical techfab.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/autoinjector.rsi
    layers:
    - state: medical-base
    - state: cartridge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/autoinjector.rsi
  - type: ExaminableSolution
    solution: hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: cartridge
    solutionName: hypospray
  - type: Appearance
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 10
    activeModeProtoId: CartridgeAutoinjectorInjectMode
    allowedModes:
    - CartridgeAutoinjectorInjectMode
  - type: CartridgeAutoinjector
  - type: UseDelay
    delay: 30
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        whitelist:
          tags:
          - AutoinjectorCartridge

- type: entity
  parent: [ ParamedHypo, BaseSecurityContraband ]
  id: SecHypo
  name: security cartridge autoinjector
  description: Used for rapid administration of medicine. Uses cartridges printable at the security techfab.
  components:
  - type: Sprite
    layers:
    - state: security-base
    - state: cartridge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: UseDelay
    delay: 45
  - type: Tag
    tags:
    - SecBeltEquip

- type: entity
  parent: [ ParamedHypo, BaseCentcommContraband ]
  id: AmnestizineHypospray
  name: amnestic spray
  description: A specialized cartridge injector intended for Central Command personnel. Primarily used to inject amnestics.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    layers:
    - sprite: _Onyx/Objects/Specific/Medical/amnestic_hypo.rsi
      state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/amnestic_hypo.rsi
  - type: UseDelay
    delay: 3

- type: injectorMode
  parent: [ BaseJetInjectorMode, BaseInjectMode ]
  id: CartridgeAutoinjectorInjectMode
  mobTime: 0

- type: entity
  parent: BaseItem
  id: BaseAutoinjectorCartridge
  name: autoinjector cartridge
  description: Used in a cartridge autoinjector.
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/cartridge.rsi
    layers:
    - state: base
    - state: filling
      color: "#ffffff"
  - type: SolutionCartridge
    solution:
      maxVol: 10
  - type: Tag
    tags:
    - AutoinjectorCartridge
    - SecBeltEquip

- type: entity
  parent: [ BaseAutoinjectorCartridge, BaseSecurityMedicalContraband ]
  id: CartridgeEpinephrine
  name: adrenaline autoinjector cartridge
  description: Contains 7u of epinephrine and 3u of tranexamic acid, used in a cartridge autoinjector.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#cad8d4"
  - type: SolutionCartridge
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Epinephrine
        Quantity: 7
      - ReagentId: TranexamicAcid
        Quantity: 3

- type: entity
  parent: [ BaseAutoinjectorCartridge, BaseSecurityMedicalContraband ]
  id: CartridgeSaline
  name: airloss autoinjector cartridge
  description: Contains 7u of saline and 3u of dexalin plus, used in a cartridge autoinjector.
  components:
  - type: Sprite
