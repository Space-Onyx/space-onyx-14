- type: entity
  parent: [ BaseAutoinjectorCartridge, BaseCentcommContraband ]
  id: CartridgeAmnestic
  name: amnestic autoinjector cartridge
  description: Contains 10u of dimtrimethic-neuramincyl acid, used in a cartridge autoinjector.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#FAF9F6"
  - type: SolutionCartridge
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Amnestizine
        Quantity: 10
  - type: Solution
    id: food
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Amnestizine
        Quantity: 10
  - type: Edible
    delay: 0.2
    forceFeedDelay: 1.5
    transferAmount: null
    edible: Pill
  - type: BadFood
  - type: FlavorProfile
    ignoreReagents: []

- type: entity
  parent: ChemicalMedipen
  id: StasiziumAutoInjector
  name: futuristic medipen
  description: A dose of medicinal substances from the future that can raise even the dead to their feet.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/stasipen.rsi
    layers:
    - state: stasipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: stasipen_empty
    solutionName: hypospray
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 10
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Solution
    id: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Stasizium
        Quantity: 10
