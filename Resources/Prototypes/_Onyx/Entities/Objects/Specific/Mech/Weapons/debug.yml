- type: entity
  id: WeaponMechDebugBallistic
  parent: [ BaseMechWeaponRange, DebugMechEquipment ]
  name: debug bang
  suffix: Mech Weapon, DEBUG, Ballistic
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
    state: base
  - type: Gun
    minAngle: 24
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 16
    fireRate: 5
    selectedMode: FullAuto
    availableModes: [ FullAuto ]
    soundGunshot: { path: /Audio/Weapons/Guns/Gunshots/lmg.ogg }
    soundEmpty: { path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg }
  - type: BatteryAmmoProvider
    proto: CartridgeLightRifle
    fireCost: 9
  - type: AmmoCounter

