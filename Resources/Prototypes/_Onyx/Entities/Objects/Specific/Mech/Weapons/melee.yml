- type: entity
  id: WeaponMechMeleeDrill
  parent: BaseMechWeaponMelee
  name: exosuit drill
  description: Equipment for mining exosuits. This is the drill that'll pierce the rocks!
  components:
  - type: Sprite
    state: mecha_drill
  - type: Tag
    tags: [ Pickaxe, IndustrialMech ]
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -90
    attackRate: 3.5
    soundHit:
      path: /Audio/_Onyx/Weapons/chainsaw.ogg
    damage:
      groups:
        Brute: 9
      types:
        Structural: 40

- type: entity
