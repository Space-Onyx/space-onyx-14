  components:
  - type: Sprite
    state: mecha_diamond_drill
  - type: Tag
    tags: [ Pickaxe, IndustrialMech ]
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -90
    attackRate: 4
    soundHit:
      path: /Audio/Items/drill_hit.ogg
    damage:
      groups:
        Brute: 18
      types:
        Structural: 60

- type: entity
  id: WeaponMechChainSword
  parent: [ BaseMechWeaponMelee, CombatMechEquipment ]
  name: exosuit chainsword
  description: Equipment for combat exosuits. A mechanical chainsword built to tear through armor.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Mech/chainsword.rsi
