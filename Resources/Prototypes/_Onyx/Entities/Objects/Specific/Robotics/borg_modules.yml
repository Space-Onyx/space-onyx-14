# Content taken from Wega (https://github.com/wega-team/ss14-wega), licensed under GNU GPL v3.
- type: entity
  id: BorgModuleDNA
  parent: [ BaseBorgModuleScience, BaseProviderBorgModule ]
  name: DNA cyborg module
  description: Pee wee has never been so much fun!
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: science
    - state: icon-dna
  - type: ItemBorgModule
    hands:
    - hand:
        emptyRepresentative: DnaModifierInjector
        emptyLabel: borg-slot-dnainjector-empty
        whitelist:
          components:
          - DnaModifierInjector
          - DnaModifierDisk
    - item: BoxDnaFisk
    - item: Pen
    - hand:
        emptyLabel: borg-slot-documents-empty
        emptyRepresentative: Paper
        whitelist:
          tags:
          - Book
          - Dice
          - Document
          - Figurine
          - TabletopBoard
          - Write
    - item: BorgGeneratorCleanSe
  - type: BorgModuleIcon
    icon: { sprite: _Onyx/Objects/Specific/Robotics/borgmodule.rsi, state: icon-dna }

