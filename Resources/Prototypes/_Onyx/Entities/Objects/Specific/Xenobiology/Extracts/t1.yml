- type: entity
  id: OrangeSlimeExtract
  parent: BaseSlimeExtract
  name: orange slime extract
  components:
  - type: Tag
    tags: [ XenobiologyOrangeExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#ff9f1a"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound:
            path: /Audio/Effects/Chemistry/bubbles.ogg
        - !type:AdjustExtractReagent
          reagent: TearGas
          amount: 20
        - !type:AreaReactionEffect
          duration: 10
          overflowThreshold: 0.013334
          prototypeId: Smoke
          sound:
            path: /Audio/Effects/smoke.ogg
        - !type:AdjustExtractReagent
          reagent: TearGas
          amount: -20
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction-evil" ]
        - !type:PlaySound
          sound:
            path: /Audio/Effects/Chemistry/bubbles.ogg
        - !type:ApplyEffectsNearby
          range: 3
          effects:
          - !type:AdjustFireStacks
            amount: 5
            ignite: true
        - !type:Flash
          maxRange: 7
          rangePerUnit: 7
          sound:
            path: /Audio/_Onyx/Xenobiology/zapbang.ogg
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction-reagent" ]
        - !type:PlaySound
          sound:
            path: /Audio/Effects/Chemistry/bubbles.ogg
        - !type:AdjustExtractReagent
          reagent: CapsaicinOil
          amount: 30

