- type: entity
  id: YellowSlimeExtract
  parent: BaseSlimeExtract
  name: yellow slime extract
  components:
  - type: Tag
    tags: [ XenobiologyYellowExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#ffff1a"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction-fail" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:SpawnEntity
          entity: XenobioVolatileOrgan
          predicted: false
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:Emp

