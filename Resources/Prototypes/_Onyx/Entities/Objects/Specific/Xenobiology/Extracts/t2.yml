- type: entity
  id: SilverSlimeExtract
  parent: BaseSlimeExtract
  name: silver slime extract
  components:
  - type: Tag
    tags: [ XenobiologySilverExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#c4c4c4"
      shader: XenoMetallic
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction-evil" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:Jitter
          time: 5
          frequency: 20
        - !type:DelayedExtractAreaReaction
          delay: 5
          duration: 10
          prototypeId: AluminiumMetalFoam
          sound: { path: /Audio/Effects/extinguish.ogg }
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:SpawnEntity
          entity: IngotSilver1
          number: 2
          predicted: false
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:SpawnEntity
          entity: XenobioGoopBall
          number: 3
          predicted: false

- type: entity
  id: CeruleanSlimeExtract
  parent: BaseSlimeExtract
  name: cerulean slime extract
  components:
  - type: Tag
    tags: [ XenobiologyCeruleanExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#2A52BE"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:CreateGas
          gas: Pluoxium
          moles: 55
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:ApplyEffectsNearby
          range: 5
          effects:
          - !type:Extinguish
            fireStacksAdjustment: -10
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage
          type: Pvs
          messages: [ "xeno-extract-reaction-reagent" ]
        - !type:PlaySound
          sound: { path: /Audio/Effects/Chemistry/bubbles.ogg }
        - !type:AdjustExtractReagent
          reagent: XenobioJellyCerulean
          amount: 1
