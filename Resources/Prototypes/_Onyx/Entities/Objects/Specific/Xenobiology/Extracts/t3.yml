- type: entity
  id: PyriteSlimeExtract
  parent: BaseSlimeExtract
  name: pyrite slime extract
  components:
  - type: Tag
    tags: [ XenobiologyPyriteExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#dcaa4f"
      shader: XenoMetallic
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        - !type:ApplyEffectsNearby
          range: 12
          effects:
          - !type:ModifyStatusEffect
            effectProto: StatusEffectOnyxForcedStealth
            time: 60
            type: Add
            probability: 0.5
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        # A cleared extract solution intentionally creates source-equivalent blank smoke.
        - !type:AreaReactionEffect
          prototypeId: Smoke
          duration: 5
          overflowThreshold: 0.013333334
          sound: { path: /Audio/Effects/extinguish.ogg }
        - !type:ApplyEffectsNearby
          range: 7
          effects:
          - !type:ModifyStatusEffect
            effectProto: StatusEffectOnyxForcedStealth
            time: 30
            type: Add
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        - !type:ApplyEffectsNearby
          range: 1.5
          effects:
          - !type:ModifyStatusEffect
            effectProto: StatusEffectOnyxForcedStealth
            time: 120
            type: Add

