- type: entity
  id: BluespaceSlimeExtract
  parent: BaseSlimeExtract
  name: bluespace slime extract
  components:
  - type: Tag
    tags: [ XenobiologyBluespaceExtract ]
  - type: Sprite
    layers:
    - state: core
      color: "#f0f8ff"
      shader: XenoBluespace
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        - !type:SpawnEntity { entity: FloorTileItemBluespace, number: 30, predicted: false }
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        - !type:SpawnEntity { entity: MaterialBSCrystal1, number: 5, predicted: false }
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:UseSlimeExtract
        effects:
        - !type:PopupMessage { type: Pvs, messages: [ xeno-extract-reaction ] }
        - !type:PlaySound { sound: { path: /Audio/Effects/Chemistry/bubbles.ogg } }
        - !type:TeleportNearby

