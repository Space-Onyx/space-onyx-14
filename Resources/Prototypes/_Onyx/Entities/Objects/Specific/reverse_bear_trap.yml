- type: entity
  parent: [ ClothingHeadBase, BaseMajorContraband ]
  id: ReverseBearTrap
  name: reverse bear trap
  description: A horrifying set of shut metal jaws, rigged to a kitchen timer and secured by padlock to a head-mounted clamp. To apply, hit someone with it
  components:
  - type: ReverseBearTrap
    countdownDuration: 60
    baseEscapeChance: 0
    delayOptions: # escape odds for each duration.
      - 30 # 2.48%
      - 60 # 10.76%
      - 90 # 23.57%
      - 120 # 38.88%
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Helmets/reverse_bear_trap.rsi
  - type: Clothing
    sprite: _Onyx/Clothing/Head/Helmets/reverse_bear_trap.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5

- type: entity
  parent: BaseItem
  id: ReverseBearTrapKey
  name: reverse bear trap key
  description: The keys to unlock the reverse bear trap.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Onyx/Clothing/Head/Helmets/reverse_bear_trap.rsi
    state: key
  - type: Tag
    tags:
    - ReverseBearTrapKey

- type: entity
  name: reverse bear trap pack
  parent: BoxCardboard
  id: BoxReverseBearTrap
  description: A box full of completely legal stuff.
  components:
  - type: StorageFill
    contents:
    - id: ReverseBearTrap
      amount: 1
    - id: ReverseBearTrapKey
      amount: 1
