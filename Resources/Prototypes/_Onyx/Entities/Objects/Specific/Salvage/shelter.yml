- type: entity
  abstract: true
  parent: BaseItem
  id: BaseShelterCapsule
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Salvage/capsule.rsi
    state: capsule
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 5

- type: entity
  parent: BaseShelterCapsule
  id: ShelterCapsule
  name: bluespace shelter capsule
  description: An emergency shelter stored within a pocket of bluespace.
  components:
  - type: DeployableGrid
    deployTime: 5
    preloadedGrid: ShelterCapsule5x5
    boxSize: 5,5
    offset: -2.5,-2.5

- type: entity
  parent: BaseShelterCapsule
  id: ShelterCapsuleLuxury
  name: luxury bluespace shelter capsule
  description: An exorbitantly expensive luxury suite stored within a pocket of bluespace.
  components:
  - type: DeployableGrid
    deployTime: 8
    preloadedGrid: ShelterCapsule7x7
    boxSize: 7,7
    offset: -3.5,-3.5

- type: preloadedGrid
  id: ShelterCapsule5x5
  path: /Maps/_Onyx/Shelters/shelter_5x5.yml
  copies: 0

- type: preloadedGrid
  id: ShelterCapsule7x7
  path: /Maps/_Onyx/Shelters/shelter_7x7.yml
  copies: 0
