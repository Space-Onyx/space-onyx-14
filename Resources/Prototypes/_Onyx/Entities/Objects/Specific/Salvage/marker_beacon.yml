- type: entity
  id: MarkerBeacon
  parent: BaseItem
  name: marker beacon
  description: Shines you the way through the darkness. Useful to not get lost on vast landscapes.
  suffix: Unanchored
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Salvage/marker_beacon.rsi
    noRot: true
    layers:
    - state: base
    - state: unshaded
      color: "#FFFFFF"
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Anchorable
    delay: 0.2
  - type: MarkerBeaconColorPicker
  - type: ItemToggle
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: Item
    size: Tiny
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: white
    netsync: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: light
  - type: Tag
    tags: [ MarkerBeacon ]
  - type: UserInterface
    interfaces:
      enum.MarkerBeaconColorPickerUiKey.Key:
        type: MarkerBeaconColorPickerBui

- type: entity
  id: MarkerBeaconActive
  parent: MarkerBeacon
  suffix: Unanchored, Active
  components:
  - type: ItemToggle
    activated: true

- type: entity
  id: MarkerBeaconAnchored
  parent: MarkerBeacon
  suffix: Anchored
  components:
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static

- type: entity
  id: MarkerBeaconActiveAnchored
  parent: MarkerBeaconActive
  suffix: Anchored, Active
  components:
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static

- type: entity
  parent: BaseAmmoProvider
  id: BoxMarkerBeacons
  name: marker beacon dispenser
  description: Dispenses 30 marker beacons, extremely useful for space and planet exploration.
  components:
  - type: Sprite
    layers:
    - state: boxwide
  - type: BallisticAmmoProvider
    whitelist:
      tags: [ MarkerBeacon ]
    proto: MarkerBeaconActive
    capacity: 30
  - type: UseDelay
    delay: 1
