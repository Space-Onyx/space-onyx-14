- type: entity
  id: WelderRepairModes
  abstract: true
  components:
  - type: Welder
  - type: WelderRepairModes
    repairMode: mechanical
    repairModes:
       mechanical:
         name: repair-mode-mechanical
         damage:
           types:
             Blunt: -6
             Slash: -5
             Piercing: -4
         doAfterDelay: 3
         fuelMultiplier: 1.2
       physical:
         name: repair-mode-physical
         damage:
           types:
             Heat: -4
             Cold: -3.6
             Caustic: -2.8
         doAfterDelay: 3
         fuelMultiplier: 1.35

- type: entity
  id: SyntheticRepairTool
  parent: [SolutionToolWelder, BaseItem]
  name: synthetic repair tool
  description: A fuel-powered precision tool for repairing positronic chassis and cybernetic parts.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Medical/Surgery/e-cautery.rsi
    state: e-cautery
    layers:
    - state: e-cautery
  - type: Item
    sprite: _Onyx/Objects/Specific/Medical/Surgery/e-cautery.rsi
    heldPrefix: cautery
    size: Small
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
    soundDeactivate:
      collection: WelderOff
  - type: RefillableSolution
    solution: welder
  - type: Welder
  - type: WelderRepairModes
    repairMode: mechanical
    repairModes:
       mechanical:
         name: repair-mode-mechanical
         damage:
           types:
             Blunt: -9
             Slash: -7.5
             Piercing: -6
         doAfterDelay: 1
         fuelMultiplier: 1.05
       physical:
         name: repair-mode-physical
         damage:
           types:
             Heat: -6
             Cold: -5.4
             Caustic: -4.2
         doAfterDelay: 1
         fuelMultiplier: 1.3
  - type: Tool
    useSound:
      collection: Welder
    qualities: [ Welding ]
  - type: PointLight
    enabled: false
    radius: 1.2
    color: lightblue
    netsync: false
  - type: ItemTogglePointLight
  - type: Appearance
