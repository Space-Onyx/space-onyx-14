- type: entity
  id: FishingRod
  parent: BaseItem
  name: fishing rod
  description: It's time to go fishing!
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/fishing_rod.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/fishing_rod.rsi
    size: Normal
  - type: UseDelay
    delay: 0.08
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Piercing: 4
  - type: FishingRod

- type: entity
  id: FishingRodGoon
  suffix: Goon
  parent: FishingRod
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/goon_rod.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/goon_rod.rsi

- type: entity
  id: FishingRodMakeshift
  parent: FishingRod
  name: makeshift fishing rod
  description: Probably would be hard to catch a fish using that.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/makeshift_rod.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/makeshift_rod.rsi
  - type: FishingRod
    floatPrototype: FishingLureMakeshift
    efficiency: 0.8
  - type: Construction
    graph: FishingRodMakeshift
    node: makeshiftRod

- type: entity
  id: FishingRodGolden
  parent: FishingRod
  name: golden fishing rod
  description: Finally, you caught 250 fishes. Here's your trophy.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Specific/Fishing/golden_rod.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/golden_rod.rsi
  - type: FishingRod
    efficiency: 1.3
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Piercing: 10

- type: entity
  id: FishingLure
  parent: BaseItem
  name: fishing lure
  description: Fish, come here.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: _Onyx/Objects/Specific/Fishing/fishing_lure.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/fishing_lure.rsi
  - type: FishingLure

- type: entity
  id: FishingLureMakeshift
  parent: FishingLure
  components:
  - type: Sprite
    noRot: true
    sprite: _Onyx/Objects/Specific/Fishing/makeshift_lure.rsi
    state: icon
  - type: Item
    sprite: _Onyx/Objects/Specific/Fishing/makeshift_lure.rsi
