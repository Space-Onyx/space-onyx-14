- type: entity
  parent: [ BaseItem, BaseGunWieldable, BaseSecurityContraband ]
  id: WeaponSniperUncleStyopa
  name: Uncle Styopa
  description: A deadly large-caliber sniper rifle. Clearly not designed to disperse peaceful demonstrations... Although, who's going to argue with you? Uses .55 large-caliber ammo.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/uncle_styopa.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/uncle_styopa.rsi
    size: Huge
    shape:
    - 0,0,6,1
    storedRotation: 45
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/uncle_styopa.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
      params:
        pitch: 1.5
    resetOnHandSelected: false
  - type: AmmoCounter
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 10
    pvsIncrease: 1
  - type: StaticPrice
    price: 3500
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazineLargeCaliber
        insertSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLargeCaliber
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        startingItem: CartridgeLargeCaliber
        priority: 1
        whitelist:
          tags:
          - CartridgeLargeCaliber
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg

- type: entity
  parent: [BaseWeaponSniper, BaseSecurityContraband]
  id: WeaponSniperRemington700
  name: Remington 700
  description: A .308 Winchester hunting rifle, produced by third parties from Earth Armories replicas. Features a polymer frame.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/remington700/big.rsi
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/remington700/tiny.rsi
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Snipers/remington700/tiny.rsi
  - type: Gun
    fireRate: 1.1
    soundGunshot:
      path: /Audio/_Onyx/Weapons/Guns/Snipers/tl127.ogg
    soundEmpty:
      path: /Audio/_Onyx/Weapons/Guns/Snipers/sniper_empty.ogg
  - type: BallisticAmmoProvider
    autoCycle: false
    capacity: 4
    soundRack:
      path: /Audio/_Onyx/Weapons/Guns/Snipers/tl-127_bolt.ogg
    proto: Cartridge308win
    whitelist:
      tags:
      - Cartridge308win
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 0.7
  - type: UseDelayOnShoot
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    sprintModifier: 0.9
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 6
    pvsIncrease: 0.6
