- type: entity
  id: WeaponEnergyIonRifle
  name: ion rifle
  description: A rifle that fires ion bolts designed to damage mechanical targets.
  parent: [ BaseWeaponBattery, BaseSecurityContraband ]
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Battery/ion_rifle.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-unshaded-4
      map: [ "enum.GunVisualLayers.MagUnshaded" ]
      shader: unshaded
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Battery/ion_rifle.rsi
    size: Large
  - type: Appearance
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Battery/ion_rifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: RifleBulletEnergyGunIon
    fireCost: 40
  - type: Battery
    maxCharge: 800
    startingCharge: 800
