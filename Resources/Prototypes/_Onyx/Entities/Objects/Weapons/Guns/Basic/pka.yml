- type: entity
  id: WeaponProtoKineticShotgun
  parent: [ WeaponProtoKineticAcceleratorBase, BaseCargoContraband ]
  name: proto-kinetic shotgun
  description: Fires a spread of low-damage kinetic bolts that are half as effective for mining.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
    - state: bayonet
      visible: false
      map: [ "bayonet" ]
    - state: flight
      visible: false
      map: [ "flight" ]
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
  - type: BasicEntityAmmoProvider
    proto: PelletKineticSpread
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: GunRequiresWield
  - type: Gun
    minAngle: 21
    maxAngle: 32
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
    shape:
    - 0,0,4,0
  - type: UpgradeableGun
    maxUpgradeCount: 2

- type: entity
  id: WeaponProtoKineticRepeater
  parent: [ WeaponProtoKineticAcceleratorBase, BaseCargoContraband ]
  name: proto-kinetic repeater
  description: Fires a barrage of medium-damage kinetic bolts at a short range.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
    layers:
    - state: icon
    - state: bayonet
      visible: false
      map: [ "bayonet" ]
    - state: flight
      visible: false
      map: [ "flight" ]
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
  - type: Gun
    selectedMode: Burst
    shotsPerBurst: 3
    burstFireRate: 5
    burstCooldown: 1.5
    availableModes: [ Burst ]
  - type: BasicEntityAmmoProvider
    proto: RapidBulletKinetic
    capacity: 3
    count: 3
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
    shape:
    - 0,0,2,1

- type: entity
  id: WeaponProtoKineticPistol
  parent: [ WeaponProtoKineticAcceleratorBase, BaseCargoContraband ]
  name: proto-kinetic pistol
  description: Fires low-damage kinetic bolts, has a higher mod capacity.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
    layers:
    - state: icon
    - state: bayonet
      visible: false
      map: [ "bayonet" ]
    - state: flight
      visible: false
      map: [ "flight" ]
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
  - type: BasicEntityAmmoProvider
    proto: RapidBulletKinetic
  - type: Gun
    availableModes: [ FullAuto, SemiAuto ]
  - type: Multishot
    missChance: 0
    spreadAddition: 5
  - type: Item
    sprite: _Onyx/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1

- type: entity
  id: WeaponProtoKineticAcceleratorSpace
  parent: WeaponProtoKineticAccelerator
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticShotgunSpace
  parent: WeaponProtoKineticShotgun
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticRepeaterSpace
  parent: WeaponProtoKineticRepeater
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticPistolSpace
  parent: WeaponProtoKineticPistol
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entityTable
  id: ProtoKineticWeapons
  table: !type:GroupSelector
    children:
    - id: WeaponProtoKineticAccelerator
    - id: WeaponProtoKineticShotgun
    - id: WeaponProtoKineticRepeater
    - id: WeaponProtoKineticPistol

- type: entityTable
  id: ProtoKineticWeaponsSpace
  table: !type:GroupSelector
    children:
    - id: WeaponProtoKineticAcceleratorSpace
    - id: WeaponProtoKineticShotgunSpace
    - id: WeaponProtoKineticRepeaterSpace
    - id: WeaponProtoKineticPistolSpace
