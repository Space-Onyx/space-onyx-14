- type: entity
  id: HighCaliberPelletShotgun
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot
  - type: Projectile
    damage:
      types:
        Piercing: 15
        Structural: 20

- type: entity
  id: HighCaliberPelletShotgunSpread
  categories: [ HideSpawnMenu ]
  parent: HighCaliberPelletShotgun
  components:
  - type: ProjectileSpread
    proto: HighCaliberPelletShotgun
    count: 6
    spread: 15

- type: entity
  id: PelletShotgunSlugHighCaliber
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: slug
  - type: Projectile
    damage:
      types:
        Piercing: 65

- type: entity
  id: BulletSlugEnsnaring
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: rubber
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Piercing: 16
  - type: Ensnaring
    canThrowTrigger: true
    breakoutTime: 3
    freeTime: 3
    sprintSpeed: 0.6
    walkSpeed: 0.6
    staminaDamage: 10

- type: entity
  id: BulletSlugEMP
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: rubber
    color: "#009eff"
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 1
  - type: EmpOnTrigger
    range: 0.2
    energyConsumption: 80
    disableDuration: 1
  - type: Projectile
    damage:
      types:
        Piercing: 12
        Ion: 20
