- type: entity
  parent: BaseItem
  id: BaseMagazineHeavyRifle762
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: BallisticAmmoProvider
    mayTransfer: true
    capacity: 100
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
