- type: entity
  id: BaseMagazineShotgunLeverRifle
  name: magazine (8 gauge)
  parent: [ BaseItem, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineShotgunLeverRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ShellShotgunHeavy
    proto: ShellShotgunHighCaliber
    capacity: 8
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Ammunition/Magazine/lever_rifle_mags.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: mag
    steps: 9
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineShotgunLeverRifle
  parent: BaseMagazineShotgunLeverRifle

- type: entity
  id: MagazineShotgunLeverRifleEmpty
  parent: MagazineShotgunLeverRifle
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
