    sprite: _Onyx/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_lmg.rsi
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: icon
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o4
      shader: unshaded
