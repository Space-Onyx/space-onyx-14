  - type: Tag
    tags: [MilitaryPowerCellLMG, MilitaryPowerCell, PowerCell]
  - type: Clothing
    slots: BELT
  - type: PhysicalComposition
    materialComposition: { Steel: 300, Gold: 40, Glass: 160, Plasma: 200 }
    chemicalComposition: { Zinc: 20 }

