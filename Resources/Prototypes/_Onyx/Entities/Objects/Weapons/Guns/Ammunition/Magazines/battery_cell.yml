- type: entity
  id: BaseMilitaryPowerCell
  abstract: true
  parent: BasePowerCell
  components:
  - type: Battery
    pricePerJoule: 0.15
  - type: BatteryDrinkerSource
  - type: PhysicalComposition
    materialComposition: { Steel: 80, Gold: 40, Glass: 40, Plasma: 40 }
    chemicalComposition: { Zinc: 7.5 }
  - type: Tag
    tags: [MilitaryPowerCell, PowerCell]

- type: entity
  id: BaseMilitaryPowerCellSMG
  abstract: true
  parent: BaseMilitaryPowerCell
  components:
  - type: Sprite
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: icon
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o4
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryDrinkerSource
    maxAmount: 200
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o4}
          Neither: {visible: true, state: o2}
          Empty: {visible: false}
  - type: Tag
    tags: [MilitaryPowerCellSMG, MilitaryPowerCell, PowerCell]

- type: entity
  id: PowerCellIRSMG
  parent: BaseMilitaryPowerCellSMG
  name: SMG power cell
  description: A militarized power cell compatible with SMG scale lasers.
  suffix: Full
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_pistol_lethal.rsi
  - type: BatteryAmmoProvider
    proto: SMGLaser
    fireCost: 50

