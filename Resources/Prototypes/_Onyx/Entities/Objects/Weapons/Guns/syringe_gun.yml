- type: entity
  parent: BaseStorageItem
  id: BaseSyringeGun
  abstract: true
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    state: icon
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,0,0
    whitelist:
      tags:
      - SyringeGunAmmo
  - type: Gun
    fireRate: 1
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: ContainerAmmoProvider
    container: storagebase
  - type: Item
    size: Normal
    shape:
    - 0,0,3,0
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: SyringeGun
  - type: PacifismAllowedGun

- type: entity
  name: syringe gun
  parent: [ BaseSyringeGun, BaseMedicalContraband ]
  id: SyringeGun
  description: A gun that fires mini syringes to inject their contents over time.
  components:
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    slots:
    - back
    - suitStorage
    quickEquip: false

- type: entity
  name: rapid syringe gun
  parent: [ BaseSyringeGun, BaseGrandTheftContraband ]
  id: RapidSyringeGun
  description: A finely tuned syringe gun with faster injections and more room for ammunition.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Guns/Cannons/rapid_syringe_gun.rsi
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Guns/Cannons/rapid_syringe_gun.rsi
    slots:
    - back
    - suitStorage
    quickEquip: false
  - type: Storage
    grid:
    - 0,0,2,1
  - type: Gun
    fireRate: 2
  - type: SyringeGun
    injectionSpeedMultiplier: 1.5
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: StealTarget
    stealGroup: RapidSyringeGun
  - type: Tag
    tags:
    - HighRiskItem
