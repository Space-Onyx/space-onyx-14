- type: entity
  id: BaseCrusherUpgradeMain
  parent: [ BaseItem, BaseSecurityCargoContraband ]
  name: crusher upgrade capsule
  description: A modkit for crusher weapons.
  abstract: true
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
    name: crusher-upgrade-main
    uniqueGroup: main
  - type: StaticPrice
    price: 750
  - type: Tag
    tags: [ CrusherUpgradeMain ]

- type: entity
  id: CrusherUpgradeMainMarker
  parent: BaseCrusherUpgradeMain
  name: crusher upgrade capsule (kinetic marker)
  description: Compact generator of a bluespace field that can be shot on a living target to make it more vulnerable to crusher attacks. Its projectile also can destroy some types of rocks.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: kinetic-marker
  - type: ItemUpgrade
    name: crusher-upgrade-main-marker
    uniqueGroup: main
  - type: CrusherUpgradeComponents
    components:
    - type: AmmoCounter
    - type: UseDelayOnShoot
    - type: GunRequiresWield
    - type: Gun
      soundGunshot: /Audio/Weapons/plasma_cutter.ogg
      fireRate: 1
      useKey: false
    - type: MapRestricted
    - type: MapRestrictedGun
      popupOnBlock: crusher-gun-restricted
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 1
      rechargeSound: { path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg }
    - type: BasicEntityAmmoProvider
      proto: BulletCharge
      capacity: 1
      count: 1
  - type: Tag
    tags: [ CrusherUpgradeMain, CrusherUpgradeMainMarker ]

- type: entity
  id: CrusherUpgradeMainRudeBuster
  parent: BaseCrusherUpgradeMain
  name: crusher upgrade capsule (rude buster)
  description: Focuses determination of the user in itself and emits it as a half-magical projectile. You can see something constantly bouncing off inside it.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: rude-buster
  - type: ItemUpgrade
    name: crusher-upgrade-main-rude-buster
    uniqueGroup: main
  - type: CrusherUpgradeComponents
    components:
    - type: AmmoCounter
    - type: UseDelayOnShoot
    - type: GunRequiresWield
    - type: Gun
      projectileSpeed: 12
      soundGunshot: /Audio/Weapons/plasma_cutter.ogg
      fireRate: 10
      useKey: false
    - type: MapRestricted
    - type: MapRestrictedGun
      popupOnBlock: crusher-gun-restricted
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 8
      rechargeSound: { path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg }
    - type: BasicEntityAmmoProvider
      proto: ProjectileRudeBuster
      capacity: 1
      count: 1
  - type: Tag
    tags: [ CrusherUpgradeMain, CrusherUpgradeMainRudeBuster ]

- type: entity
  id: BaseCrusherUpgradeBlade
  parent: [ BaseItem, BaseSecurityCargoContraband ]
  name: crusher blade upgrade
  description: A modkit for crusher weapons.
  abstract: true
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
    name: crusher-upgrade-blade
    uniqueGroup: blade
  - type: StaticPrice
    price: 500
  - type: Tag
    tags: [ CrusherUpgradeBlade ]

- type: entity
  id: CrusherUpgradeBladeLavaAspect
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (lava aspect)
  description: A crystal made out of uncooling lava, making it constantly hot and highly flammable.
  components:
  - type: Sprite
    state: lava-shard
  - type: ItemUpgrade
    name: crusher-upgrade-blade-lava
    uniqueGroup: blade
  - type: WeaponUpgradeDamage
    bonusDamage: { types: { Heat: 5 } }
  - type: WeaponUpgradeEffects
    effects:
    - !type:Flammable
      multiplier: 2
      multiplierOnExisting: 0.5
    - !type:Ignite
    - !type:AdjustTemperature
      amount: 7500
  - type: Tag
    tags: [ CrusherUpgradeBlade, CrusherUpgradeBladeLavaAspect ]

- type: entity
  id: CrusherUpgradeBladeIceFrost
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (ice frost)
  description: A crystal that emits coldness, probably by violating laws of thermodynamics.
  components:
  - type: Sprite
    state: ice-shard
  - type: ItemUpgrade
    name: crusher-upgrade-blade-ice
    uniqueGroup: blade
  - type: WeaponUpgradeDamage
    bonusDamage: { types: { Cold: 4 } }
  - type: WeaponUpgradeEffects
    effects:
    - !type:AdjustTemperature
      amount: -7500
  - type: Tag
    tags: [ CrusherUpgradeBlade, CrusherUpgradeBladeIceFrost ]

- type: entity
  id: CrusherUpgradeBladeSharpness
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (sharpness)
  description: A simple grindstone that improves the damage of a crusher.
  components:
  - type: Sprite
    state: black-shard
  - type: ItemUpgrade
    name: crusher-upgrade-blade-sharpness
    uniqueGroup: blade
  - type: WeaponUpgradeDamage
    bonusDamage: { types: { Slash: 7 } }
  - type: Tag
    tags: [ CrusherUpgradeBlade, CrusherUpgradeBladeSharpness ]

- type: entity
  id: BaseCrusherUpgradeHandle
  parent: [ BaseItem, BaseSecurityCargoContraband ]
  name: crusher handle upgrade
  description: A modkit for crusher weapons.
  abstract: true
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
    name: crusher-upgrade-handle
    uniqueGroup: handle
  - type: StaticPrice
    price: 500
  - type: Tag
    tags: [ CrusherUpgradeHandle ]

- type: entity
  id: CrusherUpgradeHandleWeights
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (weights)
  description: A set of weighed loads that can be attached to a handle to make a weapon deal knockback to enemies.
  components:
  - type: Sprite
    state: handle-weights
  - type: ItemUpgrade
    name: crusher-upgrade-handle-weights
    uniqueGroup: handle
  - type: CrusherUpgradeComponents
    components:
    - type: MeleeThrowOnHit
      distance: 3
      speed: 3
  - type: Tag
    tags: [ CrusherUpgradeHandle, CrusherUpgradeHandleWeights ]

- type: entity
  id: CrusherUpgradeHandleLight
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (lightweight)
  description: A lightweight handle replacement that allows you to make attacks more frequently.
  components:
  - type: Sprite
    state: handle-lightweight
  - type: ItemUpgrade
    name: crusher-upgrade-handle-light
    uniqueGroup: handle
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.3
  - type: Tag
    tags: [ CrusherUpgradeHandle, CrusherUpgradeHandleLightweight ]

- type: entity
  id: CrusherUpgradeHandleRange
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (range)
  description: A long handle replacement that allows you to attack from farther away.
  components:
  - type: Sprite
    state: handle-spikes
  - type: ItemUpgrade
    name: crusher-upgrade-handle-range
    uniqueGroup: handle
  - type: WeaponUpgradeRange
    rangeMultiplier: 1.2
  - type: Tag
    tags: [ CrusherUpgradeHandle, CrusherUpgradeHandleRange ]

- type: entityTable
  id: CrusherUpgradesMain
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeMainMarker
    - id: CrusherUpgradeMainRudeBuster
- type: entityTable
  id: CrusherUpgradesBlade
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeBladeLavaAspect
    - id: CrusherUpgradeBladeIceFrost
    - id: CrusherUpgradeBladeSharpness
- type: entityTable
  id: CrusherUpgradesHandle
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeHandleWeights
    - id: CrusherUpgradeHandleLight
    - id: CrusherUpgradeHandleRange
- type: entityTable
  id: CrusherUpgrades
  table: !type:GroupSelector
    children:
    - !type:NestedSelector { tableId: CrusherUpgradesMain }
    - !type:NestedSelector { tableId: CrusherUpgradesBlade }
    - !type:NestedSelector
      tableId: CrusherUpgradesHandle
      weight: 2

- type: entity
  id: CrusherUpgradeFrame
  parent: BaseItem
  name: crusher upgrade frame
  description: An empty frame for the main crusher upgrade, can hold essence of dying lavaland creatures to use their energy for upgrades.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Upgrades/crusher.rsi
    state: base
  - type: Item
    size: Small
  - type: Tag
    tags: [ CrusherUpgradeFrame ]
