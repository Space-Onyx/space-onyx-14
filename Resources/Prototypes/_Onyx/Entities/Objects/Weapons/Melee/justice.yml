- type: entity
  id: Justice
  name: DT-2 'Justice'
  parent: [BaseItem, BaseGrandTheftContraband]
  description: An expensive and self-recharging energy sword designed specifically for the Head of Security.
  components:
  - type: Item
    sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
    size: Ginormous
    heldPrefix: off
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
    state: icon
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
    autoRechargePause: true
    autoRechargePauseTime: 40
  - type: DisarmMalus
  - type: Tag
    tags:
    - Justice
    - HighRiskItem
  - type: Execution
    doAfterDuration: 4
  - type: GhostRole
    name: justice-role-name
    description: justice-role-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: MobState
    allowedStates:
    - Alive
  - type: StealTarget
    stealGroup: WeaponSecHeadSword
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Common
    - Security
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 60
    animation: WeaponArcThrust
  - type: ItemSwitch
    needsPower: true
    defaultState: off
    state: "off"
    showLabel: true
    states:
      off: !type:ItemSwitchState
        verb: off
        energyPerUse: 0
        sprite:
          sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
          state: icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 15
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
          angle: 60
          animation: WeaponArcThrust
      stun: !type:ItemSwitchState
        verb: stun
        energyPerUse: 48
        sprite:
          sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
          state: stun-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Shock: 0
          angle: 60
          animation: WeaponArcThrust
        - type: StaminaDamageOnHit
          damage: 20
          overtime: 15
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.25
      ion: !type:ItemSwitchState
        verb: ion
        energyPerUse: 65
        sprite:
          sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
          state: ion-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Ion: 24
              Shock: 3
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Onyx/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.25
      lethal: !type:ItemSwitchState
        verb: lethal
        energyPerUse: 80
        sprite:
          sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
          state: lethal-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 6
              Heat: 12
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Onyx/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.25
      empowered: !type:ItemSwitchState
        verb: empowered
        energyPerUse: 999
        sprite:
          sprite: _Onyx/Objects/Weapons/Melee/justice.rsi
          state: empowered-icon
        components:
        - type: Explosive
          explosionType: Default
          totalIntensity: 16
          intensitySlope: 0.5
          maxIntensity: 1.6
          canCreateVacuum: false
          deleteAfterExplosion: false
          repeatable: true
        - type: ExplodeOnMeleeHit
        - type: MeleeWeapon
          canWideSwing: false
          attackRate: 0.5
          animation: WeaponArcThrust
          damage:
            types:
              Slash: 25
              Heat: 25
          soundHit:
            path: /Audio/_Onyx/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.25
