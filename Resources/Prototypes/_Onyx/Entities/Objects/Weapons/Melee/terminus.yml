- type: entity
  id: Terminus
  parent: [ BaseItem, BaseSecurityContraband ]
  components:
  - type: RestrictedMelee
    whitelist:
      tags: [ Oni ]
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Melee/terminus.rsi
    state: icon
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Melee/terminus.rsi
    slots: [ Back, suitStorage ]
  - type: AmmoCounter
  - type: Gun
    soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    fireRate: 1.5
    useKey: false
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatteryAmmoProvider
    proto: BulletDisablerSmgSpread
    fireCost: 100
  - type: MeleeWeapon
    attackRate: 0.8
    damage:
      types:
        Blunt: 12
        Slash: 12
    soundHit:
      collection: MetalThud
  - type: StaminaDamageOnHit
    damage: 30
  - type: Wieldable
  - type: GunRequiresWield
  - type: MeleeRequiresWield
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2
  - type: DisarmMalus
    malus: 0.75
  - type: Tool
    qualities: [ Prying ]
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Prying
  - type: UseDelay
    delay: 0.9
