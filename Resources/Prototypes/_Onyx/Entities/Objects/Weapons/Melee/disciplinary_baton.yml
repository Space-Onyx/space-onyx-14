- type: entity
  id: TelescopicBatonAdvanced
  parent: [ BaseItem, BaseCentcommContraband ]
  name: disciplinary baton
  description: A compact personal defense weapon designed to discipline shoddy workers. Sturdy enough to knock attackers off their feet.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Melee/telebaton.rsi
    layers:
    - state: icon-off
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    sprite: _Onyx/Objects/Weapons/Melee/telebaton.rsi
    size: Small
    storedRotation: -45
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/telescopicon.ogg
      params:
        volume: -2
    soundDeactivate:
      path: /Audio/Weapons/telescopicoff.ogg
      params:
        volume: -2
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Onyx/Weapons/Baton/woodhit.ogg
      params:
        variation: 0.25
    activatedDamage:
      types:
        Blunt: 15
  - type: ItemToggleSize
    activatedSize: Normal
    activatedShape:
    - 0,0,0,3
  - type: UseDelay
    delays:
      default:
        length: 1
      telebaton:
        length: 4
  - type: EntityEffectMelee
    effects:
    - !type:ModifyKnockdown
      time: 3
      drop: true
  - type: MeleeWeapon
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 1.5
    angle: 0
    damage:
      types:
        Blunt: 1
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon}
          False: {state: icon-off}
  - type: Clothing
    sprite: _Onyx/Objects/Weapons/Melee/telebaton.rsi
    slots:
    - Belt
  - type: UseDelayBlockMelee
    delays:
    - default
    - telebaton
