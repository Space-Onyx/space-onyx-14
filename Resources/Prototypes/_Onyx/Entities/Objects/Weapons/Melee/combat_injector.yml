- type: entity
  name: combat injector
  parent: [ BaseItem, BaseCentcommContraband ]
  id: CombatInjector
  description: Injects stored chemicals on hit.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Melee/blueshield_knife.rsi
    state: icon
  - type: Item
    size: Small
  - type: Solution
    id: injector
    solution:
      maxVol: 5
  - type: Injector
    solutionName: injector
    currentTransferAmount: 5
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: MeleeChemicalInjector
    transferAmount: 5
    solution: injector
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Piercing: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
