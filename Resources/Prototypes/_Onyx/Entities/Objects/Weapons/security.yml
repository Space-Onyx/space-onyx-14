- type: entity
  name: hypercharged flash
  parent: [ BaseItem, BaseCentcommContraband ]
  id: HyperFlash
  suffix: DO NOT MAP
  description: An ultrabright flashbulb with a trigger. This one is much more potent than an ordinary flash.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/flash.rsi
    layers:
    - state: flash
      map: ["enum.FlashVisualLayers.BaseLayer"]
    - state: flashing
      map: ["enum.FlashVisualLayers.LightLayer"]
      visible: false
      shader: unshaded
  - type: Flash
    flashingTime: 20
    aoeFlashDuration: 10
    slowTo: 0.2
    range: 15
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 0
    angle: 10
  - type: Item
    size: Small
    sprite: Objects/Weapons/Melee/flash.rsi
  - type: UseDelay
  - type: StaticPrice
    price: 700
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FlashVisuals.Burnt:
        enum.FlashVisualLayers.BaseLayer:
          True: {state: burnt}
      enum.FlashVisuals.Flashing:
        enum.FlashVisualLayers.LightLayer:
          True: {visible: true}
          False: {visible: false}

