- type: entity
  name: greatshield
  parent: [ BaseItem, ClothingSlotBase, BaseCentcommContraband ]
  id: BlueShieldShield
  description: The iconic namesake of the Blueshield, made to take shots meant for high-ranking officials.
  components:
  - type: ContainerContainer
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_Onyx/Weapons/Effects/nanotrasenenergyon.ogg
    soundDeactivate:
      path: /Audio/_Onyx/Weapons/Effects/nanotrasenenergyoff.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Onyx/Weapons/Effects/nanotrasenenergyhum.ogg
  - type: ItemToggleSize
    activatedSize: Ginormous
  - type: Clothing
    sprite: _Onyx/Objects/Shields/blueshieldshield.rsi
    quickEquip: false
    slots: [ Belt ]
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 1
  - type: Sprite
    sprite: _Onyx/Objects/Shields/blueshieldshield.rsi
    layers:
    - state: icon
    - state: icon-on
      visible: false
      shader: unshaded
      map: [ "shield" ]
  - type: Item
    size: Large
  - type: UseDelay
    delay: 0.5
  - type: ToggleableVisuals
    spriteLayer: shield
    inhandVisuals:
      left:
      - state: inhand-left-on
        shader: unshaded
      right:
      - state: inhand-right-on
        shader: unshaded
  - type: PointLight
    netsync: false
    enabled: false
    radius: 1.5
    energy: 0.7
    color: "#678AD9"
  - type: ItemTogglePointLight
  - type: Blocking
    passiveBlockFraction: 0.65
    passiveBlockModifier:
      coefficients:
        Blunt: 3
        Slash: 3
        Piercing: 3
        Heat: 3
    activeBlockModifier:
      coefficients:
        Blunt: 2
        Slash: 2
        Piercing: 2
        Heat: 2
      flatReductions:
        Heat: 3
        Blunt: 3
        Slash: 3
        Piercing: 3
  - type: Appearance
  - type: Injurable
    damageContainer: Shield
  - type: StaticPrice
    price: 350
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: ExaminableBattery
  - type: RechargeableBlocking
    dischargedRechargeRate: 0
    chargedRechargeRate: 0
  - type: ItemSlots
    slots:
      item:
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - Stunbaton

- type: entity
  parent: BaseShield
  id: UEGShield
  name: assault tower shield
  description: Shield that covers the wearer from head to toe, not everyone can lift this.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Weapons/Melee/ueg_shield.rsi
    state: ueg-icon
  - type: Item
    sprite: _Onyx/Objects/Weapons/Melee/ueg_shield.rsi
    size: Huge
    heldPrefix: ueg
  - type: StaticPrice
    price: 200
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
    activeBlockModifier:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
      flatReductions:
        Blunt: 5
        Slash: 5
        Piercing: 5
        Heat: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 190
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 2
            max: 4

- type: entity
  parent: BlueShieldShield
  id: BlueShieldShieldFilled
  suffix: Filled, DO NOT MAP
  components:
  - type: ContainerFill
    containers:
      item:
      - BlueshieldMace
