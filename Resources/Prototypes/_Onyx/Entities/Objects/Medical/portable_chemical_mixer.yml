- type: entity
  id: portableChemicalMixer
  parent: BaseItem
  name: portable chemical mixer
  description: A "Tider" grade chemical manipulator.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Tools/chemical_mixer.rsi
    layers:
    - state: chemical_mixer
  - type: Item
    size: Huge
  - type: ItemMapper
    containerWhitelist: [ beakerSlot ]
    mapLayers:
      chemical_mixer_beaker:
        whitelist:
          components: [ FitsInDispenser ]
  - type: Appearance
  - type: ChemMaster
    pillDosageLimit: 20
  - type: ActivatableUI
    key: enum.ChemMasterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ChemMasterUiKey.Key:
        type: ChemMasterBoundUserInterface
  - type: ContainerContainer
    containers:
      beakerSlot: !type:ContainerSlot
      outputSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components: [ FitsInDispenser ]
      outputSlot:
        whitelistFailPopup: chem-master-component-cannot-put-entity-message
        whitelist:
          tags: [ Bottle, PillCanister ]
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 600
        canReact: false
  - type: DumpableSolution
    solution: buffer
  - type: GuideHelp
    guides: [ Chemicals, Chemist ]
  - type: StaticPrice
    price: 20
  - type: SolutionItemStatus
    solution: buffer
  - type: Clothing
    slots: [ belt ]
  - type: Construction
    graph: portableChemicalMixerGraph
    node: end
