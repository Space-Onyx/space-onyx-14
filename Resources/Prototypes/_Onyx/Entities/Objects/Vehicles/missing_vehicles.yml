- type: entity
  id: VehicleSecway
  parent: BaseVehicleStrap
  name: secway
  description: The future of transportation. Popularized by St. James, the patron saint of security officers and internet forum moderators.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/secway.rsi
    state: vehicle
    noRot: true
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags: [SecwayKeys]
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags: [SecwayKeys]
        insertSound: /Audio/Effects/Vehicle/vehiclestartup.ogg
  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot

- type: entity
  id: VehicleSyndicateSegway
  parent: [VehicleSecway, BaseSyndicateContraband]
  name: syndicate segway
  description: Be an enemy of the corporation, in style.
  components:
  - type: Sprite
