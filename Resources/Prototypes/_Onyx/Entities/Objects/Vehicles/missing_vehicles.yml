- type: entity
  id: VehicleHoverchair
  parent: BaseVehicleStrap
  name: hoverchair
  description: A luxury hoverchair, kick back and relax.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Vehicles/hoverchair.rsi
    state: vehicle
    noRot: true
  - type: Vehicle
    requiresHands: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
