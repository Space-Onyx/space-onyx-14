- type: entity
  parent: BaseItem
  id: DiscoBeachBall
  name: disco beach ball
  description: A disco beach ball turns any beach trip into Studio 54.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balls/beach_ball.rsi
    state: icon
    color: "#FFFFFF"
  - type: PointLight
    radius: 8
    energy: 6
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RgbLightController
    cycleRate: 0.3
  - type: RotatingLight
    speed: 70
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Effects/Footsteps/bounce.ogg
  - type: MultiHandedItem
  - type: Item
    size: Large
    sprite: Objects/Fun/Balls/beach_ball.rsi
  - type: Anchorable
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
          ShardCrystalGreen:
            min: 1
            max: 1
          ShardCrystalBlue:
            min: 1
            max: 1
          ShardCrystalRed:
            min: 1
            max: 1
