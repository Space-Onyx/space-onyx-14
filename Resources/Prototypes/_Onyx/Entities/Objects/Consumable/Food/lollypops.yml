  - type: Sprite
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    state: lollypop-trash
  - type: Clothing
    quickEquip: false
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    slots: [ mask ]
  - type: Edible
    solution: food
  - type: FlavorProfile
    flavors:
