    items:
    - id: FoodSnackLollypopTrash
    - id: FoodSnackLollypop
      orGroup: LollypopMystery
    - id: FoodSnackLollypopDermaline
      orGroup: LollypopMystery
    - id: FoodSnackLollypopKelotane
      orGroup: LollypopMystery
    - id: FoodSnackLollypopBicaridine
