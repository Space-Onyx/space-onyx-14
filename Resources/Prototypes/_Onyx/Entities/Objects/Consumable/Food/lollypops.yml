- type: entity
  parent: BaseItem
  id: FoodSnackLollypopWrappedBase
  abstract: true
  description: A plain old lollypop. It's still in a wrapper.
  components:
  - type: SpaceGarbage
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    state: lollypop-wrapped
  - type: Item
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    size: Tiny

- type: entity
  parent: [ FoodBase, FoodInjectableBase ]
  id: FoodSnackLollypopBase
  abstract: true
  description: A plain old lollypop. It's cherry flavoured.
  components:
  - type: FlavorProfile
    flavors:
    - cherry
  - type: Edible
    trash:
    - FoodPacketLollypopTrash
  - type: Tag
    tags:
    - FoodSnack
    - ClothMade
  - type: Clothing
    quickEquip: false
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    slots: [ mask ]
  - type: Sprite
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#FFC0CB"
  - type: Item
    sprite: _Onyx/Objects/Consumable/Food/lollypop.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#FFC0CB"
      right:
      - state: inhand-right
        color: "#FFC0CB"
  - type: Solution
    solution:
      maxVol: 20
      reagents:
        - ReagentId: Sugar
          Quantity: 5
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 5
  - type: PassiveConsumable

- type: entity
  parent: FoodSnackLollypopBase
  id: FoodSnackLollypop
  name: lollypop
  description: A plain old lollypop. It's cherry flavoured!

