- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleLavalandImplant
  name: lavaland death rattle implant
  description: This implant informs the Supply radio channel if the user dies on the Lavaland surface, including exact coordinates.
  components:
  - type: SubdermalImplant
    permanent: true
    whitelist:
      components:
      - MobState
  - type: TriggerBlocker
    mapWhitelist:
      components:
      - LavalandMap
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: RattleOnTrigger
    radioChannel: Supply
    reportCoordinates: true

- type: entity
  id: DeathRattleLavalandImplanter
  suffix: Lavaland Death Rattle
  parent: BaseImplantOnlyImplanter
  components:
  - type: Implanter
    implant: DeathRattleLavalandImplant
