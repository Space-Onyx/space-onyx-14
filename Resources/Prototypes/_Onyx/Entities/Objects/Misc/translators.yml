- type: entity
  id: OnyxTranslatorBase
  parent:
  - BaseItem
  - PowerCellSlotMediumItem
  abstract: true
  name: translator
  description: Translates speech between Tau Ceti Basic and another language. Use it to toggle translation.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Devices/translator.rsi
    state: icon
    layers:
    - state: icon
    - state: translator
      shader: unshaded
      visible: false
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: _Onyx/Objects/Devices/translator.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
           True:
             visible: true
           False:
             visible: false
  - type: ItemToggle
  - type: PowerCellDraw
    drawRate: 1
  - type: HandheldTranslator
    translateWriting: false
    enabled: false
  - type: Clothing
    slots:
    - neck
    equipDelay: 0.3
    unequipDelay: 0.3
    quickEquip: false

- type: entity
  id: ChittinTranslator
  parent: OnyxTranslatorBase
  name: chittin translator
  components:
  - type: HandheldTranslator
    languages:
      TauCetiBasic: All
      Chittin: All
    requires:
    - TauCetiBasic
    - Chittin

