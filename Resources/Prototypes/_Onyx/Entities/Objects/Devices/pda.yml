- type: entity
  parent: BasePDA
  id: RoboticistPDA
  name: roboticist PDA
  description: It's covered with failed ambitions.
  components:
  - type: Pda
    id: RoboticistIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-roboticist
  - type: PdaBorderColor
    borderColor: "#161616"
    accentVColor: "#cc4d03"
  - type: Icon
    state: pda-roboticist

- type: entity
  parent: BaseMedicalPDA
  id: VirologistPDA
  name: virology PDA
  description: You're not sure if touching it is safe.
  components:
  - type: Pda
    id: VirologistIDCard

- type: entity
  parent: BaseMedicalPDA
  id: BlueshieldPDA
  name: blueshield officer PDA
  description: The silver shield of the Blueshield is engraved on the front.
  components:
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-blueshield
  - type: Pda
    id: BlueshieldIDCard
  - type: Icon
    sprite: _Onyx/Objects/Devices/pda.rsi
    state: pda-blueshield
  - type: Sprite
    sprite: _Onyx/Objects/Devices/pda.rsi
    state: pda-blueshield
  - type: PdaBorderColor
    borderColor: "#3c94c5"

- type: entity
  parent: BasePDA
  id: MinerPDA
  name: miner PDA
  description: Smells like ash.
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Devices/miner_pda.rsi
  - type: Pda
    id: MinerIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-shaftminer
  - type: PdaBorderColor
    borderColor: "#230a2c"
    accentVColor: "#c900c9"
  - type: Icon
    sprite: _Onyx/Objects/Devices/miner_pda.rsi
    state: pda-shaftminer
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: AstroNavCartridge
        - id: WalletCartridge
        - id: NanoChatCartridge
