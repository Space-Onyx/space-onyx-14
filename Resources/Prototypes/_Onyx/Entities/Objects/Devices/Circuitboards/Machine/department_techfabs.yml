- type: entity
  id: EngineeringTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: engineering techfab machine board
  description: A machine printed circuit board for an engineering techfab.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: EngineeringTechFab
    stackRequirements: &DepartmentTechFabStackRequirements
      Manipulator: 4
    tagRequirements: &DepartmentTechFabTagRequirements
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker

