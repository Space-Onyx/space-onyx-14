- type: entity
  name: anomaly pinpointer
  description: A handheld tracking device that tracks anomalies. Keep upright to retain accuracy.
  id: PinpointerAnomaly
  parent: PinpointerBase
  components:
  - type: Sprite
    sprite: _Onyx/Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer-science
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _Onyx/Objects/Devices/pinpointer.rsi
    state: pinpointer-science
  - type: Item
    sprite: _Onyx/Objects/Devices/pinpointer.rsi
  - type: Pinpointer
    component: Anomaly
    targetName: anomaly

