- type: species
  id: Felinid
  name: species-name-felinid
  roundStart: true
  prototype: MobFelinid
  dollPrototype: AppearanceFelinid
  skinColoration: HumanToned
  baseScale: "0.85, 0.85"
  defaultHeightCm: 155
  defaultWeightKg: 58
  minHeightCm: 135
  maxHeightCm: 170
  minWeightKg: 50
  maxWeightKg: 70

- type: markingsGroup
  parent: Human
  id: Felinid
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ FelinidEarsBasic ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FelinidTailBasic ]

- type: entity
  parent: AppearanceHuman
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganFelinidChest
      Groin: OrganFelinidGroin
      # </Onyx-ChestGroin-edited>
      Head: OrganFelinidHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Felinid

- type: entity
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  name: Urist McFelinid
  components:
  - type: Damageable
    damageModifierSet: Felinid
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Speech
    speechSounds: Alto
    allowedEmotes: [Hiss, Meow, Mew, Growl, Purr]
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, Nekomimetic]
    understands: [TauCetiBasic, Nekomimetic]

- type: damageModifierSet
  id: Felinid
  coefficients:
    Blunt: 1.15
    Slash: 1.15
    Piercing: 1.15

- type: entity
  parent: OrganHumanTorso
  id: OrganFelinidTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Felinid
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - Special

- type: entity
  parent: OrganHumanHead
  id: OrganFelinidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    markingData:
      group: Felinid
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
