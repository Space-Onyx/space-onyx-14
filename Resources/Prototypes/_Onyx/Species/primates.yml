- type: species
  id: Monkey
  name: species-name-monkey
  roundStart: false
  prototype: MobMonkey
  dollPrototype: MobMonkey
  skinColoration: Hues
  defaultSkinTone: "#ffffff"

- type: markingsGroup
  id: Monkey
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ MonkeyTailDefault ]

- type: marking
  id: MonkeyTailDefault
  groupWhitelist: [ Monkey ]
  bodyPart: Tail
  sprites: [{ sprite: _Onyx/Mobs/Monkey.rsi, state: tail }]

