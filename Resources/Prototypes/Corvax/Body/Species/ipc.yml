      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    # <Onyx-IPCGroin-edited>
    enum.HumanoidVisualLayers.Groin:
      limit: 1
      required: false
    # </Onyx-IPCGroin-edited>
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ IpcOrangeS ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIpc
  name: Ipc appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganIpcChest
      Groin: OrganIpcGroin
      # </Onyx-ChestGroin-edited>
      Head: OrganIpcHead
      ArmLeft: OrganIpcArmLeft
      ArmRight: OrganIpcArmRight
      HandRight: OrganIpcHandRight
      HandLeft: OrganIpcHandLeft
      LegLeft: OrganIpcLegLeft
      LegRight: OrganIpcLegRight
      FootLeft: OrganIpcFootLeft
      FootRight: OrganIpcFootRight
      Brain: OrganIpcBrain
      Eyes: OrganIPCEyes
      # <Onyx-IpcVoiceModulator>
      Tongue: OrganIpcTongue
      # </Onyx-IpcVoiceModulator>
  - type: HumanoidProfile
    species: Ipc

- type: entity
  parent:
  - AppearanceIpc
  - BaseSpeciesMob
  - MobBloodstream # <Onyx-IPCWounds>
  id: MobIpc
  name: Urist McHands
  components:
  # <Onyx-IPCWounds>
  - type: WoundHost
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
        - ReagentId: Oil
          Quantity: 250
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
  # </Onyx-IPCWounds>
  - type: Damageable
    damageModifierSet: Ipc
  - type: Injurable
    damageContainer: SiliconIpc
  # <Onyx-IPCSurgeryTargeting>
  - type: SurgeryTarget
  - type: Targeting
  # </Onyx-IPCSurgeryTargeting>
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        # <Onyx-IPCGroinDamage-edited>
        sprite: _Onyx/Wounds/brute_damage.rsi
        # </Onyx-IPCGroinDamage-edited>
        color: "#cd7314"
      Burn:
        # <Onyx-IPCGroinDamage-edited>
        sprite: _Onyx/Wounds/burn_damage.rsi
        # </Onyx-IPCGroinDamage-edited>
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: Speech
    speechSounds: Alto
    allowedEmotes: [ Boop, Whirr ] # <Onyx-RacialEmoteSounds>
  - type: ZombieImmune
  - type: Vocal
    emoteSounds: UnisexIpc # <Onyx-RacialEmoteSounds-edited>
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, RobotTalk]
    understands: [TauCetiBasic, RobotTalk]
  # </Onyx-Languages>
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
  - type: FireVisuals
    alternateState: Standing
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.IpcFaceUiKey.Face:
        type: IpcFaceUserInterface
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: BodyEmotes
    soundsId: IpcEmotes
###
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: light
  - type: PointLight
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    radius: 4
    netsync: false
  - type: HandheldLight
    toggleOnInteract: false
    wattage: 0.2
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
###
  - type: TypingIndicator
    proto: robot
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: PowerCellDraw
    drawRate: 0.8
  # <Onyx-BatteryDrinker>
  - type: BatteryDrinker
    blacklist:
      tags: [IPCDrinkBlacklist]
  # </Onyx-BatteryDrinker>
  - type: AccessReader
    access: [ ["Ipc"] ]
  - type: Access
    enabled: true
    tags:
      - Ipc
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Lock
    unlockOnClick: false
  - type: ItemSlotsLock
    slots:
    - cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: Ipc
  # <Onyx-CyberneticRepair>
  - type: Repairable
    treatmentCapabilities: [Mechanical]
    damage:
      types:
        Blunt: -8
        Slash: -6
        Piercing: -5
        Heat: -7
        Cold: -6
        Caustic: -4
    fuelCost: 5
    doAfterDelay: 3
    selfRepairPenalty: 2
  # </Onyx-CyberneticRepair>
  - type: DamagedSiliconAccent
  - type: Reflect
    reflectProb: 0.05
  - type: SleepEmitSound
    snore: /Audio/Machines/buzz-two.ogg
    interval: 30
    popUp: sleep-ipc
  - type: Butcherable
    spawned:
      - id: OrganIpcHead
        amount: 1
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: Fingerprint
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Ipc
    # <Onyx-BatteryDrinker>
    - IPCDrinkBlacklist
    # </Onyx-BatteryDrinker>
###
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 273.15
    coldDamage:
      types:
        Cold: 0 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.8
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2

