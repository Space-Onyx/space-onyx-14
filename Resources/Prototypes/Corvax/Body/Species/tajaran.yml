- type: markingsGroup
  parent: Undergarments
  id: Tajaran
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      onlyGroupWhitelisted: true
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Ears: # <Onyx-VisualEars-edited>
      limit: 1
      required: true
      default: [ TajaranOutears ]
    # <Onyx-VisualEars>
    enum.HumanoidVisualLayers.EarsOverlay:
      limit: 1
      required: false
    # </Onyx-VisualEars>
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.SnoutCover:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TajaranTailM ]
    # <Onyx-TajaranGroin-edited>
    enum.HumanoidVisualLayers.Groin:
      limit: 1
      required: false
    # </Onyx-TajaranGroin-edited>
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    # <Onyx-Underwear-edited>
    # Undergarment marking defaults removed in favor of wearable underwear items.
    # </Onyx-Underwear-edited>

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTajaran
  name: Tajaran appearance
  components:
  - type: InitialBody
    organs:
      # <Onyx-ChestGroin-edited>
      Chest: OrganTajaranChest
      Groin: OrganTajaranGroin
      # </Onyx-ChestGroin-edited>
      Head: OrganTajaranHead
      ArmLeft: OrganTajaranArmLeft
      ArmRight: OrganTajaranArmRight
      HandRight: OrganTajaranHandRight
      HandLeft: OrganTajaranHandLeft
      LegLeft: OrganTajaranLegLeft
      LegRight: OrganTajaranLegRight
      FootLeft: OrganTajaranFootLeft
      FootRight: OrganTajaranFootRight
      Brain: OrganTajaranBrain
      Eyes: OrganTajaranEyes
      Tongue: OrganTajaranTongue
      Appendix: OrganTajaranAppendix
      Ears: OrganTajaranEars # <Onyx-VisualEars-edited>
      Lungs: OrganTajaranLungs
      Heart: OrganTajaranHeart
      Stomach: OrganTajaranStomach
      Liver: OrganTajaranLiver
      Kidneys: OrganTajaranKidneys
  - type: ProfileOrgans # <Onyx-ProfileOrgans>
    organs:
      Tail: { prototype: OrganTajaranTail, parent: Groin, presenceLayers: [ Tail, TailOverlay ] }
  - type: HumanoidProfile
    species: Tajaran
  - type: Inventory
    # <Onyx-Underwear>
    templateId: humanNoSocks
    # </Onyx-Underwear>
    speciesId: corvaxtajaran
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: outerclothing

- type: entity
  save: false
  name: Urist McTajar
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  id: MobTajaran
  components:
  - type: Hunger
    baseDecayRate: 0.02
  - type: Thirst
    baseDecayRate: 0.15
  - type: ContentEye
  - type: Speech
    allowedEmotes: [ 'Purr', 'Hiss', 'Meow', 'Mew', 'Growl' ] # <Onyx-RacialEmoteSounds-edited>
  - type: Vocal
    emoteSounds: MaleTajaran
  # <Onyx-Languages>
  - type: LanguageKnowledge
    speaks: [TauCetiBasic, SiikMaas]
    understands: [TauCetiBasic, SiikMaas]
  # </Onyx-Languages>
  - type: GrowlingAccent
  - type: MeleeWeapon
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Slash: 7
  - type: Damageable
    damageModifierSet: Tajaran
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2.0
    damageRecovery:
      types:
        Asphyxiation: -2.0

